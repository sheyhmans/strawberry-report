<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Каталог | Strawberry POS</title>


<style>

*{
box-sizing:border-box;
font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Arial,sans-serif;
}


body{

margin:0;

background:#09090b;

color:white;

}



.app{

max-width:430px;

margin:auto;

padding:25px 18px 40px;

}




.header{

display:flex;

align-items:center;

gap:15px;

margin-bottom:25px;

}



.back{

width:45px;

height:45px;

background:#18181b;

border-radius:15px;

display:flex;

align-items:center;

justify-content:center;

font-size:25px;

}




h1{

margin:0;

font-size:25px;

}



.header p{

margin:5px 0;

color:#999;

}




.card{

background:#18181b;

border-radius:24px;

padding:20px;

margin-bottom:15px;

}



input,select{

width:100%;

height:52px;

background:#09090b;

border:1px solid #333;

border-radius:16px;

color:white;

padding:0 15px;

font-size:16px;

margin-top:10px;

margin-bottom:15px;

}




button{

width:100%;

height:52px;

border:0;

border-radius:17px;

background:#ff2d55;

color:white;

font-size:16px;

font-weight:600;

}



.product{

background:#111;

border-radius:18px;

padding:15px;

margin-top:12px;

display:flex;

justify-content:space-between;

align-items:center;

}



.name{

font-size:17px;

}



.price{

color:#ff4d6d;

font-weight:600;

}



.empty{

text-align:center;

color:#777;

padding:25px;

}


</style>


</head>


<body>


<div class="app">


<div class="header">


<div class="back" onclick="history.back()">
‹
</div>


<div>

<h1>Каталог</h1>

<p>Товары и цены</p>

</div>


</div>




<div class="card">


<h3>
Новый товар
</h3>



<input id="name" placeholder="Название товара">



<input id="price" type="number" placeholder="Цена">



<select id="unit">

<option value="шт">
Штучный товар (шт)
</option>


<option value="кг">
Весовой товар (кг)
</option>


<option value="г">
Весовой товар (г)
</option>


</select>




<button onclick="addProduct()">

＋ Добавить товар

</button>


</div>






<div class="card">


<h3>
Список товаров
</h3>


<div id="products">

<div class="empty">
Товаров пока нет
</div>


</div>


</div>



</div>




<script>


let products =
JSON.parse(localStorage.getItem("products")) || [];



function addProduct(){


let name=
document.getElementById("name").value;


let price=
Number(document.getElementById("price").value);


let unit=
document.getElementById("unit").value;



if(!name || !price){

alert("Заполните данные");

return;

}



products.push({

name:name,

price:price,

unit:unit

});



localStorage.setItem(

"products",

JSON.stringify(products)

);



document.getElementById("name").value="";

document.getElementById("price").value="";



showProducts();


}





function showProducts(){


let box=
document.getElementById("products");



if(products.length===0){

box.innerHTML=
'<div class="empty">Товаров пока нет</div>';

return;

}



box.innerHTML="";



products.forEach(item=>{


box.innerHTML+=`

<div class="product">


<div class="name">

${item.name}

</div>



<div class="price">

${item.price} ₽ / ${item.unit}

</div>



</div>

`;

});


}



showProducts();



</script>


</body>

</html>
