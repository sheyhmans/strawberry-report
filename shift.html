<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Продажи | Strawberry POS</title>

<style>

*{
box-sizing:border-box;
font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Arial,sans-serif;
}

body{
margin:0;
background:#09090b;
color:white;
}

.app{
max-width:430px;
margin:auto;
padding:25px 18px 40px;
}


.header{
display:flex;
align-items:center;
gap:15px;
margin-bottom:20px;
}

.back{
width:45px;
height:45px;
background:#18181b;
border-radius:15px;
display:flex;
align-items:center;
justify-content:center;
font-size:25px;
}


h1{
margin:0;
font-size:25px;
}

.header p{
margin:5px 0;
color:#999;
}



.status{

background:#18181b;

border-radius:20px;

padding:18px;

margin-bottom:18px;

border:1px solid #252525;

}


.status b{

color:#30d158;

font-size:18px;

}



.card{

background:#18181b;

border-radius:24px;

padding:20px;

margin-bottom:15px;

}



input,select{

width:100%;

height:52px;

background:#09090b;

border:1px solid #333;

border-radius:16px;

color:white;

padding:0 15px;

font-size:16px;

margin-top:10px;

margin-bottom:15px;

}



button{

width:100%;

height:52px;

border:0;

border-radius:17px;

font-size:16px;

font-weight:600;

}



.primary{

background:#ff2d55;

color:white;

}


.finish{

background:#ff453a;

color:white;

margin-top:15px;

}



.client{

background:#111;

padding:15px;

border-radius:18px;

margin-top:10px;

border:1px solid transparent;

}


.client.active{

border-color:#ff2d55;

}



.sale{

display:flex;

justify-content:space-between;

padding:12px 0;

border-bottom:1px solid #333;

}



.total{

font-size:32px;

font-weight:700;

color:#ff4d6d;

}



.lock{

text-align:center;

padding:30px 10px;

color:#999;

}


.empty{

color:#777;

text-align:center;

padding:20px;

}

</style>

</head>


<body>


<div class="app">


<div class="header">

<div class="back" onclick="history.back()">
‹
</div>

<div>

<h1>Продажи</h1>

<p>Текущая смена</p>

</div>

</div>




<div class="status">

<div id="statusText">

</div>

</div>




<div id="content">


<div class="lock">

Сначала начните смену<br>
на главном экране

</div>


</div>



</div>



<script>


let active =
localStorage.getItem("shiftActive");


let products =
JSON.parse(localStorage.getItem("products")) || [];


let clients=[];

let currentClient=null;



let content=document.getElementById("content");

let status=document.getElementById("statusText");




if(active==="true"){

status.innerHTML =
"🟢 <b>Смена активна</b><br><small>"
+
(localStorage.getItem("shiftStart") || "")
+
"</small>";


loadShift();


}else{


status.innerHTML =
"🔴 Смена не начата";


}





function loadShift(){


content.innerHTML=`

<div class="card">

<h3>
Клиент
</h3>

<input id="clientName" placeholder="Имя клиента">


<button class="primary" onclick="addClient()">
＋ Добавить клиента
</button>


<div id="clients"></div>


</div>



<div class="card">


<h3>
Товар
</h3>


<select id="product">

<option>
Выберите товар
</option>

</select>


<input id="count" type="number" value="1">


<button class="primary" onclick="addProduct()">
Добавить товар клиенту
</button>


</div>




<div class="card">

<h3>
Покупка
</h3>


<div id="current">

Клиент не выбран

</div>


</div>



<div class="card">

<h3>
Итого смена
</h3>


<div class="total" id="total">
0 ₽
</div>


<button class="finish" onclick="finishShift()">
Завершить смену
</button>


</div>

`;



let select=document.getElementById("product");


products.forEach((item,index)=>{


select.innerHTML+=`

<option value="${index}">
${item.name} — ${item.price} ₽
</option>

`;

});


}





function addClient(){


let name=document.getElementById("clientName").value;


if(!name)return;


let client={

name:name,

items:[]

};


clients.push(client);


currentClient=client;


document.getElementById("clientName").value="";


render();


}





function render(){


let box=document.getElementById("clients");

if(!box)return;


box.innerHTML="";


clients.forEach((c,i)=>{


box.innerHTML+=`

<div class="client ${c===currentClient?'active':''}"
onclick="selectClient(${i})">

${c.name}

</div>

`;

});


showCurrent();


}





function selectClient(i){

currentClient=clients[i];

render();

}





function addProduct(){


if(!currentClient){

alert("Выберите клиента");

return;

}


let select=document.getElementById("product");


let product=products[select.value];


let count=
Number(document.getElementById("count").value);



currentClient.items.push({

name:product.name,

count:count,

sum:product.price*count

});


render();


}





function showCurrent(){


let box=document.getElementById("current");

if(!box)return;



if(!currentClient){

box.innerHTML="Клиент не выбран";

return;

}


let html="";


let total=0;


currentClient.items.forEach(item=>{


total+=item.sum;


html+=`

<div class="sale">

<span>
${item.name} × ${item.count}
</span>


<b>
${item.sum} ₽
</b>


</div>

`;

});


box.innerHTML=html || "Товаров нет";


updateTotal();

}




function updateTotal(){


let total=0;


clients.forEach(c=>{

c.items.forEach(i=>{

total+=i.sum;

});

});


document.getElementById("total").innerHTML =
total+" ₽";


}





function finishShift(){


if(clients.length===0){

alert("Нет продаж");

return;

}


let history=
JSON.parse(localStorage.getItem("history")) || [];



let total=0;


clients.forEach(c=>{

c.items.forEach(i=>{

total+=i.sum;

});

});



history.push({

date:new Date().toLocaleString("ru-RU"),

clients:clients,

total:total

});



localStorage.setItem(
"history",
JSON.stringify(history)
);



localStorage.removeItem("shiftActive");

localStorage.removeItem("shiftStart");



alert("Смена завершена");


location.reload();


}



</script>


</body>

</html>
