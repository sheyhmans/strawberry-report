<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Продажи | Strawberry POS</title>

<style>

*{
box-sizing:border-box;
font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Arial,sans-serif;
}

body{
margin:0;
background:#09090b;
color:white;
}

.app{
max-width:430px;
margin:auto;
padding:25px 18px 40px;
}


.header{
display:flex;
align-items:center;
gap:15px;
margin-bottom:25px;
}

.back{
width:45px;
height:45px;
background:#18181b;
border-radius:15px;
display:flex;
align-items:center;
justify-content:center;
font-size:25px;
}


h1{
margin:0;
font-size:25px;
}

.header p{
margin:5px 0;
color:#999;
}



.card{

background:#18181b;
border-radius:24px;
padding:20px;
margin-bottom:15px;
border:1px solid #252525;

}



input,select{

width:100%;
height:50px;

background:#09090b;

border:1px solid #333;

border-radius:15px;

color:white;

padding:0 15px;

font-size:16px;

margin-top:10px;

margin-bottom:15px;

}



button{

width:100%;
height:52px;

border:none;

border-radius:17px;

font-size:16px;

font-weight:600;

}



.primary{

background:#ff2d55;
color:white;

}


.secondary{

background:white;
color:#111;

}



.client{

display:flex;
justify-content:space-between;
align-items:center;

padding:15px;

background:#111;

border-radius:18px;

margin-top:10px;

}



.client.active{

border:1px solid #ff2d55;

}



.client-name{

font-size:17px;

}



.total{

font-size:30px;

font-weight:700;

color:#ff4d6d;

}



.sale{

padding:12px 0;

border-bottom:1px solid #333;

display:flex;

justify-content:space-between;

}



.empty{

text-align:center;

color:#777;

padding:20px;

}



</style>

</head>


<body>


<div class="app">


<div class="header">

<div class="back" onclick="history.back()">
‹
</div>

<div>

<h1>Продажи</h1>

<p id="shiftStatus">
Смена не начата
</p>

</div>

</div>




<div class="card">


<button class="primary" onclick="startShift()">

▶ Начать смену

</button>


</div>




<div class="card">


<h3>
Клиент
</h3>


<input id="clientName" placeholder="Имя клиента">


<button class="secondary" onclick="addClient()">

＋ Добавить клиента

</button>


<div id="clients"></div>


</div>





<div class="card">


<h3>
Товар
</h3>


<select id="product">

<option>
Выберите товар
</option>

</select>



<input id="count" type="number" value="1">



<button class="primary" onclick="addProduct()">

Добавить товар клиенту

</button>


</div>





<div class="card">


<h3>
Текущий клиент
</h3>


<div id="current">

Клиент не выбран

</div>


</div>




<div class="card">


<h3>
Итого смена
</h3>


<div class="total" id="total">

0 ₽

</div>


</div>



</div>



<script>


let products =
JSON.parse(localStorage.getItem("products")) || [];


let clients = [];


let currentClient = null;


let shiftStarted = false;


let select=document.getElementById("product");



products.forEach((item,index)=>{


let option=document.createElement("option");

option.value=index;

option.textContent =
item.name+" — "+item.price+" ₽";


select.appendChild(option);


});





function startShift(){

shiftStarted=true;

document.getElementById("shiftStatus").innerHTML =
"Смена активна";


}




function addClient(){


let name=document.getElementById("clientName").value;


if(!name) return;


let client={

name:name,

items:[]

};


clients.push(client);


currentClient=client;


document.getElementById("clientName").value="";


showClients();

showCurrent();


}





function showClients(){


let box=document.getElementById("clients");


box.innerHTML="";


clients.forEach((client,index)=>{


box.innerHTML+=`

<div class="client ${client===currentClient?'active':''}" onclick="selectClient(${index})">

<div class="client-name">

${client.name}

</div>


<div>

›

</div>


</div>

`;


});


}





function selectClient(index){

currentClient=clients[index];

showClients();

showCurrent();

}





function addProduct(){


if(!currentClient){

alert("Сначала выберите клиента");

return;

}



let index=select.value;


if(index==="Выберите товар") return;



let product=products[index];


let count=
Number(document.getElementById("count").value);



currentClient.items.push({

name:product.name,

count:count,

sum:product.price*count

});


showCurrent();


}




function showCurrent(){


let box=document.getElementById("current");


if(!currentClient){

box.innerHTML="Клиент не выбран";

return;

}



let total=0;


let html=`<h3>${currentClient.name}</h3>`;


currentClient.items.forEach(item=>{


total+=item.sum;


html+=`

<div class="sale">

<span>
${item.name} × ${item.count}
</span>


<b>
${item.sum} ₽
</b>


</div>

`;

});


html+=`

<br>

<b>
Итого клиента: ${total} ₽
</b>

`;



box.innerHTML=html;



updateTotal();


}




function updateTotal(){


let total=0;


clients.forEach(client=>{

client.items.forEach(item=>{

total+=item.sum;

});

});


document.getElementById("total").innerHTML =
total+" ₽";


}



</script>


</body>

</html>
