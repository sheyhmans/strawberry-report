<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Продажи | Strawberry POS</title>

<style>

*{
box-sizing:border-box;
font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Arial,sans-serif;
}

body{
margin:0;
background:#09090b;
color:#fff;
}

.app{
max-width:430px;
margin:auto;
padding:25px 18px 40px;
}

.header{
display:flex;
align-items:center;
gap:15px;
margin-bottom:20px;
}

.back{
width:45px;
height:45px;
border-radius:15px;
background:#18181b;
display:flex;
align-items:center;
justify-content:center;
font-size:28px;
}

h1{
margin:0;
font-size:25px;
}

.header p{
margin:5px 0 0;
color:#999;
}

.status{
background:#18181b;
border-radius:20px;
padding:16px;
margin-bottom:15px;
}

.card{
background:#18181b;
border-radius:24px;
padding:20px;
margin-bottom:15px;
}

input, select{

width:100%;
height:52px;

background:#09090b;

border:1px solid #333;

border-radius:16px;

color:white;

padding:0 15px;

font-size:16px;

margin-top:10px;

}

button{

width:100%;
height:52px;

border:0;

border-radius:17px;

font-size:16px;

font-weight:600;

margin-top:12px;

}

.primary{
background:#ff2d55;
color:white;
}

.green{
background:#30d158;
color:#000;
}

.red{
background:#ff453a;
color:white;
}

.client{

background:#111;

border-radius:18px;

padding:15px;

margin-top:10px;

}

.product{

display:flex;

justify-content:space-between;

padding:12px 0;

border-bottom:1px solid #333;

}

.total{

font-size:30px;

font-weight:700;

color:#ff4d6d;

}

.small{

color:#999;

font-size:14px;

}

.lock{

text-align:center;

padding:40px 10px;

color:#999;

}

.payment input{

margin-top:8px;

}

</style>

</head>


<body>


<div class="app">


<div class="header">

<div class="back" onclick="history.back()">
‹
</div>


<div>

<h1>Продажи</h1>

<p>Текущая смена</p>

</div>

</div>


<div id="status" class="status"></div>


<div id="content"></div>


</div>


<script>


let active =
localStorage.getItem("shiftActive");


let products =
JSON.parse(localStorage.getItem("products")) || [];


let clients =
JSON.parse(localStorage.getItem("shiftClients")) || [];


let expenses =
JSON.parse(localStorage.getItem("shiftExpenses")) || [];


let currentClient = null;


const status =
document.getElementById("status");


const content =
document.getElementById("content");



if(active === "true"){


status.innerHTML = `

🟢 <b>Смена активна</b><br>

<span class="small">

${localStorage.getItem("shiftStart") || ""}

</span>

`;


showShift();


}

else{


status.innerHTML = `

🔴 <b>Смена не начата</b>

`;


content.innerHTML = `

<div class="lock">

Сначала начните смену<br>

на главном экране

</div>

`;

}



function showShift(){


content.innerHTML = `


<div class="card">


<h3>Новый клиент</h3>


<input id="clientName" placeholder="Имя клиента">


<button class="primary" onclick="createClient()">

Добавить клиента

</button>


</div>


<div id="clientBlock"></div>


<div class="card">

<h3>
Клиенты за смену
</h3>

<div id="clientsList"></div>

</div>


<div class="card">


<h3>
Итоги смены
</h3>


<div class="total" id="shiftTotal">

0 ₽

</div>


<div id="paymentsTotal"></div>


<button class="red" onclick="finishShift()">

Завершить смену

</button>


</div>


`;

renderClientsList();
updateTotals();


}
  function createClient(){


let name =
document.getElementById("clientName").value;


if(!name)return;



currentClient={

name:name,

items:[],

payment:null

};



document.getElementById("clientName").value="";


showClient();


}




function showClient(){


let box =
document.getElementById("clientBlock");


box.innerHTML=`


<div class="card">


<h3>

${currentClient.name}

</h3>


<select id="productSelect" onchange="selectProduct()">


<option>

Выберите товар

</option>


</select>


<div id="amountBox"></div>



<button class="primary" onclick="addItem()">

Добавить товар

</button>



<div id="items"></div>


<div id="clientSum"></div>


<div id="paymentBox"></div>


</div>


`;



let select =
document.getElementById("productSelect");



products.forEach((p,i)=>{


select.innerHTML += `

<option value="${i}">

${p.name} — ${p.price} ₽/${p.unit}

</option>

`;

});


}




function selectProduct(){


let index =
document.getElementById("productSelect").value;


let p =
products[index];


let box =
document.getElementById("amountBox");



if(!p)return;



if(p.unit==="кг"){


box.innerHTML=`

<input id="kg" type="number" placeholder="Килограммы">

<input id="gram" type="number" placeholder="Граммы">

`;

}


else if(p.unit==="г"){


box.innerHTML=`

<input id="gram" type="number" placeholder="Граммы">

`;

}


else{


box.innerHTML=`

<input id="count" type="number" placeholder="Количество">

`;

}


}




function addItem(){


let index =
document.getElementById("productSelect").value;


let p =
products[index];


if(!p)return;


let amount=0;

let text="";



if(p.unit==="кг"){


let kg =
Number(document.getElementById("kg").value || 0);


let gram =
Number(document.getElementById("gram").value || 0);



amount =
kg + gram/1000;


text =
kg+" кг "+gram+" г";


}


else if(p.unit==="г"){


let gram =
Number(document.getElementById("gram").value || 0);



amount =
gram/1000;


text =
gram+" г";


}


else{


let count =
Number(document.getElementById("count").value || 0);



amount=count;


text =
count+" шт";


}



let sum =
Math.round(p.price * amount);



currentClient.items.push({

name:p.name,

amount:text,

sum:sum

});



renderClient();


}





function renderClient(){


let box =
document.getElementById("items");


let html="";


let total=0;



currentClient.items.forEach(i=>{


total += i.sum;



html += `

<div class="product">

<span>

${i.name}<br>

${i.amount}

</span>


<b>

${i.sum} ₽

</b>


</div>

`;

});


box.innerHTML=html;



document.getElementById("clientSum").innerHTML=

`

<br>

<h3>

Итого клиента: ${total} ₽

</h3>

`;



showPayment(total);


}





function showPayment(total){


document.getElementById("paymentBox").innerHTML=

`

<div class="payment">


<h3>

Оплата клиента

</h3>


<input id="cash" type="number" placeholder="Наличные">


<input id="transfer" type="number" placeholder="Перевод">


<input id="terminal" type="number" placeholder="Терминал">


<button class="green" onclick="closeClient(${total})">

Закрыть клиента

</button>


</div>

`;

}



function closeClient(total){


let cash =
Number(document.getElementById("cash").value || 0);


let transfer =
Number(document.getElementById("transfer").value || 0);


let terminal =
Number(document.getElementById("terminal").value || 0);



if(cash+transfer+terminal !== total){


alert("Оплата не совпадает с суммой клиента");

return;


}



currentClient.payment={

cash:cash,

transfer:transfer,

terminal:terminal

};



clients.push(currentClient);



localStorage.setItem(

"shiftClients",

JSON.stringify(clients)

);



currentClient=null;


updateTotals();

renderClientsList();


alert("Клиент сохранён");


showShift();


}
  function renderClientsList(){

let box =
document.getElementById("clientsList");


if(!box)return;



let html="";



clients.forEach(c=>{


let total=0;


c.items.forEach(i=>{

total += i.sum;

});



html += `

<div class="client">


<b>${c.name}</b>


<br><br>


${c.items.map(i=>`

${i.name} ${i.amount} — ${i.sum} ₽

`).join("<br>")}


<br><br>


<b>

Итого: ${total} ₽

</b>


<br>


<span class="small">


Оплата:

💵 ${c.payment.cash} ₽ |

💳 ${c.payment.transfer} ₽ |

🧾 ${c.payment.terminal} ₽


</span>


</div>

`;

});


box.innerHTML =
html || "Клиентов пока нет";


}





function updateTotals(){


let total=0;

let cash=0;

let transfer=0;

let terminal=0;



clients.forEach(c=>{


c.items.forEach(i=>{


total += i.sum;


});



if(c.payment){


cash += c.payment.cash || 0;

transfer += c.payment.transfer || 0;

terminal += c.payment.terminal || 0;


}


});



let shiftTotal =
document.getElementById("shiftTotal");



if(shiftTotal)

shiftTotal.innerHTML =
total+" ₽";



let payments =
document.getElementById("paymentsTotal");



if(payments)


payments.innerHTML = `


💵 Наличные: ${cash} ₽<br>

💳 Перевод: ${transfer} ₽<br>

🧾 Терминал: ${terminal} ₽


`;



}




function finishShift(){



let cash=0;

let transfer=0;

let terminal=0;

let sales=0;



clients.forEach(c=>{


c.items.forEach(i=>{

sales+=i.sum;

});


if(c.payment){

cash += c.payment.cash || 0;

transfer += c.payment.transfer || 0;

terminal += c.payment.terminal || 0;

}


});



let haveExpense =
confirm("Были расходы за смену?");



let expenseTotal=0;

let shiftExpenses=[];



if(haveExpense){


let more=true;



while(more){


let name =
prompt("За что был расход?");



let sum =
Number(prompt("Сумма расхода") || 0);



if(name && sum){


shiftExpenses.push({

name:name,

sum:sum

});


expenseTotal += sum;


}



more =
confirm("Добавить ещё расход?");


}



}



let finalCash =
cash - expenseTotal;



let report={


date:
new Date().toLocaleString(),


sales:sales,


cash:cash,


transfer:transfer,


terminal:terminal,


expenses:shiftExpenses,


expenseTotal:expenseTotal,


finalCash:finalCash,


clients:clients


};



localStorage.setItem(

"lastShiftReport",

JSON.stringify(report)

);



localStorage.removeItem("shiftActive");

localStorage.removeItem("shiftClients");



alert(

`Смена закрыта


Продажи: ${sales} ₽


Наличные: ${cash} ₽


Переводы: ${transfer} ₽


Терминал: ${terminal} ₽


Расходы: ${expenseTotal} ₽


Остаток налички:

${finalCash} ₽`

);



location.reload();



}



</script>

</body>

</html>
