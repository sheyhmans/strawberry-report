<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Продажи | Strawberry POS</title>

<style>

*{
box-sizing:border-box;
font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Arial,sans-serif;
}

body{
margin:0;
background:#09090b;
color:white;
}

.app{
max-width:430px;
margin:auto;
padding:25px 18px 40px;
}

.header{
display:flex;
align-items:center;
gap:15px;
margin-bottom:20px;
}

.back{
width:45px;
height:45px;
background:#18181b;
border-radius:15px;
display:flex;
align-items:center;
justify-content:center;
font-size:25px;
}

h1{
margin:0;
font-size:25px;
}

.header p{
margin:5px 0;
color:#999;
}

.card{
background:#18181b;
border-radius:24px;
padding:20px;
margin-bottom:15px;
}

input,select{

width:100%;
height:50px;

background:#09090b;

border:1px solid #333;

border-radius:16px;

color:white;

padding:0 15px;

font-size:16px;

margin-top:10px;

margin-bottom:12px;

}

button{

width:100%;
height:52px;

border:0;

border-radius:17px;

font-size:16px;

font-weight:600;

}

.primary{
background:#ff2d55;
color:white;
}

.finish{
background:#ff453a;
color:white;
margin-top:15px;
}


.status{

background:#18181b;
padding:15px;
border-radius:18px;
margin-bottom:15px;

}


.client{

background:#111;
padding:15px;
border-radius:18px;
margin-top:10px;

}



.active{

border:1px solid #ff2d55;

}


.sale{

display:flex;
justify-content:space-between;

padding:12px 0;

border-bottom:1px solid #333;

}



.total{

font-size:32px;

font-weight:700;

color:#ff4d6d;

}



.lock{

text-align:center;

color:#999;

padding:30px;

}


</style>

</head>


<body>


<div class="app">


<div class="header">

<div class="back" onclick="history.back()">‹</div>

<div>

<h1>Продажи</h1>

<p>Текущая смена</p>

</div>

</div>


<div class="status" id="status"></div>



<div id="content"></div>



</div>



<script>


let active =
localStorage.getItem("shiftActive");


let products =
JSON.parse(localStorage.getItem("products")) || [];


let clients=[];

let currentClient=null;



if(active==="true"){

document.getElementById("status").innerHTML=
"🟢 Смена активна";

load();


}else{


document.getElementById("status").innerHTML=
"🔴 Смена не начата";


document.getElementById("content").innerHTML=
`

<div class="lock">

Начните смену<br>
на главном экране

</div>

`;

}





function load(){


document.getElementById("content").innerHTML=`

<div class="card">

<h3>Клиент</h3>

<input id="clientName" placeholder="Имя клиента">


<button class="primary" onclick="addClient()">

Добавить клиента

</button>


<div id="clients"></div>

</div>




<div class="card">


<h3>Товар</h3>


<select id="product" onchange="changeUnit()">

<option>
Выберите товар
</option>

</select>


<div id="weightBox"></div>


<button class="primary" onclick="addProduct()">

Добавить товар

</button>


</div>




<div class="card">

<h3>Покупка</h3>

<div id="current">

Клиент не выбран

</div>


</div>



<div class="card">


<h3>Итого смена</h3>


<div class="total" id="total">

0 ₽

</div>


<button class="finish" onclick="finishShift()">

Завершить смену

</button>


</div>

`;



let select=document.getElementById("product");



products.forEach((p,i)=>{

select.innerHTML+=`

<option value="${i}">

${p.name} — ${p.price} ₽/${p.unit}

</option>

`;

});


}




function changeUnit(){


let product=
products[document.getElementById("product").value];


let box=document.getElementById("weightBox");



if(!product)return;



if(product.unit==="кг"){

box.innerHTML=`

<input id="kg" type="number" placeholder="Килограммы">


<input id="gram" type="number" placeholder="Граммы">

`;

}

else if(product.unit==="г"){


box.innerHTML=`

<input id="gram" type="number" placeholder="Граммы">

`;

}

else{


box.innerHTML=

`
<input id="count" type="number" value="1" placeholder="Количество">

`;

}



}





function addClient(){


let name=
document.getElementById("clientName").value;


if(!name)return;


let c={

name:name,

items:[]

};


clients.push(c);

currentClient=c;


document.getElementById("clientName").value="";


render();

}




function render(){


let box=document.getElementById("clients");


box.innerHTML="";


clients.forEach((c,i)=>{


box.innerHTML+=`

<div class="client ${c===currentClient?'active':''}"
onclick="selectClient(${i})">

${c.name}

</div>

`;

});


showCurrent();


}



function selectClient(i){

currentClient=clients[i];

render();

}





function addProduct(){


if(!currentClient){

alert("Выберите клиента");

return;

}



let index=
document.getElementById("product").value;


let p=products[index];


let quantity=0;

let title="";



if(p.unit==="кг"){


let kg=
Number(document.getElementById("kg").value || 0);


let g=
Number(document.getElementById("gram").value || 0);



quantity=kg+(g/1000);


title=
kg+" кг "+g+" г";


}


else if(p.unit==="г"){


let g=
Number(document.getElementById("gram").value);


quantity=g/1000;


title=
g+" г";


}

else{


let count=
Number(document.getElementById("count").value);


quantity=count;


title=
count+" шт";


}



let sum;



if(p.unit==="кг"){

sum=p.price*quantity;

}

else if(p.unit==="г"){

sum=p.price*quantity;

}

else{

sum=p.price*quantity;

}




currentClient.items.push({

name:p.name,

quantity:title,

sum:Math.round(sum)

});



showCurrent();


}




function showCurrent(){


let box=document.getElementById("current");


if(!currentClient){

box.innerHTML="Клиент не выбран";

return;

}



let html="<h3>"+currentClient.name+"</h3>";



let clientTotal=0;



currentClient.items.forEach(i=>{


clientTotal+=i.sum;


html+=`

<div class="sale">

<span>

${i.name}<br>
${i.quantity}

</span>


<b>
${i.sum} ₽
</b>

</div>

`;

});



html+=
"<br>Итого клиента: "+clientTotal+" ₽";



box.innerHTML=html;


updateTotal();


}





function updateTotal(){


let total=0;


clients.forEach(c=>{

c.items.forEach(i=>{

total+=i.sum;

});

});


document.getElementById("total").innerHTML=
total+" ₽";


}





function finishShift(){

alert("Смена завершена");

localStorage.removeItem("shiftActive");

localStorage.removeItem("shiftStart");

location.reload();

}


</script>


</body>

</html>
