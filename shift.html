<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Продажи | Strawberry POS</title>

<style>

*{
box-sizing:border-box;
font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Arial,sans-serif;
}

body{
margin:0;
background:#09090b;
color:white;
}

.app{
max-width:430px;
margin:auto;
padding:25px 18px 40px;
}


.header{
display:flex;
align-items:center;
gap:15px;
margin-bottom:20px;
}

.back{
width:45px;
height:45px;
background:#18181b;
border-radius:15px;
display:flex;
align-items:center;
justify-content:center;
font-size:25px;
}


h1{
margin:0;
font-size:25px;
}

.header p{
margin:5px 0;
color:#999;
}



.status{

background:#18181b;
border-radius:20px;
padding:18px;
margin-bottom:15px;
border:1px solid #252525;

}



.card{

background:#18181b;
border-radius:24px;
padding:20px;
margin-bottom:15px;

}



input,select{

width:100%;
height:52px;

background:#09090b;

border:1px solid #333;

border-radius:16px;

color:white;

padding:0 15px;

font-size:16px;

margin-top:10px;

margin-bottom:12px;

}



button{

width:100%;
height:52px;

border:0;

border-radius:17px;

font-size:16px;

font-weight:600;

}



.primary{

background:#ff2d55;
color:white;

}



.finish{

background:#ff453a;
color:white;

}



.client{

background:#111;

padding:15px;

border-radius:18px;

margin-top:10px;

border:1px solid transparent;

}



.client.active{

border-color:#ff2d55;

}



.sale{

display:flex;

justify-content:space-between;

padding:12px 0;

border-bottom:1px solid #333;

}



.total{

font-size:32px;

font-weight:700;

color:#ff4d6d;

}



.lock{

text-align:center;

padding:35px 10px;

color:#999;

}



.small{

color:#999;

font-size:14px;

}



</style>

</head>


<body>


<div class="app">


<div class="header">

<div class="back" onclick="history.back()">
‹
</div>


<div>

<h1>Продажи</h1>

<p>Текущая смена</p>

</div>

</div>



<div class="status" id="status">

</div>



<div id="content">

</div>



</div>

  <script>

let active =
localStorage.getItem("shiftActive");


let products =
JSON.parse(localStorage.getItem("products")) || [];


let clients = [];

let currentClient = null;



let status =
document.getElementById("status");


let content =
document.getElementById("content");




if(active === "true"){

status.innerHTML = `
🟢 <b>Смена активна</b><br>
<span class="small">
Начало: ${localStorage.getItem("shiftStart") || ""}
</span>
`;

loadShift();


}else{


status.innerHTML =
"🔴 Смена не начата";


content.innerHTML = `

<div class="lock">

Сначала начните смену<br>
на главном экране

</div>

`;

}





function loadShift(){


content.innerHTML = `


<div class="card">


<h3>
Клиент
</h3>


<input id="clientName" placeholder="Имя клиента">


<button class="primary" onclick="addClient()">

＋ Добавить клиента

</button>



<div id="clients"></div>


</div>





<div class="card">


<h3>
Товар
</h3>


<select id="product" onchange="changeUnit()">

<option>
Выберите товар
</option>

</select>


<div id="weightBox"></div>



<button class="primary" onclick="addProduct()">

Добавить товар клиенту

</button>


</div>





<div class="card">


<h3>
Покупка

</h3>


<div id="current">

Клиент не выбран

</div>


</div>





<div class="card">


<h3>
Итого смена

</h3>


<div class="total" id="total">
0 ₽
</div>


<button class="finish" onclick="openFinish()">

Завершить смену

</button>


<div id="finishBox"></div>


</div>



`;



let select =
document.getElementById("product");



products.forEach((p,i)=>{


select.innerHTML += `

<option value="${i}">

${p.name} — ${p.price} ₽/${p.unit}

</option>

`;

});


}




function changeUnit(){


let index =
document.getElementById("product").value;


let p =
products[index];


let box =
document.getElementById("weightBox");



if(!p) return;



if(p.unit==="кг"){


box.innerHTML=`

<input id="kg" type="number" placeholder="Килограммы">

<input id="gram" type="number" placeholder="Граммы">

`;

}


else if(p.unit==="г"){


box.innerHTML=`

<input id="gram" type="number" placeholder="Граммы">

`;

}


else{


box.innerHTML=`

<input id="count" type="number" value="1" placeholder="Количество">

`;

}


}




function addClient(){


let name =
document.getElementById("clientName").value;



if(!name) return;



let client={

name:name,

items:[]

};



clients.push(client);


currentClient=client;



document.getElementById("clientName").value="";



render();


}




function render(){


let box =
document.getElementById("clients");



if(!box)return;



box.innerHTML="";



clients.forEach((c,i)=>{


box.innerHTML += `

<div class="client ${c===currentClient?'active':''}"

onclick="selectClient(${i})">

${c.name}

</div>

`;

});


showCurrent();


}




function selectClient(i){


currentClient =
clients[i];


render();


}




function addProduct(){



if(!currentClient){

alert("Сначала выберите клиента");

return;

}



let index =
document.getElementById("product").value;



let p =
products[index];



let text="";

let quantity=0;



if(p.unit==="кг"){


let kg =
Number(document.getElementById("kg").value || 0);


let gram =
Number(document.getElementById("gram").value || 0);



quantity =
kg + gram/1000;



text =
kg+" кг "+gram+" г";


}



else if(p.unit==="г"){



let gram =
Number(document.getElementById("gram").value || 0);


quantity =
gram/1000;


text =
gram+" г";


}


else{


let count =
Number(document.getElementById("count").value || 0);


quantity=count;


text=count+" шт";


}



let sum =
Math.round(p.price * quantity);



currentClient.items.push({

name:p.name,

quantity:text,

sum:sum

});



showCurrent();



}




function showCurrent(){


let box =
document.getElementById("current");



if(!currentClient){

box.innerHTML="Клиент не выбран";

return;

}



let html =
"<h3>"+currentClient.name+"</h3>";



let total=0;



currentClient.items.forEach(item=>{


total += item.sum;



html += `

<div class="sale">

<span>

${item.name}<br>

${item.quantity}

</span>


<b>

${item.sum} ₽

</b>


</div>

`;

});


html +=

"<br><b>Итого клиента: "+total+" ₽</b>";



box.innerHTML=html;



updateTotal();


}





function updateTotal(){


let total=0;



clients.forEach(c=>{


c.items.forEach(i=>{


total += i.sum;


});


});



document.getElementById("total").innerHTML =
total+" ₽";


}




function openFinish(){


document.getElementById("finishBox").innerHTML=`

<br>


<input id="cash" type="number" placeholder="Наличные">


<input id="transfer" type="number" placeholder="Перевод">


<input id="expense" type="number" placeholder="Расходы">


<input id="comment" placeholder="Комментарий">


<button class="primary" onclick="finishShift()">

Сохранить смену

</button>


`;



}




function finishShift(){



let total=0;



clients.forEach(c=>{


c.items.forEach(i=>{


total += i.sum;


});


});



let history =
JSON.parse(localStorage.getItem("history")) || [];



history.push({


date:new Date().toLocaleString("ru-RU"),


start:
localStorage.getItem("shiftStart"),


end:
new Date().toLocaleString("ru-RU"),


clients:clients,


total:total,


cash:Number(document.getElementById("cash").value || 0),


transfer:Number(document.getElementById("transfer").value || 0),


expense:Number(document.getElementById("expense").value || 0),


comment:
document.getElementById("comment").value



});



localStorage.setItem(
"history",
JSON.stringify(history)
);



localStorage.removeItem("shiftActive");

localStorage.removeItem("shiftStart");



alert("Смена сохранена");


location.href="history.html";


}



</script>


</body>

</html>
