<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Новая смена</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="app">


<h1>🍓 Новая смена</h1>



<div class="card">


<label>
Дата смены
</label>

<input id="date" type="date">



<label>
Цвет касса
</label>

<input id="colorCash" type="number" placeholder="10000">



<label>
Фрукт касса
</label>

<input id="fruitCash" type="number" placeholder="15000">


</div>





<div id="clients">


<div class="client card">


<h2>
Клиент №1
</h2>



<div class="products">



<div class="product">


<label>
Товар
</label>


<select class="productSelect">

<option>
Выберите товар
</option>

</select>




<label>
Количество
</label>

<input class="quantity" type="number" value="1">



<label>
Дополнение
</label>

<input class="productInfo" type="text" placeholder="290гр, скидка">



<label>
Своя цена (если нужно)
</label>

<input class="customPrice" type="number" placeholder="Оставить пустым">



<p>

Сумма:
<span class="productTotal">
0
</span>₽

</p>



<button onclick="removeProduct(this)">
❌ Удалить товар
</button>



</div>


</div>




<button onclick="addProduct(this)">
➕ Добавить товар
</button>




<h3>
Итого клиента:
<span class="clientTotal">
0
</span>₽
</h3>




<label>
Оплата
</label>


<select class="payment">

<option>
Нал
</option>

<option>
Перевод
</option>

<option>
Терминал
</option>

</select>



<label>
Время
</label>

<input class="paymentTime" type="text" placeholder="01:27">



<button onclick="removeClient(this)">
❌ Удалить клиента
</button>



</div>


</div>





<button onclick="addClient()">
👤 Добавить клиента
</button>





<div class="card">


<label>
Расходы
</label>

<input id="expenses" type="text" placeholder="Доставка 350">



<label>
По клубникам
</label>

<input id="strawberryInfo" type="text" placeholder="Информация по клубнике">


</div>





<button onclick="createReport()">
📋 Создать отчет
</button>

  <button onclick="saveCurrentShift()">
💾 Сохранить смену
</button>

<button onclick="loadCurrentShift()">
🔄 Загрузить смену
</button>

<button onclick="clearCurrentShift()">
🗑 Очистить смену
</button>




<div id="reportResult" class="card" style="display:none">


<h2>
Готовый отчет
</h2>


<textarea id="reportText"></textarea>


<button onclick="copyReport()">
📋 Копировать отчет
</button>


</div>





<a href="index.html">

<button>
⬅ Назад
</button>

</a>



</div>



<script src="app.js"></script>


</body>

</html>
