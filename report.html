<!DOCTYPE html>
<html lang="ru">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Новая смена — STRAWBERRY</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="app">

<h1>🍓 Новая смена</h1>


<div class="card">

<label>Дата смены</label>
<input id="date" type="text" placeholder="27.07 - 28.07">


<label>Цвет касса</label>
<input id="colorCash" type="number" placeholder="10000">


<label>Фрукт касса</label>
<input id="fruitCash" type="number" placeholder="15000">

</div>


<div id="clients">


<div class="client card">

<h2>Клиент №1</h2>


<div class="products">


<div class="product">


<label>Название товара</label>
<input type="text" placeholder="Ст.клубника в шк">


<label>Количество</label>
<input type="text" placeholder="2">


<label>Сумма товара</label>
<input type="number" placeholder="1800">


<button onclick="removeProduct(this)">
❌ Удалить товар
</button>


</div>


</div>


<button onclick="addProduct(this)">
➕ Добавить товар
</button>



<label>Оплата</label>

<select>
<option>Нал</option>
<option>Перевод</option>
<option>Терминал</option>
</select>


<label>Сумма оплаты</label>
<input type="number" placeholder="1800">


<label>Время</label>
<input type="text" placeholder="01:27">


<button onclick="removeClient(this)">
❌ Удалить клиента
</button>


</div>


</div>


<button onclick="addClient()">
👤 Добавить клиента
</button>


<div class="card">

<label>Расходы</label>

<input type="text" placeholder="Доставка 350">

</div>


<button onclick="createReport()">
📋 Сформировать отчет
</button>


</div>


<script src="app.js"></script>

</body>

</html>
