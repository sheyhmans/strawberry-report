<!DOCTYPE html>
<html lang="ru">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Новая смена — STRAWBERRY</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="app">

<h1>🍓 Новая смена</h1>


<div class="field">
<label>Дата смены</label>
<input type="text" placeholder="27.07 - 28.07">
</div>


<div class="field">
<label>Цвет касса</label>
<input type="number" placeholder="10000">
</div>


<div class="field">
<label>Фрукт касса</label>
<input type="number" placeholder="15000">
</div>


<div class="client">

<h2>Клиент №1</h2>


<h3>Товар 1</h3>

<div class="field">
<label>Название товара</label>
<input type="text" placeholder="Например: Ст.клубника в шк">
</div>


<div class="field">
<label>Количество</label>
<input type="number" placeholder="2">
</div>


<div class="field">
<label>Сумма товара</label>
<input type="number" placeholder="1800">
</div>


<button onclick="addProduct()">
➕ Добавить товар
</button>


<div class="field">
<label>Оплата</label>

<select>
<option>Нал</option>
<option>Перевод</option>
<option>Терминал</option>
</select>

</div>


<div class="field">
<label>Сумма оплаты</label>
<input type="number" placeholder="1800">
</div>


<div class="field">
<label>Время</label>
<input type="text" placeholder="01:27">
</div>


</div>


<button>
👤 Добавить клиента
</button>


<div class="field">

<label>Расходы</label>

<input type="text" placeholder="Например: Доставка 350">

</div>


<button>
📋 Сформировать отчет
</button>


</div>

<script src="app.js"></script>
</body>

</html>
