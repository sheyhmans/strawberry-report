<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Strawberry POS</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Касса">
    <link rel="apple-touch-icon" href="https://img.icons8.com/emoji/192/strawberry-emoji.png">

    <style>
        :root {
            --bg: #f2f2f7;
            --card-bg: #ffffff;
            --card-sub: #f8f9fa;
            --border: #e5e5ea;
            --primary: #ff2d55;
            --primary-light: #fff0f3;
            --accent-green: #34c759;
            --green-light: #eafaf1;
            --text-main: #1c1c1e;
            --text-sub: #8e8e93;
            --radius-lg: 20px;
            --radius-md: 14px;
            --radius-sm: 10px;
            --shadow: 0 4px 16px rgba(0, 0, 0, 0.05);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            padding: 16px;
            padding-bottom: 170px; /* Запас от нижней панели Safari */
            padding-top: max(16px, env(safe-area-inset-top));
        }

        /* Шапка */
        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .app-header h1 {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .header-btns {
            display: flex;
            gap: 8px;
        }

        .btn-round {
            background: var(--card-bg);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            box-shadow: var(--shadow);
            cursor: pointer;
        }
        .btn-round:active { transform: scale(0.96); }

        /* Карточки */
        .card {
            background: var(--card-bg);
            border-radius: var(--radius-lg);
            padding: 16px;
            margin-bottom: 14px;
            box-shadow: var(--shadow);
            border: 1px solid rgba(0,0,0,0.03);
        }

        .row { display: flex; gap: 10px; }
        .row > div { flex: 1; }

        label {
            display: block;
            font-size: 11px;
            font-weight: 700;
            color: var(--text-sub);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input, textarea, select {
            width: 100%;
            background: var(--card-sub);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 12px 14px;
            border-radius: var(--radius-md);
            font-size: 15px;
            font-weight: 600;
            outline: none;
            transition: all 0.2s;
        }
        input:focus, textarea:focus {
            border-color: var(--primary);
            background: #fff;
        }

        /* Главная кнопка открытия каталога */
        .btn-select-product {
            background: linear-gradient(135deg, #ff2d55 0%, #ff3b30 100%);
            color: #fff;
            width: 100%;
            padding: 16px;
            border-radius: var(--radius-md);
            font-size: 16px;
            font-weight: 700;
            border: none;
            box-shadow: 0 4px 15px rgba(255, 45, 85, 0.3);
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
            cursor: pointer;
        }
        .btn-select-product:active { transform: scale(0.98); }

        /* Табы клиентов */
        .client-tabs {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 6px;
            margin-bottom: 12px;
        }

        .tab-item {
            background: var(--card-sub);
            border: 1px solid var(--border);
            color: var(--text-sub);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            white-space: nowrap;
            cursor: pointer;
        }
        .tab-item.active {
            background: var(--text-main);
            color: #fff;
            border-color: var(--text-main);
        }

        /* Состав текущего чека */
        .receipt-box {
            background: var(--card-sub);
            border: 1px dashed var(--border);
            border-radius: var(--radius-md);
            padding: 12px;
            margin-bottom: 14px;
        }

        .receipt-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid var(--border);
            font-size: 14px;
        }
        .receipt-row:last-child { border-bottom: none; }

        /* Тип оплаты */
        .pay-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
            margin-bottom: 12px;
        }

        .pay-btn {
            background: var(--card-sub);
            border: 1px solid var(--border);
            color: var(--text-sub);
            padding: 10px 0;
            border-radius: var(--radius-sm);
            font-size: 12px;
            font-weight: 700;
            text-align: center;
            cursor: pointer;
        }
        .pay-btn.active {
            background: var(--green-light);
            color: var(--accent-green);
            border-color: var(--accent-green);
        }

        /* Нижняя фиксированная панель */
        .bottom-bar {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid var(--border);
            padding: 12px 16px max(20px, env(safe-area-inset-bottom)) 16px;
            z-index: 100;
            box-shadow: 0 -4px 20px rgba(0,0,0,0.05);
        }

        .btn-copy {
            background: linear-gradient(135deg, #34c759 0%, #28a745 100%);
            color: #fff;
            border: none;
            padding: 16px;
            border-radius: var(--radius-md);
            font-weight: 700;
            font-size: 16px;
            width: 100%;
            box-shadow: 0 4px 15px rgba(52, 199, 89, 0.3);
            cursor: pointer;
        }
        .btn-copy:active { transform: scale(0.98); }

        /* Шторка (Modal Sheet) */
        .sheet-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(6px);
            z-index: 200;
            align-items: flex-end;
        }

        .sheet-body {
            background: #ffffff;
            border-radius: 28px 28px 0 0;
            padding: 20px 20px max(24px, env(safe-area-inset-bottom)) 20px;
            width: 100%;
            max-height: 80vh;
            overflow-y: auto;
            animation: slideUp 0.2s ease-out;
        }

        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }

        .sheet-pill {
            width: 36px; height: 5px;
            background: var(--border);
            border-radius: 3px;
            margin: 0 auto 16px auto;
        }

        .list-item {
            background: var(--card-sub);
            border: 1px solid var(--border);
            padding: 14px;
            border-radius: var(--radius-md);
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
        }
        .list-item:active { background: var(--primary-light); border-color: var(--primary); }

        .quick-weight {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin: 12px 0;
        }

        .qw-btn {
            background: var(--card-sub);
            border: 1px solid var(--border);
            padding: 12px 0;
            border-radius: var(--radius-sm);
            font-size: 13px;
            font-weight: 700;
            text-align: center;
        }
        .qw-btn:active { background: var(--primary); color: #fff; }

        .report-preview {
            background: #1c1c1e;
            color: #34c759;
            font-family: monospace;
            padding: 14px;
            border-radius: var(--radius-md);
            font-size: 12px;
            white-space: pre-wrap;
            max-height: 200px;
            overflow-y: auto;
        }
    </style>
</head>
<body>

    <!-- Шапка -->
    <div class="app-header">
        <h1>🍓 Strawberry POS</h1>
        <div class="header-btns">
            <button class="btn-round" onclick="openManageCatalog()">⚙️ Товары</button>
            <button class="btn-round" onclick="openReportSheet()">📄 Отчёт</button>
        </div>
    </div>

    <!-- ДАТА И КАССА -->
    <div class="card">
        <div class="row">
            <div>
                <label>Даты смены</label>
                <input type="text" id="shiftDate" oninput="saveData()">
            </div>
            <div>
                <label>Касса (₽)</label>
                <input type="text" id="cashRegister" value="10.000" oninput="saveData()">
            </div>
        </div>
    </div>

    <!-- ВЫБОР ТОВАРА ИЗ СПИСКА -->
    <button class="btn-select-product" onclick="openProductSelectSheet()">
        <span>🛍️ Выбрать товар из каталога</span>
        <span style="font-size: 18px;">+</span>
    </button>

    <!-- АКТИВНЫЙ ЧЕК КЛИЕНТА -->
    <div class="card">
        <!-- Табы клиентов -->
        <div class="client-tabs" id="clientTabs"></div>

        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
            <label style="margin:0;" id="activeClientTitle">ЧЕК КЛИЕНТА 1</label>
            <span style="font-size:12px; color:var(--primary); font-weight:700; cursor:pointer;" onclick="clearCurrentCart()">Очистить</span>
        </div>

        <!-- Позиции в чеке -->
        <div class="receipt-box" id="receiptItems">
            <div style="text-align:center; color:var(--text-sub); font-size:13px; padding:8px;">Чек пуст. Выберите товар выше 👆</div>
        </div>

        <!-- Оплата -->
        <label>Способ оплаты</label>
        <div class="pay-grid">
            <div class="pay-btn active" onclick="setPayType('Нал')">Нал</div>
            <div class="pay-btn" onclick="setPayType('Перевод')">Перевод</div>
            <div class="pay-btn" onclick="setPayType('Терминал')">Терминал</div>
            <div class="pay-btn" onclick="setPayType('Долг')">Долг</div>
        </div>

        <!-- Поля клиента -->
        <div class="row">
            <div>
                <label>Примечание</label>
                <input type="text" id="clientNote" placeholder="напр. Муса Вип" oninput="updateClientData()">
            </div>
            <div>
                <label>Время</label>
                <div style="display:flex; gap:4px;">
                    <input type="text" id="clientTime" placeholder="14:30" oninput="updateClientData()">
                    <button class="btn-round" style="padding:0 10px;" onclick="setNowTime()">🕒</button>
                </div>
            </div>
        </div>
    </div>

    <!-- РАСХОД И КЛУБНИКА -->
    <div class="card">
        <div class="row" style="margin-bottom: 12px;">
            <div>
                <label>Расход</label>
                <input type="text" id="expenses" placeholder="не было" oninput="saveData()">
            </div>
            <div style="flex:0.4; display:flex; align-items:flex-end;">
                <button class="btn-round" style="width:100%; padding:12px; border-radius:12px;" onclick="document.getElementById('expenses').value='не было'; saveData();">Не было</button>
            </div>
        </div>
        <label>Заметки по клубникам</label>
        <input type="text" id="strawberries" placeholder="продаж не было" oninput="saveData()">
    </div>

    <!-- ФИКСИРОВАННАЯ КНОПКА СНИЗУ -->
    <div class="bottom-bar">
        <button class="btn-copy" onclick="copyReport()">📋 Скопировать итоговый отчёт</button>
    </div>

    <!-- ШТОРКА 1: ВЫБОР ТОВАРА ИЗ СПИСКА -->
    <div class="sheet-overlay" id="productSelectSheet">
        <div class="sheet-body">
            <div class="sheet-pill"></div>
            <h3 style="font-size:18px; font-weight:800; margin-bottom:14px;">Каталог товаров</h3>
            <div id="selectProductList"></div>
            <button class="btn-round" style="width:100%; margin-top:10px; padding:14px;" onclick="closeSheet('productSelectSheet')">Закрыть</button>
        </div>
    </div>

    <!-- ШТОРКА 2: ВВОД ВЕСА ИЛИ КОЛИЧЕСТВА -->
    <div class="sheet-overlay" id="addItemSheet">
        <div class="sheet-body">
            <div class="sheet-pill"></div>
            <h3 id="sheetProdTitle" style="font-size:18px; font-weight:800; margin-bottom:12px;"></h3>
            
            <div id="pieceMode">
                <label>Количество (шт)</label>
                <input type="number" id="pieceInput" value="1" min="1">
            </div>

            <div id="weightMode" style="display:none;">
                <label>Быстрый выбор веса</label>
                <div class="quick-weight">
                    <div class="qw-btn" onclick="setGrams(250)">250г</div>
                    <div class="qw-btn" onclick="setGrams(500)">500г</div>
                    <div class="qw-btn" onclick="setGrams(750)">750г</div>
                    <div class="qw-btn" onclick="setGrams(1000)">1 кг</div>
                    <div class="qw-btn" onclick="setGrams(1500)">1.5 кг</div>
                    <div class="qw-btn" onclick="setGrams(2000)">2 кг</div>
                </div>
                <label>Точный вес в граммах</label>
                <input type="number" id="weightInput" placeholder="например, 380" oninput="updateWeightCalc()">
                <div style="margin-top:12px; font-size:16px; color:var(--accent-green); font-weight:800;" id="weightCalcText">Сумма: 0 ₽</div>
            </div>

            <button class="btn-select-product" style="margin-top:16px; justify-content:center;" onclick="confirmAddItem()">Добавить в чек</button>
            <button class="btn-round" style="width:100%; padding:12px;" onclick="closeSheet('addItemSheet')">Отмена</button>
        </div>
    </div>

    <!-- ШТОРКА 3: РЕПОРАТ ПРЕДПРОСМОТР -->
    <div class="sheet-overlay" id="reportSheet">
        <div class="sheet-body">
            <div class="sheet-pill"></div>
            <h3 style="font-size:18px; font-weight:800; margin-bottom:12px;">Предпросмотр отчёта</h3>
            <div class="report-preview" id="reportPreview"></div>
            <button class="btn-copy" style="margin-top:14px;" onclick="copyReport()">Скопировать отчёт</button>
            <button class="btn-round" style="width:100%; margin-top:8px; padding:12px;" onclick="closeSheet('reportSheet')">Закрыть</button>
        </div>
    </div>

    <!-- ШТОРКА 4: НАСТРОЙКА КАТАЛОГА -->
    <div class="sheet-overlay" id="manageCatalogSheet">
        <div class="sheet-body">
            <div class="sheet-pill"></div>
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;">
                <h3 style="font-size:18px; font-weight:800;">Управление ценами</h3>
                <button class="btn-round" style="color:var(--primary);" onclick="addNewProductPrompt()">+ Новый</button>
            </div>
            <div id="manageCatalogList"></div>
            <button class="btn-round" style="width:100%; margin-top:10px; padding:14px;" onclick="closeSheet('manageCatalogSheet')">Готово</button>
        </div>
    </div>

    <script>
        let catalog = [
            { id: 1, name: "Ст.клубника в шк", price: 900, type: "piece" },
            { id: 2, name: "Ст.ананас", price: 1200, type: "piece" },
            { id: 3, name: "Клубника (кг)", price: 600, type: "weight" },
            { id: 4, name: "Роза красная", price: 250, type: "piece" },
            { id: 5, name: "Доставка", price: 350, type: "piece" }
        ];

        let clients = [
            { id: 1, note: '', items: [], payType: 'Нал', time: '' }
        ];
        let activeClientId = 1;
        let activeProd = null;

        function initDate() {
            const today = new Date();
            const tomorrow = new Date(today);
            tomorrow.setDate(today.getDate() + 1);
            const fmt = (d) => String(d.getDate()).padStart(2, '0') + '.' + String(d.getMonth() + 1).padStart(2, '0');
            return `${fmt(today)}-${fmt(tomorrow)}`;
        }

        function loadData() {
            const saved = localStorage.getItem('strawberry_pos_v5');
            if (saved) {
                const data = JSON.parse(saved);
                document.getElementById('shiftDate').value = data.shiftDate || initDate();
                document.getElementById('cashRegister').value = data.cashRegister || '10.000';
                document.getElementById('expenses').value = data.expenses || '';
                document.getElementById('strawberries').value = data.strawberries || 'продаж не было';
                clients = data.clients && data.clients.length ? data.clients : clients;
                if (data.catalog) catalog = data.catalog;
            } else {
                document.getElementById('shiftDate').value = initDate();
                document.getElementById('strawberries').value = 'продаж не было';
            }
            renderTabs();
            renderActiveClient();
            updateReport();
        }

        function saveData() {
            const data = {
                shiftDate: document.getElementById('shiftDate').value,
                cashRegister: document.getElementById('cashRegister').value,
                expenses: document.getElementById('expenses').value,
                strawberries: document.getElementById('strawberries').value,
                clients, catalog
            };
            localStorage.setItem('strawberry_pos_v5', JSON.stringify(data));
            updateReport();
        }

        function getCurrentClient() {
            return clients.find(c => c.id === activeClientId) || clients[0];
        }

        function renderTabs() {
            const container = document.getElementById('clientTabs');
            container.innerHTML = '';

            clients.forEach((c, idx) => {
                const tab = document.createElement('div');
                tab.className = `tab-item ${c.id === activeClientId ? 'active' : ''}`;
                tab.innerText = `Клиент ${idx + 1}` + (c.note ? ` (${c.note})` : '');
                tab.onclick = () => {
                    activeClientId = c.id;
                    renderTabs();
                    renderActiveClient();
                };
                container.appendChild(tab);
            });

            const addBtn = document.createElement('div');
            addBtn.className = 'tab-item';
            addBtn.style.color = 'var(--primary)';
            addBtn.innerText = '+ Клиент';
            addBtn.onclick = () => {
                const newId = Date.now();
                clients.push({ id: newId, note: '', items: [], payType: 'Нал', time: '' });
                activeClientId = newId;
                renderTabs();
                renderActiveClient();
                saveData();
            };
            container.appendChild(addBtn);
        }

        function renderActiveClient() {
            const c = getCurrentClient();
            const idx = clients.findIndex(x => x.id === activeClientId);
            document.getElementById('activeClientTitle').innerText = `ЧЕК КЛИЕНТА ${idx + 1}`;
            document.getElementById('clientNote').value = c.note || '';
            document.getElementById('clientTime').value = c.time || '';

            // Оплата
            const payBtns = document.querySelectorAll('.pay-btn');
            payBtns.forEach(b => b.classList.toggle('active', b.innerText === c.payType));

            // Список товаров в чеке
            const box = document.getElementById('receiptItems');
            box.innerHTML = '';

            if (!c.items || c.items.length === 0) {
                box.innerHTML = `<div style="text-align:center; color:var(--text-sub); font-size:13px; padding:8px;">Чек пуст. Выберите товар выше 👆</div>`;
                return;
            }

            c.items.forEach((item, i) => {
                const div = document.createElement('div');
                div.className = 'receipt-row';
                div.innerHTML = `
                    <div>
                        <strong>${item.name}</strong>
                        <div style="font-size:11px; color:var(--text-sub);">${item.detail}</div>
                    </div>
                    <div style="display:flex; align-items:center; gap:8px;">
                        <strong style="color:var(--accent-green);">${item.price} ₽</strong>
                        <span style="color:var(--primary); cursor:pointer; font-weight:bold; font-size:16px;" onclick="removeItem(${i})">✕</span>
                    </div>
                `;
                box.appendChild(div);
            });
        }

        function removeItem(i) {
            const c = getCurrentClient();
            c.items.splice(i, 1);
            renderActiveClient();
            saveData();
        }

        function clearCurrentCart() {
            if (confirm('Очистить текущий чек?')) {
                const c = getCurrentClient();
                c.items = [];
                c.note = '';
                c.time = '';
                renderTabs();
                renderActiveClient();
                saveData();
            }
        }

        function setPayType(type) {
            const c = getCurrentClient();
            c.payType = type;
            renderActiveClient();
            saveData();
        }

        function updateClientData() {
            const c = getCurrentClient();
            c.note = document.getElementById('clientNote').value;
            c.time = document.getElementById('clientTime').value;
            renderTabs();
            saveData();
        }

        function setNowTime() {
            const now = new Date();
            document.getElementById('clientTime').value = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            updateClientData();
        }

        /* Выбор товаров */
        function openProductSelectSheet() {
            const list = document.getElementById('selectProductList');
            list.innerHTML = '';

            catalog.forEach(item => {
                const div = document.createElement('div');
                div.className = 'list-item';
                const unit = item.type === 'weight' ? '₽/кг' : '₽';
                div.innerHTML = `
                    <span style="font-weight:700;">${item.name}</span>
                    <span style="color:var(--accent-green); font-weight:800;">${item.price} ${unit}</span>
                `;
                div.onclick = () => {
                    closeSheet('productSelectSheet');
                    openAddSheet(item);
                };
                list.appendChild(div);
            });

            document.getElementById('productSelectSheet').style.display = 'flex';
        }

        function openAddSheet(item) {
            activeProd = item;
            document.getElementById('sheetProdTitle').innerText = item.name;
            
            if (item.type === 'piece') {
                document.getElementById('pieceMode').style.display = 'block';
                document.getElementById('weightMode').style.display = 'none';
                document.getElementById('pieceInput').value = 1;
            } else {
                document.getElementById('pieceMode').style.display = 'none';
                document.getElementById('weightMode').style.display = 'block';
                document.getElementById('weightInput').value = '';
                updateWeightCalc();
            }
            document.getElementById('addItemSheet').style.display = 'flex';
        }

        function setGrams(g) {
            document.getElementById('weightInput').value = g;
            updateWeightCalc();
        }

        function updateWeightCalc() {
            if (!activeProd || activeProd.type !== 'weight') return;
            const grams = parseFloat(document.getElementById('weightInput').value) || 0;
            const price = Math.round((grams / 1000) * activeProd.price);
            document.getElementById('weightCalcText').innerText = `Сумма: ${price} ₽ (${grams}г)`;
        }

        function confirmAddItem() {
            const c = getCurrentClient();
            let name = activeProd.name;
            let detail = '';
            let price = 0;

            if (activeProd.type === 'piece') {
                const count = parseInt(document.getElementById('pieceInput').value) || 1;
                detail = `${count} шт`;
                price = activeProd.price * count;
            } else {
                const grams = parseFloat(document.getElementById('weightInput').value) || 0;
                if (grams <= 0) return alert('Укажите вес!');
                detail = `${grams} г`;
                price = Math.round((grams / 1000) * activeProd.price);
            }

            c.items.push({ name, detail, price });
            closeSheet('addItemSheet');
            renderActiveClient();
            saveData();
        }

        /* Отчёт */
        function generateReportText() {
            const shiftDate = document.getElementById('shiftDate').value;
            const cashRegister = document.getElementById('cashRegister').value;
            const expenses = document.getElementById('expenses').value.trim();
            const strawberries = document.getElementById('strawberries').value.trim();

            let report = `${shiftDate}\n`;
            if (cashRegister) report += `Касса: ${cashRegister}\n\n`;

            let totalCash = 0;
            let totalTransfer = 0;

            clients.forEach((c, idx) => {
                if (c.items.length === 0 && !c.note) return;

                let title = `Клиент: ${idx + 1}`;
                if (c.note.trim()) title += ` ${c.note.trim()}`;
                report += `${title}\n`;

                let clientSum = 0;
                c.items.forEach(it => {
                    report += `${it.name} - ${it.detail}\n`;
                    clientSum += it.price;
                });

                if (c.payType === 'Нал') totalCash += clientSum;
                if (c.payType === 'Перевод' || c.payType === 'Терминал') totalTransfer += clientSum;

                let payLine = `(${c.payType}`;
                if (clientSum > 0) payLine += ` ${clientSum}`;
                if (c.time.trim()) payLine += ` ${c.time.trim()}`;
                payLine += `)\n\n`;

                report += payLine;
            });

            report += `Расход: ${expenses ? expenses : 'не было'}\n\n`;
            report += `Нал: ${totalCash > 0 ? totalCash.toLocaleString('ru-RU') : '0'}\n`;
            report += `Перевод: ${totalTransfer > 0 ? totalTransfer.toLocaleString('ru-RU') : '0'}\n\n`;
            report += `По клубникам: ${strawberries ? strawberries : 'продаж не было'}`;

            return report;
        }

        function updateReport() {
            document.getElementById('reportPreview').innerText = generateReportText();
        }

        function openReportSheet() {
            updateReport();
            document.getElementById('reportSheet').style.display = 'flex';
        }

        function copyReport() {
            const text = generateReportText();
            navigator.clipboard.writeText(text).then(() => {
                alert('✅ Отчёт скопирован!');
            }).catch(() => alert('Скопируйте вручную из меню "Отчёт"'));
        }

        function openManageCatalog() {
            const list = document.getElementById('manageCatalogList');
            list.innerHTML = '';

            catalog.forEach((item, i) => {
                const div = document.createElement('div');
                div.className = 'list-item';
                div.innerHTML = `
                    <div>
                        <strong>${item.name}</strong>
                        <div style="font-size:12px; color:var(--accent-green);">${item.price} ₽</div>
                    </div>
                    <button class="btn-round" style="color:red;" onclick="deleteCatalogItem(${i})">Удалить</button>
                `;
                list.appendChild(div);
            });

            document.getElementById('manageCatalogSheet').style.display = 'flex';
        }

        function addNewProductPrompt() {
            const name = prompt('Название товара:');
            if (!name) return;
            const price = parseFloat(prompt('Цена:'));
            if (!price) return;
            const isWeight = confirm('Весовой товар? (ОК - да, Отмена - шт)');

            catalog.push({ id: Date.now(), name, price, type: isWeight ? 'weight' : 'piece' });
            openManageCatalog();
            saveData();
        }

        function deleteCatalogItem(i) {
            if (confirm('Удалить?')) {
                catalog.splice(i, 1);
                openManageCatalog();
                saveData();
            }
        }

        function closeSheet(id) { document.getElementById(id).style.display = 'none'; }

        loadData();
    </script>
</body>
</html>
