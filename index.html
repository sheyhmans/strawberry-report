<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Strawberry POS</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Касса">
    <link rel="apple-touch-icon" href="https://img.icons8.com/emoji/192/strawberry-emoji.png">

    <style>
        :root {
            --bg: #000000;
            --card-bg: #1c1c1e;
            --card-sub: #2c2c2e;
            --border: #3a3a3c;
            --accent: #0a84ff;
            --green: #30d158;
            --danger: #ff453a;
            --text: #ffffff;
            --text-sub: #8e8e93;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            padding: 16px;
            padding-bottom: 120px;
            padding-top: max(16px, env(safe-area-inset-top));
        }

        /* Шапка */
        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
        }

        .app-header h1 {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .btn-ghost {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-sub);
            border: none;
            padding: 7px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
        }
        .btn-ghost:active { opacity: 0.7; }

        /* Карточки */
        .section-card {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 18px;
            padding: 14px;
            margin-bottom: 14px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }

        .row { display: flex; gap: 10px; }
        .row > div { flex: 1; }

        label {
            display: block;
            font-size: 11px;
            font-weight: 600;
            color: var(--text-sub);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input, textarea, select {
            width: 100%;
            background: #000;
            border: 1px solid var(--border);
            color: #fff;
            padding: 11px 13px;
            border-radius: 12px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus, textarea:focus { border-color: var(--accent); }

        /* Кнопка выбора товара */
        .btn-select-product {
            background: linear-gradient(135deg, #1c1c1e 0%, #2c2c2e 100%);
            border: 1px solid var(--accent);
            color: #fff;
            width: 100%;
            padding: 14px;
            border-radius: 14px;
            font-size: 15px;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .btn-select-product:active { transform: scale(0.98); }

        /* Сетка быстрой выкладки */
        .quick-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            margin-bottom: 10px;
        }

        .grid-item {
            background: var(--card-sub);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 60px;
            cursor: pointer;
        }
        .grid-item:active { transform: scale(0.96); border-color: var(--accent); }
        .grid-item-name { font-size: 13px; font-weight: 600; }
        .grid-item-price { font-size: 12px; color: var(--green); font-weight: 700; margin-top: 4px; }

        /* Клиент */
        .client-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .segmented {
            display: flex;
            background: #000;
            padding: 3px;
            border-radius: 10px;
            border: 1px solid var(--border);
            margin-bottom: 10px;
        }

        .seg-btn {
            flex: 1;
            text-align: center;
            padding: 8px 0;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-sub);
            border-radius: 8px;
        }
        .seg-btn.active { background: var(--card-sub); color: #fff; }

        .btn-add-client {
            background: var(--accent);
            color: #fff;
            border: none;
            padding: 14px;
            border-radius: 14px;
            font-weight: 700;
            font-size: 15px;
            width: 100%;
            margin-bottom: 14px;
        }

        .preview {
            background: #000;
            color: var(--green);
            font-family: monospace;
            padding: 12px;
            border-radius: 12px;
            font-size: 12px;
            white-space: pre-wrap;
            max-height: 140px;
            overflow-y: auto;
            border: 1px solid var(--border);
        }

        /* Нижняя фиксированная панель */
        .bottom-bar {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid var(--border);
            padding: 12px 16px max(12px, env(safe-area-inset-bottom)) 16px;
            z-index: 100;
        }

        .btn-copy {
            background: var(--green);
            color: #fff;
            border: none;
            padding: 15px;
            border-radius: 14px;
            font-weight: 700;
            font-size: 16px;
            width: 100%;
        }

        /* ШТОРКИ И ВЫПАДАЮЩИЕ СПИСКИ */
        .sheet-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(8px);
            z-index: 200;
            align-items: flex-end;
        }

        .sheet-body {
            background: #1c1c1e;
            border-top: 1px solid var(--border);
            border-radius: 24px 24px 0 0;
            padding: 18px 18px max(18px, env(safe-area-inset-bottom)) 18px;
            width: 100%;
            max-height: 80vh;
            overflow-y: auto;
        }

        .sheet-handle {
            width: 38px;
            height: 5px;
            background: var(--border);
            border-radius: 3px;
            margin: 0 auto 14px auto;
        }

        .list-option {
            background: #000;
            border: 1px solid var(--border);
            padding: 14px;
            border-radius: 12px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .list-option:active { border-color: var(--accent); }

        .quick-weight {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin: 12px 0;
        }

        .qw-btn {
            background: #000;
            border: 1px solid var(--border);
            color: #fff;
            padding: 10px 0;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            text-align: center;
        }
        .qw-btn:active { background: var(--accent); }
    </style>
</head>
<body>

    <div class="app-header">
        <h1>🍓 Strawberry POS</h1>
        <div>
            <button class="btn-ghost" onclick="openManageCatalog()">⚙️ Товары</button>
            <button class="btn-ghost" onclick="resetShift()">Сброс</button>
        </div>
    </div>

    <!-- ДАТА И КАССА -->
    <div class="section-card">
        <div class="row">
            <div>
                <label>Даты смены</label>
                <input type="text" id="shiftDate" oninput="saveData()">
            </div>
            <div>
                <label>Касса</label>
                <input type="text" id="cashRegister" value="10.000" oninput="saveData()">
            </div>
        </div>
    </div>

    <!-- ВЫБОР ТОВАРА -->
    <div style="margin-bottom: 14px;">
        <button class="btn-select-product" onclick="openProductSelectSheet()">
            <span>📦 Выбрать товар из списка...</span>
            <span style="opacity: 0.5;">▼</span>
        </button>

        <!-- Быстрая сетка часто покупаемых -->
        <div class="quick-grid" id="quickGrid"></div>
    </div>

    <!-- СПИСОК КЛИЕНТОВ -->
    <div id="clientsContainer"></div>
    <button class="btn-add-client" onclick="addClient()">+ Добавить клиента</button>

    <!-- РАСХОД И КЛУБНИКА -->
    <div class="section-card">
        <div class="row" style="margin-bottom: 10px;">
            <div>
                <label>Расход</label>
                <input type="text" id="expenses" placeholder="не было" oninput="saveData()">
            </div>
            <div style="flex:0.35; display:flex; align-items:flex-end;">
                <button class="btn-ghost" style="width:100%; padding:12px; border-radius:12px;" onclick="document.getElementById('expenses').value='не было'; saveData();">Не было</button>
            </div>
        </div>
        <label>Заметки по клубникам</label>
        <input type="text" id="strawberries" placeholder="продаж не было" oninput="saveData()">
    </div>

    <!-- ПРЕДПРОСМОТР -->
    <div class="section-card">
        <label>Итоговый отчёт</label>
        <div class="preview" id="reportPreview"></div>
    </div>

    <!-- НИЖНЯЯ ПАНЕЛЬ -->
    <div class="bottom-bar">
        <button class="btn-copy" onclick="copyReport()">📋 Скопировать отчёт</button>
    </div>

    <!-- ШТОРКА 1: ВЫБОР ТОВАРА ИЗ СПИСКА -->
    <div class="sheet-overlay" id="productSelectSheet">
        <div class="sheet-body">
            <div class="sheet-handle"></div>
            <h3 style="font-size:17px; margin-bottom:12px;">Выберите товар</h3>
            <div id="selectProductList"></div>
            <button class="btn-ghost" style="width:100%; margin-top:10px; padding:12px;" onclick="closeSheet('productSelectSheet')">Закрыть</button>
        </div>
    </div>

    <!-- ШТОРКА 2: ВВОД ВЕСА ИЛИ КОЛИЧЕСТВА -->
    <div class="sheet-overlay" id="addItemSheet">
        <div class="sheet-body">
            <div class="sheet-handle"></div>
            <h3 id="sheetProdTitle" style="font-size:17px; margin-bottom:12px;"></h3>
            
            <div id="pieceMode">
                <label>Количество (шт)</label>
                <input type="number" id="pieceInput" value="1" min="1">
            </div>

            <div id="weightMode" style="display:none;">
                <label>Быстрый выбор веса</label>
                <div class="quick-weight">
                    <div class="qw-btn" onclick="setGrams(250)">250г</div>
                    <div class="qw-btn" onclick="setGrams(500)">500г</div>
                    <div class="qw-btn" onclick="setGrams(750)">750г</div>
                    <div class="qw-btn" onclick="setGrams(1000)">1 кг</div>
                </div>
                <label>Точный вес (в граммах)</label>
                <input type="number" id="weightInput" placeholder="например, 380" oninput="updateWeightCalc()">
                <div style="margin-top:10px; font-size:15px; color:var(--green); font-weight:700;" id="weightCalcText">Сумма: 0 ₽</div>
            </div>

            <button class="btn-add-client" style="margin-top:14px;" onclick="confirmAddItem()">Добавить в чек</button>
            <button class="btn-ghost" style="width:100%; padding:12px;" onclick="closeSheet('addItemSheet')">Отмена</button>
        </div>
    </div>

    <!-- ШТОРКА 3: УПРАВЛЕНИЕ КАТАЛОГОМ (НАСТРОЙКА ЦЕН) -->
    <div class="sheet-overlay" id="manageCatalogSheet">
        <div class="sheet-body">
            <div class="sheet-handle"></div>
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
                <h3 style="font-size:17px;">Настройка товаров</h3>
                <button class="btn-ghost" style="color:var(--accent);" onclick="openEditProductModal(null)">+ Новый</button>
            </div>
            <div id="manageCatalogList"></div>
            <button class="btn-ghost" style="width:100%; margin-top:10px; padding:12px;" onclick="closeSheet('manageCatalogSheet')">Готово</button>
        </div>
    </div>

    <!-- ШТОРКА 4: РЕДАКТИРОВАНИЕ ПОЗИЦИИ -->
    <div class="sheet-overlay" id="editProductSheet">
        <div class="sheet-body">
            <div class="sheet-handle"></div>
            <h3 id="editSheetTitle" style="font-size:17px; margin-bottom:12px;">Редактирование</h3>
            
            <label>Название товара</label>
            <input type="text" id="editProdName" style="margin-bottom:10px;">
            
            <label>Тип расчёта</label>
            <select id="editProdType" style="margin-bottom:10px;">
                <option value="piece">Штучный (шт)</option>
                <option value="weight">Весовой (цена за 1 кг)</option>
            </select>

            <label>Цена (₽)</label>
            <input type="number" id="editProdPrice" style="margin-bottom:14px;">

            <button class="btn-add-client" style="margin-bottom:8px;" onclick="saveProductChanges()">Сохранить</button>
            <button class="btn-ghost" style="width:100%; color:var(--danger); padding:12px; margin-bottom:8px;" id="btnDeleteProd" onclick="deleteProduct()">Удалить товар</button>
            <button class="btn-ghost" style="width:100%; padding:12px;" onclick="closeSheet('editProductSheet')">Отмена</button>
        </div>
    </div>

    <script>
        let catalog = [
            { id: 1, name: "Ст.клубника в шк", price: 900, type: "piece" },
            { id: 2, name: "Ст.ананас", price: 1200, type: "piece" },
            { id: 3, name: "Клубника (кг)", price: 600, type: "weight" },
            { id: 4, name: "Роза красная", price: 250, type: "piece" },
            { id: 5, name: "Доставка", price: 350, type: "piece" }
        ];

        let clients = [];
        let activeProd = null;
        let editingProdId = null;

        function initDate() {
            const today = new Date();
            const tomorrow = new Date(today);
            tomorrow.setDate(today.getDate() + 1);
            const fmt = (d) => String(d.getDate()).padStart(2, '0') + '.' + String(d.getMonth() + 1).padStart(2, '0');
            return `${fmt(today)}-${fmt(tomorrow)}`;
        }

        function renderQuickGrid() {
            const container = document.getElementById('quickGrid');
            container.innerHTML = '';

            // Показываем первые 4 наиболее частых товара
            catalog.slice(0, 4).forEach(item => {
                const div = document.createElement('div');
                div.className = 'grid-item';
                const unit = item.type === 'weight' ? '₽/кг' : '₽';
                div.innerHTML = `
                    <div class="grid-item-name">${item.name}</div>
                    <div class="grid-item-price">${item.price} ${unit}</div>
                `;
                div.onclick = () => openAddSheet(item);
                container.appendChild(div);
            });
        }

        function openProductSelectSheet() {
            const list = document.getElementById('selectProductList');
            list.innerHTML = '';

            catalog.forEach(item => {
                const div = document.createElement('div');
                div.className = 'list-option';
                const unit = item.type === 'weight' ? '₽/кг' : '₽';
                div.innerHTML = `
                    <span style="font-weight:600;">${item.name}</span>
                    <span style="color:var(--green); font-weight:700;">${item.price} ${unit}</span>
                `;
                div.onclick = () => {
                    closeSheet('productSelectSheet');
                    openAddSheet(item);
                };
                list.appendChild(div);
            });

            document.getElementById('productSelectSheet').style.display = 'flex';
        }

        function openAddSheet(item) {
            activeProd = item;
            document.getElementById('sheetProdTitle').innerText = item.name;
            
            if (item.type === 'piece') {
                document.getElementById('pieceMode').style.display = 'block';
                document.getElementById('weightMode').style.display = 'none';
                document.getElementById('pieceInput').value = 1;
            } else {
                document.getElementById('pieceMode').style.display = 'none';
                document.getElementById('weightMode').style.display = 'block';
                document.getElementById('weightInput').value = '';
                updateWeightCalc();
            }
            document.getElementById('addItemSheet').style.display = 'flex';
        }

        function setGrams(g) {
            document.getElementById('weightInput').value = g;
            updateWeightCalc();
        }

        function updateWeightCalc() {
            if (!activeProd || activeProd.type !== 'weight') return;
            const grams = parseFloat(document.getElementById('weightInput').value) || 0;
            const price = Math.round((grams / 1000) * activeProd.price);
            document.getElementById('weightCalcText').innerText = `Сумма: ${price} ₽ (${grams}г)`;
        }

        function confirmAddItem() {
            if (clients.length === 0) addClient(false);
            const lastIdx = clients.length - 1;
            let text = '';
            let sum = 0;

            if (activeProd.type === 'piece') {
                const count = parseInt(document.getElementById('pieceInput').value) || 1;
                text = `${activeProd.name} - ${count}`;
                sum = activeProd.price * count;
            } else {
                const grams = parseFloat(document.getElementById('weightInput').value) || 0;
                sum = Math.round((grams / 1000) * activeProd.price);
                text = `${activeProd.name} - ${grams}г`;
            }

            if (clients[lastIdx].items) clients[lastIdx].items += '\n' + text;
            else clients[lastIdx].items = text;

            const currentAmt = parseFloat(clients[lastIdx].amount) || 0;
            clients[lastIdx].amount = currentAmt + sum;

            closeSheet('addItemSheet');
            renderClients();
            saveData();
        }

        function openManageCatalog() {
            const list = document.getElementById('manageCatalogList');
            list.innerHTML = '';

            catalog.forEach(item => {
                const div = document.createElement('div');
                div.className = 'list-option';
                const unit = item.type === 'weight' ? '₽/кг' : '₽';
                div.innerHTML = `
                    <div>
                        <div style="font-weight:600;">${item.name}</div>
                        <div style="font-size:12px; color:var(--green);">${item.price} ${unit}</div>
                    </div>
                    <button class="btn-ghost" style="padding:4px 10px;" onclick="openEditProductModal(${item.id})">✏️ Изменить</button>
                `;
                list.appendChild(div);
            });

            document.getElementById('manageCatalogSheet').style.display = 'flex';
        }

        function openEditProductModal(id) {
            editingProdId = id;
            if (id === null) {
                document.getElementById('editSheetTitle').innerText = 'Новый товар';
                document.getElementById('editProdName').value = '';
                document.getElementById('editProdType').value = 'piece';
                document.getElementById('editProdPrice').value = '';
                document.getElementById('btnDeleteProd').style.display = 'none';
            } else {
                const item = catalog.find(x => x.id === id);
                document.getElementById('editSheetTitle').innerText = 'Изменить товар';
                document.getElementById('editProdName').value = item.name;
                document.getElementById('editProdType').value = item.type;
                document.getElementById('editProdPrice').value = item.price;
                document.getElementById('btnDeleteProd').style.display = 'block';
            }
            document.getElementById('editProductSheet').style.display = 'flex';
        }

        function saveProductChanges() {
            const name = document.getElementById('editProdName').value.trim();
            const type = document.getElementById('editProdType').value;
            const price = parseFloat(document.getElementById('editProdPrice').value) || 0;

            if (!name || price <= 0) return alert('Заполните название и цену!');

            if (editingProdId === null) {
                catalog.push({ id: Date.now(), name, type, price });
            } else {
                const item = catalog.find(x => x.id === editingProdId);
                if (item) { item.name = name; item.type = type; item.price = price; }
            }

            closeSheet('editProductSheet');
            openManageCatalog();
            renderQuickGrid();
            saveData();
        }

        function deleteProduct() {
            if (editingProdId && confirm('Удалить товар?')) {
                catalog = catalog.filter(x => x.id !== editingProdId);
                closeSheet('editProductSheet');
                openManageCatalog();
                renderQuickGrid();
                saveData();
            }
        }

        function closeSheet(id) { document.getElementById(id).style.display = 'none'; }

        function loadData() {
            const saved = localStorage.getItem('pos_strawberry_v3');
            if (saved) {
                const data = JSON.parse(saved);
                document.getElementById('shiftDate').value = data.shiftDate || initDate();
                document.getElementById('cashRegister').value = data.cashRegister || '10.000';
                document.getElementById('expenses').value = data.expenses || '';
                document.getElementById('strawberries').value = data.strawberries || 'продаж не было';
                clients = data.clients || [];
                if (data.catalog) catalog = data.catalog;
            } else {
                document.getElementById('shiftDate').value = initDate();
                document.getElementById('strawberries').value = 'продаж не было';
            }

            if (clients.length === 0) addClient(false);
            else renderClients();

            renderQuickGrid();
            updateReport();
        }

        function saveData() {
            const data = {
                shiftDate: document.getElementById('shiftDate').value,
                cashRegister: document.getElementById('cashRegister').value,
                expenses: document.getElementById('expenses').value,
                strawberries: document.getElementById('strawberries').value,
                clients, catalog
            };
            localStorage.setItem('pos_strawberry_v3', JSON.stringify(data));
            updateReport();
        }

        function addClient(shouldSave = true) {
            clients.push({ name: '', items: '', payType: 'Нал', amount: '', time: '' });
            renderClients();
            if (shouldSave) saveData();
        }

        function removeClient(index) {
            clients.splice(index, 1);
            if (clients.length === 0) addClient(false);
            renderClients();
            saveData();
        }

        function setPayType(index, type) {
            clients[index].payType = type;
            renderClients();
            saveData();
        }

        function setTimeNow(index) {
            const now = new Date();
            clients[index].time = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            renderClients();
            saveData();
        }

        function renderClients() {
            const container = document.getElementById('clientsContainer');
            container.innerHTML = '';

            clients.forEach((c, i) => {
                const card = document.createElement('div');
                card.className = 'section-card';
                card.innerHTML = `
                    <div class="client-header">
                        <strong style="font-size:15px;">Клиент ${i + 1}</strong>
                        ${clients.length > 1 ? `<span style="color:var(--danger); font-size:12px; font-weight:600; cursor:pointer;" onclick="removeClient(${i})">Удалить</span>` : ''}
                    </div>
                    <input type="text" placeholder="Примечание (напр., Муса Вип)" value="${c.name}" style="margin-bottom:8px;" oninput="clients[${i}].name = this.value; saveData();">
                    
                    <textarea placeholder="Состав заказа" rows="2" style="margin-bottom:8px;" oninput="clients[${i}].items = this.value; saveData();">${c.items}</textarea>

                    <div class="segmented">
                        <div class="seg-btn ${c.payType==='Нал'?'active':''}" onclick="setPayType(${i}, 'Нал')">Нал</div>
                        <div class="seg-btn ${c.payType==='Перевод'?'active':''}" onclick="setPayType(${i}, 'Перевод')">Перевод</div>
                        <div class="seg-btn ${c.payType==='Терминал'?'active':''}" onclick="setPayType(${i}, 'Терминал')">Терминал</div>
                        <div class="seg-btn ${c.payType==='Долг'?'active':''}" onclick="setPayType(${i}, 'Долг')">Долг</div>
                    </div>

                    <div class="row">
                        <input type="number" placeholder="Сумма (₽)" value="${c.amount}" oninput="clients[${i}].amount = this.value; saveData();">
                        <input type="text" placeholder="Время (01:27)" value="${c.time}" oninput="clients[${i}].time = this.value; saveData();">
                        <button class="btn-ghost" style="background:#2c2c2e; color:#fff;" onclick="setTimeNow(${i})">🕒</button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function generateReportText() {
            const shiftDate = document.getElementById('shiftDate').value;
            const cashRegister = document.getElementById('cashRegister').value;
            const expenses = document.getElementById('expenses').value.trim();
            const strawberries = document.getElementById('strawberries').value.trim();

            let report = `${shiftDate}\n`;
            if (cashRegister) report += `Касса: ${cashRegister}\n\n`;

            let totalCash = 0;
            let totalTransfer = 0;

            clients.forEach((c, idx) => {
                let title = `Клиент: ${idx + 1}`;
                if (c.name.trim()) title += ` ${c.name.trim()}`;
                
                report += `${title}\n`;
                if (c.items.trim()) report += `${c.items.trim()}\n`;

                let payLine = `(${c.payType}`;
                if (c.amount) {
                    const amt = parseFloat(c.amount) || 0;
                    payLine += ` ${c.amount}`;
                    if (c.payType === 'Нал') totalCash += amt;
                    if (c.payType === 'Перевод' || c.payType === 'Терминал') totalTransfer += amt;
                }
                if (c.time.trim()) payLine += ` ${c.time.trim()}`;
                payLine += `)\n\n`;
                
                report += payLine;
            });

            report += `Расход: ${expenses ? expenses : 'не было'}\n\n`;
            report += `Нал: ${totalCash > 0 ? totalCash.toLocaleString('ru-RU') : '0'}\n`;
            report += `Перевод: ${totalTransfer > 0 ? totalTransfer.toLocaleString('ru-RU') : '0'}\n\n`;
            report += `По клубникам: ${strawberries ? strawberries : 'продаж не было'}`;

            return report;
        }

        function updateReport() {
            document.getElementById('reportPreview').innerText = generateReportText();
        }

        function copyReport() {
            const text = generateReportText();
            navigator.clipboard.writeText(text).then(() => {
                alert('✅ Отчёт скопирован!');
            }).catch(() => {
                alert('Скопируйте текст из предпросмотра вручную.');
            });
        }

        function resetShift() {
            if (confirm('Очистить данные смены?')) {
                localStorage.removeItem('pos_strawberry_v3');
                clients = [];
                document.getElementById('expenses').value = '';
                document.getElementById('strawberries').value = 'продаж не было';
                loadData();
            }
        }

        loadData();
    </script>
</body>
</html>
