<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Отчет Смены 🍓</title>
    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.07);
            --glass-border: rgba(255, 255, 255, 0.12);
            --glass-card: rgba(30, 41, 59, 0.7);
            --accent-green: #34d399;
            --accent-blue: #60a5fa;
            --accent-red: #f87171;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%);
            background-attachment: fixed;
            color: var(--text-main);
            padding: 12px;
            padding-bottom: 110px;
            min-height: 100vh;
        }

        /* iOS Glass Card */
        .glass-panel {
            background: var(--glass-card);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 18px;
            padding: 14px;
            margin-bottom: 12px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }

        .header h1 {
            font-size: 20px;
            font-weight: 700;
            background: linear-gradient(90deg, #34d399, #60a5fa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .btn-glass-sm {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid var(--glass-border);
            color: var(--text-sub);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            backdrop-filter: blur(10px);
        }

        .row { display: flex; gap: 10px; }
        .row > div { flex: 1; }

        label {
            display: block;
            font-size: 11px;
            color: var(--text-sub);
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input, textarea {
            width: 100%;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--glass-border);
            color: #fff;
            padding: 10px 12px;
            border-radius: 12px;
            font-size: 14px;
            outline: none;
            transition: border 0.2s;
        }

        input:focus, textarea:focus {
            border-color: var(--accent-blue);
        }

        /* Витрина выбора товаров в стиле iOS */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 8px;
            margin-top: 6px;
        }

        .product-chip {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 8px 10px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 6px;
        }

        .product-title {
            font-size: 12px;
            font-weight: 500;
            color: #e2e8f0;
        }

        .stepper {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            padding: 2px 4px;
        }

        .stepper-btn {
            background: rgba(255, 255, 255, 0.15);
            border: none;
            color: #fff;
            width: 24px;
            height: 24px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .stepper-btn:active {
            background: var(--accent-blue);
        }

        .stepper-val {
            font-size: 12px;
            font-weight: 600;
        }

        /* Карточка клиента */
        .client-card {
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid var(--glass-border);
            border-radius: 14px;
            padding: 12px;
            margin-bottom: 12px;
        }

        .client-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .client-header strong {
            font-size: 14px;
            color: var(--accent-blue);
        }

        /* iOS Segmented Control */
        .ios-segmented {
            display: flex;
            background: rgba(0, 0, 0, 0.4);
            padding: 3px;
            border-radius: 10px;
            margin-bottom: 8px;
            border: 1px solid var(--glass-border);
        }

        .segmented-btn {
            flex: 1;
            text-align: center;
            padding: 6px 0;
            font-size: 12px;
            color: var(--text-sub);
            border-radius: 7px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .segmented-btn.active {
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
            font-weight: 600;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }

        .btn-add-client {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: #fff;
            border: none;
            padding: 12px;
            border-radius: 14px;
            font-weight: 600;
            width: 100%;
            margin-bottom: 12px;
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.3);
        }

        .btn-time {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid var(--glass-border);
            color: #fff;
            padding: 0 10px;
            border-radius: 12px;
            font-size: 12px;
        }

        .preview {
            background: rgba(0, 0, 0, 0.6);
            color: var(--accent-green);
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, monospace;
            padding: 10px;
            border-radius: 10px;
            font-size: 12px;
            white-space: pre-wrap;
            max-height: 140px;
            overflow-y: auto;
            border: 1px solid rgba(52, 211, 153, 0.2);
        }

        /* Fixed Bottom Bar Liquid Glass */
        .bottom-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid var(--glass-border);
            padding: 12px 16px;
            z-index: 100;
        }

        .btn-copy {
            background: linear-gradient(135deg, #10b981, #059669);
            color: #fff;
            border: none;
            padding: 14px;
            border-radius: 14px;
            font-weight: 700;
            font-size: 15px;
            width: 100%;
            box-shadow: 0 4px 20px rgba(16, 185, 129, 0.4);
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>🍓 Strawberry Report</h1>
        <button class="btn-glass-sm" onclick="resetShift()">🔄 Сбросить</button>
    </div>

    <!-- ДАТА И КАССА -->
    <div class="glass-panel">
        <div class="row">
            <div>
                <label>Даты смены</label>
                <input type="text" id="shiftDate" oninput="saveData()">
            </div>
            <div>
                <label>Касса</label>
                <input type="text" id="cashRegister" value="10.000" oninput="saveData()">
            </div>
        </div>
    </div>

    <!-- ТОВАРЫ ДЛЯ БЫСТРОГО ВЫБОРА C КНОПКАМИ +/- -->
    <div class="glass-panel">
        <label>Добавить товар текущему клиенту:</label>
        <div class="products-grid" id="productsGrid"></div>
    </div>

    <!-- СПИСОК КЛИЕНТОВ -->
    <div id="clientsContainer"></div>
    <button class="btn-add-client" onclick="addClient()">+ Добавить нового клиента</button>

    <!-- РАСХОД И КЛУБНИКА -->
    <div class="glass-panel">
        <div class="row" style="margin-bottom: 10px;">
            <div>
                <label>Расход</label>
                <input type="text" id="expenses" placeholder="не было" oninput="saveData()">
            </div>
            <div style="flex:0.3; display:flex; align-items:flex-end;">
                <button class="btn-glass-sm" style="width:100%; padding:11px;" onclick="document.getElementById('expenses').value='не было'; saveData();">Не было</button>
            </div>
        </div>
        <label>По клубникам</label>
        <input type="text" id="strawberries" placeholder="продаж не было" oninput="saveData()">
    </div>

    <!-- ПРЕДПРОСМОТР -->
    <div class="glass-panel">
        <label>Предпросмотр отчета:</label>
        <div class="preview" id="reportPreview"></div>
    </div>

    <!-- ФИКСИРОВАННАЯ КНОПКА СНИЗУ -->
    <div class="bottom-bar">
        <button class="btn-copy" onclick="copyReport()">📋 Скопировать отчет</button>
    </div>

    <script>
        // Список частых товаров для витрины
        const catalogItems = [
            "Ст.клубника в шк",
            "Ст.ананас",
            "Ст.черешня",
            "Ст.малина в шк",
            "Роза красная",
            "Куст.розы",
            "Доставка"
        ];

        let itemCounters = {};
        catalogItems.forEach(item => itemCounters[item] = 1);

        let clients = [];

        function initDate() {
            const today = new Date();
            const tomorrow = new Date(today);
            tomorrow.setDate(today.getDate() + 1);
            const fmt = (d) => String(d.getDate()).padStart(2, '0') + '.' + String(d.getMonth() + 1).padStart(2, '0');
            return `${fmt(today)}-${fmt(tomorrow)}`;
        }

        function renderProductsGrid() {
            const container = document.getElementById('productsGrid');
            container.innerHTML = '';

            catalogItems.forEach(item => {
                const count = itemCounters[item] || 1;
                const chip = document.createElement('div');
                chip.className = 'product-chip';
                chip.innerHTML = `
                    <div class="product-title">${item}</div>
                    <div class="stepper">
                        <button class="stepper-btn" onclick="changeCount('${item}', -1)">−</button>
                        <span class="stepper-val">${count} шт</span>
                        <button class="stepper-btn" onclick="changeCount('${item}', 1)">+</button>
                    </div>
                    <button class="btn-glass-sm" style="padding:4px; margin-top:4px;" onclick="addProductToCurrentClient('${item}')">Добавить</button>
                `;
                container.appendChild(chip);
            });
        }

        function changeCount(item, delta) {
            let curr = itemCounters[item] || 1;
            curr += delta;
            if (curr < 1) curr = 1;
            itemCounters[item] = curr;
            renderProductsGrid();
        }

        function addProductToCurrentClient(itemName) {
            if (clients.length === 0) addClient(false);
            const count = itemCounters[itemName] || 1;
            const textToAdd = `${itemName} - ${count}`;
            
            const lastIdx = clients.length - 1;
            if (clients[lastIdx].items) {
                clients[lastIdx].items += '\n' + textToAdd;
            } else {
                clients[lastIdx].items = textToAdd;
            }
            renderClients();
            saveData();
        }

        function loadData() {
            const saved = localStorage.getItem('strawberry_shift_data_v2');
            if (saved) {
                const data = JSON.parse(saved);
                document.getElementById('shiftDate').value = data.shiftDate || initDate();
                document.getElementById('cashRegister').value = data.cashRegister || '10.000';
                document.getElementById('expenses').value = data.expenses || '';
                document.getElementById('strawberries').value = data.strawberries || 'продаж не было';
                clients = data.clients || [];
            } else {
                document.getElementById('shiftDate').value = initDate();
                document.getElementById('strawberries').value = 'продаж не было';
            }

            if (clients.length === 0) addClient(false);
            else renderClients();

            renderProductsGrid();
            updateReport();
        }

        function saveData() {
            const data = {
                shiftDate: document.getElementById('shiftDate').value,
                cashRegister: document.getElementById('cashRegister').value,
                expenses: document.getElementById('expenses').value,
                strawberries: document.getElementById('strawberries').value,
                clients: clients
            };
            localStorage.setItem('strawberry_shift_data_v2', JSON.stringify(data));
            updateReport();
        }

        function addClient(shouldSave = true) {
            clients.push({ name: '', items: '', payType: 'Нал', amount: '', time: '' });
            renderClients();
            if (shouldSave) saveData();
        }

        function removeClient(index) {
            clients.splice(index, 1);
            if (clients.length === 0) addClient(false);
            renderClients();
            saveData();
        }

        function setPayType(index, type) {
            clients[index].payType = type;
            renderClients();
            saveData();
        }

        function setTimeNow(index) {
            const now = new Date();
            clients[index].time = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            renderClients();
            saveData();
        }

        function renderClients() {
            const container = document.getElementById('clientsContainer');
            container.innerHTML = '';

            clients.forEach((c, i) => {
                const card = document.createElement('div');
                card.className = 'client-card';
                card.innerHTML = `
                    <div class="client-header">
                        <strong>Клиент ${i + 1}</strong>
                        ${clients.length > 1 ? `<button class="btn-glass-sm" style="color:var(--accent-red)" onclick="removeClient(${i})">Удалить</button>` : ''}
                    </div>
                    <input type="text" placeholder="Примечание (напр., Муса Вип)" value="${c.name}" style="margin-bottom:8px;" oninput="clients[${i}].name = this.value; saveData();">
                    
                    <textarea placeholder="Состав заказа" rows="2" style="margin-bottom:8px;" oninput="clients[${i}].items = this.value; saveData();">${c.items}</textarea>

                    <div class="ios-segmented">
                        <div class="segmented-btn ${c.payType==='Нал'?'active':''}" onclick="setPayType(${i}, 'Нал')">Нал</div>
                        <div class="segmented-btn ${c.payType==='Перевод'?'active':''}" onclick="setPayType(${i}, 'Перевод')">Перевод</div>
                        <div class="segmented-btn ${c.payType==='Терминал'?'active':''}" onclick="setPayType(${i}, 'Терминал')">Терминал</div>
                        <div class="segmented-btn ${c.payType==='Долг'?'active':''}" onclick="setPayType(${i}, 'Долг')">Долг</div>
                    </div>

                    <div class="row">
                        <input type="number" placeholder="Сумма (₽)" value="${c.amount}" oninput="clients[${i}].amount = this.value; saveData();">
                        <input type="text" placeholder="Время (01:27)" value="${c.time}" oninput="clients[${i}].time = this.value; saveData();">
                        <button class="btn-time" onclick="setTimeNow(${i})">🕒</button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function generateReportText() {
            const shiftDate = document.getElementById('shiftDate').value;
            const cashRegister = document.getElementById('cashRegister').value;
            const expenses = document.getElementById('expenses').value.trim();
            const strawberries = document.getElementById('strawberries').value.trim();

            let report = `${shiftDate}\n`;
            if (cashRegister) report += `Касса: ${cashRegister}\n\n`;

            let totalCash = 0;
            let totalTransfer = 0;

            clients.forEach((c, idx) => {
                let title = `Клиент: ${idx + 1}`;
                if (c.name.trim()) title += ` ${c.name.trim()}`;
                
                report += `${title}\n`;
                if (c.items.trim()) report += `${c.items.trim()}\n`;

                let payLine = `(${c.payType}`;
                if (c.amount) {
                    const amt = parseFloat(c.amount) || 0;
                    payLine += ` ${c.amount}`;
                    if (c.payType === 'Нал') totalCash += amt;
                    if (c.payType === 'Перевод' || c.payType === 'Терминал') totalTransfer += amt;
                }
                if (c.time.trim()) payLine += ` ${c.time.trim()}`;
                payLine += `)\n\n`;
                
                report += payLine;
            });

            report += `Расход: ${expenses ? expenses : 'не было'}\n\n`;
            report += `Нал: ${totalCash > 0 ? totalCash.toLocaleString('ru-RU') : '0'}\n`;
            report += `Перевод: ${totalTransfer > 0 ? totalTransfer.toLocaleString('ru-RU') : '0'}\n\n`;
            report += `По клубникам: ${strawberries ? strawberries : 'продаж не было'}`;

            return report;
        }

        function updateReport() {
            document.getElementById('reportPreview').innerText = generateReportText();
        }

        function copyReport() {
            const text = generateReportText();
            navigator.clipboard.writeText(text).then(() => {
                alert('✅ Отчет скопирован!');
            }).catch(() => {
                alert('Скопируйте текст из предпросмотра вручную.');
            });
        }

        function resetShift() {
            if (confirm('Очистить смену и начать заново?')) {
                localStorage.removeItem('strawberry_shift_data_v2');
                clients = [];
                document.getElementById('expenses').value = '';
                document.getElementById('strawberries').value = 'продаж не было';
                loadData();
            }
        }

        loadData();
    </script>
</body>
</html>
