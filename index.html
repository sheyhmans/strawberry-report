<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Strawberry POS</title>

<style>

*{
box-sizing:border-box;
font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Arial,sans-serif;
}

body{
margin:0;
background:#09090b;
color:white;
}


.app{
max-width:430px;
margin:auto;
padding:25px 18px 110px;
}


.header{
display:flex;
align-items:center;
gap:15px;
margin-bottom:25px;
}


.logo{
width:58px;
height:58px;
border-radius:20px;
background:#ff2d55;
display:flex;
align-items:center;
justify-content:center;
font-size:32px;
}


h1{
margin:0;
font-size:25px;
}


.header p{
margin:5px 0 0;
color:#999;
}



.main-card{

background:linear-gradient(135deg,#ff2d55,#7a1830);

border-radius:28px;

padding:25px;

margin-bottom:18px;

}



.main-card span{
color:#ffd7df;
}


.main-card h2{
font-size:30px;
margin:10px 0;
}


.main-card p{
margin:0;
color:#ffd7df;
}



.start{

width:100%;

height:55px;

border:0;

border-radius:18px;

background:white;

color:#111;

font-size:17px;

font-weight:600;

margin-bottom:20px;

}



.start.active{

background:#30d158;

color:white;

}




.stats{

display:grid;

grid-template-columns:repeat(3,1fr);

gap:10px;

margin-bottom:20px;

}



.stat{

background:#18181b;

border-radius:18px;

padding:15px 8px;

text-align:center;

}



.stat small{

color:#888;

}



.stat b{

display:block;

margin-top:8px;

font-size:20px;

}



.card{

background:#18181b;

border-radius:22px;

padding:20px;

margin-bottom:15px;

border:1px solid #252525;

}



.client{

background:#111;

border-radius:18px;

padding:15px;

margin-top:10px;

}



.small{

color:#999;

font-size:14px;

}



.menu{

display:grid;

grid-template-columns:1fr 1fr;

gap:15px;

}



.menu-card{

background:#18181b;

border-radius:22px;

padding:20px;

height:135px;

text-decoration:none;

color:white;

border:1px solid #252525;

}



.menu-card div{

font-size:32px;

}



.menu-card h3{

margin:12px 0 0;

}



.menu-card p{

margin:5px 0;

color:#888;

font-size:13px;

}


footer{

text-align:center;

color:#555;

margin-top:35px;

}

.bottom-nav{

position:fixed;
bottom:15px;
left:50%;
transform:translateX(-50%);

width:calc(100% - 30px);
max-width:400px;

height:75px;

background:#18181b;

border-radius:25px;

display:flex;
justify-content:space-around;
align-items:center;

}


.bottom-nav a{

text-decoration:none;
color:#999;

font-size:12px;

display:flex;
flex-direction:column;
align-items:center;

gap:5px;

}
  .bottom-nav{

position:fixed;
bottom:15px;
left:50%;

transform:translateX(-50%);

width:calc(100% - 30px);
max-width:400px;

height:70px;

background:#18181b;

border-radius:25px;

display:flex;

justify-content:space-around;

align-items:center;

z-index:1000;

}


.bottom-nav a{

text-decoration:none;

color:#999;

font-size:12px;

display:flex;

flex-direction:column;

align-items:center;

gap:5px;

}
</style>

</head>


<body>


<div class="app">


<div class="header">


<div class="logo">
🍓
</div>


<div>

<h1>Strawberry POS</h1>

<p>Учет ночной смены</p>

</div>


</div>


<div class="main-card">

<span>
Текущая смена
</span>


<h2 id="shiftText">
Не начата
</h2>


<p id="shiftDescription">
Начните смену для учета продаж
</p>


</div>


<button class="start" id="startBtn" onclick="startShift()">

▶ Начать смену

</button>



<div class="stats">


<div class="stat">

<small>Продажи</small>

<b id="salesTotal">
0 ₽
</b>

</div>


<div class="stat">

<small>Клиенты</small>

<b id="clientsTotal">
0
</b>

</div>


<div class="stat">

<small>Товары</small>

<b id="productCount">
0
</b>

</div>


</div>
<div class="card">

<h3>
Оплата за смену
</h3>


<div id="paymentInfo">

💵 Наличные: 0 ₽
<br>
💳 Переводы: 0 ₽
<br>
🧾 Терминал: 0 ₽

</div>


</div>



<div class="card">

<h3>
Клиенты за смену
</h3>


<div id="clientsList">

Клиентов пока нет

</div>


</div>




<div class="bottom-nav">

<a href="index.html">
🏠
<span>Главная</span>
</a>

<a href="shift.html">
🛒
<span>Продажи</span>
</a>

<a href="catalog.html">
📦
<span>Каталог</span>
</a>

<a href="history.html">
📋
<span>История</span>
</a>

<a href="#">
⚙️
<span>Настройки</span>
</a>

</div>



<footer>

Strawberry POS

</footer>


</div>



<script>


function startShift(){


let active =
localStorage.getItem("shiftActive");



if(active==="true"){


if(confirm("Завершить смену?")){


location.href="shift.html";


}


return;


}



localStorage.setItem(
"shiftActive",
"true"
);



localStorage.setItem(
"shiftStart",
new Date().toLocaleString("ru-RU")
);



localStorage.removeItem(
"shiftClients"
);



updateShift();


}




function updateShift(){


let active =
localStorage.getItem("shiftActive");


let text =
document.getElementById("shiftText");


let desc =
document.getElementById("shiftDescription");


let btn =
document.getElementById("startBtn");



if(active==="true"){


text.innerHTML =
"Смена активна";


desc.innerHTML =
"Начата: "+
(localStorage.getItem("shiftStart") || "");



btn.innerHTML =
"✓ Завершить смену";


btn.classList.add("active");


}else{


text.innerHTML =
"Не начата";


desc.innerHTML =
"Начните смену для учета продаж";


btn.innerHTML =
"▶ Начать смену";


btn.classList.remove("active");


}



}



function loadShiftData(){


let clients =

JSON.parse(

localStorage.getItem("shiftClients")

) || [];



let sales = 0;

let cash = 0;

let transfer = 0;

let terminal = 0;

let products = 0;



clients.forEach(c=>{


c.items.forEach(i=>{


sales += Number(i.sum);

products++;


});



if(c.payment){


cash += Number(c.payment.cash || 0);

transfer += Number(c.payment.transfer || 0);

terminal += Number(c.payment.terminal || 0);


}


});



document.getElementById("salesTotal").innerHTML =
sales+" ₽";



document.getElementById("clientsTotal").innerHTML =
clients.length;



document.getElementById("productCount").innerHTML =
products;



document.getElementById("paymentInfo").innerHTML = `


💵 Наличные: ${cash} ₽

<br>

💳 Переводы: ${transfer} ₽

<br>

🧾 Терминал: ${terminal} ₽


`;



renderClients(clients);



}
  function renderClients(clients){


let box =
document.getElementById("clientsList");



if(!box)return;



let html="";



clients.forEach(c=>{


let total=0;


c.items.forEach(i=>{


total += Number(i.sum);


});



html += `

<div class="client">


<b>
${c.name}
</b>


<br>


<span class="small">

Итого: ${total} ₽

</span>


<br><br>


<span class="small">

${c.items.map(i=>`

${i.name} — ${i.amount} — ${i.sum} ₽

`).join("<br>")}

</span>


<br><br>


<span class="small">

Оплата:

<br>

💵 ${c.payment?.cash || 0} ₽

<br>

💳 ${c.payment?.transfer || 0} ₽

<br>

🧾 ${c.payment?.terminal || 0} ₽


</span>

<div class="bottom-nav">

<a href="index.html">
🏠
<span>Главная</span>
</a>

<a href="shift.html">
🛒
<span>Продажи</span>
</a>

<a href="catalog.html">
📦
<span>Каталог</span>
</a>

<a href="history.html">
📋
<span>История</span>
</a>


</div>

`;


});



box.innerHTML =

html || "Клиентов пока нет";


}





let products =

JSON.parse(

localStorage.getItem("products")

) || [];



document.getElementById("productCount").innerHTML =

products.length;



updateShift();

loadShiftData();



</script>


</body>

</html>
