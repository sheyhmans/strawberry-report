<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Strawberry POS</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    
    <style>
        :root {
            /* СВЕТЛАЯ ТЕМА */
            --bg: #f2f2f7;
            --surface: #ffffff;
            --surface-alt: #f5f5f5;
            --text: #000000;
            --text-muted: #8e8e93;
            --border: #e5e5ea;
            --primary: #ff2d55;
            --primary-fade: rgba(255, 45, 85, 0.1);
            --green: #34c759;
            --green-fade: rgba(52, 199, 89, 0.15);
            --radius: 16px;
        }

        [data-theme="dark"] {
            /* ТЁМНАЯ ТЕМА */
            --bg: #000000;
            --surface: #1c1c1e;
            --surface-alt: #2c2c2e;
            --text: #ffffff;
            --text-muted: #98989d;
            --border: #38383a;
            --primary: #ff375f;
            --primary-fade: rgba(255, 55, 95, 0.2);
            --green: #32d74b;
            --green-fade: rgba(50, 215, 75, 0.2);
        }

        * {
            box-sizing: border-box;
            margin: 0; padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        /* 100dvh гарантирует, что экран не будет скроллиться из-за панели Safari */
        body {
            background-color: var(--bg);
            color: var(--text);
            height: 100dvh; 
            display: flex;
            flex-direction: column;
            overflow: hidden;
            padding: max(12px, env(safe-area-inset-top)) 12px max(12px, env(safe-area-inset-bottom)) 12px;
        }

        /* ВЕРХНЯЯ ПАНЕЛЬ */
        .top-bar {
            display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;
        }
        .app-title { font-size: 20px; font-weight: 800; display: flex; align-items: center; gap: 6px; }
        .top-actions { display: flex; gap: 8px; }
        
        .icon-btn {
            background: var(--surface); border: 1px solid var(--border); color: var(--text);
            padding: 8px 12px; border-radius: 12px; font-size: 14px; font-weight: 600; cursor: pointer;
        }
        .icon-btn:active { transform: scale(0.95); opacity: 0.8; }

        /* ИНФО О СМЕНЕ */
        .shift-info {
            display: flex; gap: 10px; margin-bottom: 12px;
        }
        .input-box {
            flex: 1; background: var(--surface); border: 1px solid var(--border);
            padding: 10px; border-radius: 12px; display: flex; flex-direction: column; gap: 4px;
        }
        .input-box label { font-size: 10px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; }
        .input-box input {
            background: transparent; border: none; color: var(--text); font-size: 14px; font-weight: 700; outline: none; width: 100%;
        }

        /* РАБОЧАЯ ЗОНА (ЗАНИМАЕТ ВСЁ СВОБОДНОЕ МЕСТО) */
        .workspace {
            flex: 1; background: var(--surface); border-radius: var(--radius);
            display: flex; flex-direction: column; overflow: hidden; border: 1px solid var(--border);
        }

        /* ТАБЫ КЛИЕНТОВ */
        .tabs {
            display: flex; overflow-x: auto; padding: 10px; gap: 8px; border-bottom: 1px solid var(--border);
        }
        .tab {
            background: var(--surface-alt); padding: 6px 14px; border-radius: 12px;
            font-size: 13px; font-weight: 600; white-space: nowrap; color: var(--text-muted); cursor: pointer;
        }
        .tab.active { background: var(--text); color: var(--bg); }

        /* СПИСОК ТОВАРОВ В ЧЕКЕ */
        .cart-items {
            flex: 1; overflow-y: auto; padding: 10px;
        }
        .cart-item {
            display: flex; justify-content: space-between; align-items: center;
            background: var(--surface-alt); padding: 12px; border-radius: 12px; margin-bottom: 8px;
            cursor: pointer; border: 1px solid transparent;
        }
        .cart-item:active { border-color: var(--primary); }
        .item-name { font-weight: 700; font-size: 14px; }
        .item-detail { font-size: 12px; color: var(--text-muted); }
        .item-price { font-weight: 800; color: var(--green); }

        /* ПАНЕЛЬ УПРАВЛЕНИЯ ЧЕКОМ (Скидки, Оплата, Данные) */
        .cart-controls {
            padding: 10px; border-top: 1px solid var(--border); background: var(--surface);
        }
        
        .control-row { display: flex; gap: 6px; margin-bottom: 10px; align-items: center; }
        .control-label { font-size: 11px; font-weight: 700; color: var(--text-muted); width: 60px; }
        
        .chip {
            flex: 1; text-align: center; background: var(--surface-alt); border: 1px solid var(--border);
            padding: 8px 0; border-radius: 8px; font-size: 12px; font-weight: 700; cursor: pointer; color: var(--text);
        }
        .chip.active-discount { background: var(--primary-fade); color: var(--primary); border-color: var(--primary); }
        .chip.active-pay { background: var(--green-fade); color: var(--green); border-color: var(--green); }

        .client-inputs { display: flex; gap: 8px; }
        .client-inputs input {
            flex: 1; background: var(--surface-alt); border: 1px solid var(--border);
            color: var(--text); padding: 10px; border-radius: 10px; font-size: 13px; outline: none;
        }

        /* НИЖНЯЯ ПАНЕЛЬ С КНОПКОЙ ДОБАВЛЕНИЯ И ИТОГОМ */
        .footer-action {
            display: flex; gap: 10px; margin-top: 12px;
        }
        .btn-main {
            flex: 1; background: var(--primary); color: #fff; border: none; padding: 14px;
            border-radius: 14px; font-size: 16px; font-weight: 800; box-shadow: 0 4px 12px var(--primary-fade);
        }
        .btn-main:active { transform: scale(0.97); }
        .total-display {
            background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
            padding: 0 16px; display: flex; align-items: center; justify-content: center;
            font-size: 18px; font-weight: 800; color: var(--green);
        }

        /* МОДАЛЬНЫЕ ОКНА (Шторки снизу) */
        .modal-overlay {
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); backdrop-filter: blur(4px);
            z-index: 100; align-items: flex-end; justify-content: center;
        }
        .modal-sheet {
            background: var(--surface); width: 100%; max-height: 90vh; overflow-y: auto;
            border-radius: 24px 24px 0 0; padding: 20px 16px max(20px, env(safe-area-inset-bottom));
            animation: slideUp 0.2s ease-out;
        }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        
        .pill { width: 40px; height: 5px; background: var(--border); border-radius: 3px; margin: 0 auto 16px auto; }
        .modal-title { font-size: 18px; font-weight: 800; margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center; }
        
        /* Элементы каталога */
        .cat-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 14px; background: var(--surface-alt); border-radius: 12px; margin-bottom: 8px; cursor: pointer;
        }
        .cat-item:active { background: var(--border); }

        .report-box {
            background: #1c1c1e; color: #32d74b; font-family: monospace; font-size: 13px;
            padding: 12px; border-radius: 12px; white-space: pre-wrap; margin-bottom: 16px;
        }
    </style>
</head>
<body data-theme="dark">

    <!-- ВЕРХНЯЯ ПАНЕЛЬ -->
    <div class="top-bar">
        <div class="app-title">🍓 POS</div>
        <div class="top-actions">
            <button class="icon-btn" onclick="toggleTheme()" id="themeBtn">☀️</button>
            <button class="icon-btn" onclick="openCatalogEdit()">⚙️</button>
            <button class="icon-btn" onclick="openReport()">📄 Отчёт</button>
        </div>
    </div>

    <!-- ИНФО О СМЕНЕ -->
    <div class="shift-info">
        <div class="input-box">
            <label>Смена</label>
            <input type="text" id="shiftDate" oninput="saveData()">
        </div>
        <div class="input-box">
            <label>Касса (₽)</label>
            <input type="text" id="shiftCash" value="10.000" oninput="saveData()">
        </div>
    </div>

    <!-- РАБОЧАЯ ЗОНА (КЛИЕНТ И ЧЕК) -->
    <div class="workspace">
        <div class="tabs" id="clientTabs"></div>
        
        <div class="cart-items" id="cartItems">
            <!-- Сюда падают товары -->
        </div>

        <div class="cart-controls">
            <!-- Скидка -->
            <div class="control-row">
                <div class="control-label">СКИДКА</div>
                <div class="chip disc-btn active-discount" onclick="setDiscount(0)">0%</div>
                <div class="chip disc-btn" onclick="setDiscount(5)">5%</div>
                <div class="chip disc-btn" onclick="setDiscount(10)">10%</div>
                <div class="chip disc-btn" onclick="setDiscount(15)">15%</div>
                <div class="chip disc-btn" onclick="setDiscount(20)">20%</div>
            </div>
            <!-- Оплата -->
            <div class="control-row">
                <div class="control-label">ОПЛАТА</div>
                <div class="chip pay-btn active-pay" onclick="setPay('Нал')">Нал</div>
                <div class="chip pay-btn" onclick="setPay('Перевод')">Перевод</div>
                <div class="chip pay-btn" onclick="setPay('Терминал')">Терминал</div>
                <div class="chip pay-btn" onclick="setPay('Долг')">Долг</div>
            </div>
            <!-- Данные -->
            <div class="client-inputs">
                <input type="text" id="clientNote" placeholder="Имя / Инфо" oninput="updateClientData()">
                <div style="display:flex; flex:0.6; gap:4px; background:var(--surface-alt); border:1px solid var(--border); border-radius:10px; padding-right:4px;">
                    <input type="text" id="clientTime" placeholder="Время" style="border:none; padding:10px; flex:1;" oninput="updateClientData()">
                    <button class="icon-btn" style="border:none; background:transparent; padding:0 8px; color:var(--text);" onclick="setNow()">🕒</button>
                </div>
            </div>
        </div>
    </div>

    <!-- НИЖНЯЯ ПАНЕЛЬ -->
    <div class="footer-action">
        <button class="btn-main" onclick="openCatalogSelect()">+ Добавить товар</button>
        <div class="total-display" id="totalDisplay">0 ₽</div>
    </div>

    <!-- ================= МОДАЛЬНЫЕ ОКНА ================= -->

    <!-- Выбор товара из каталога -->
    <div class="modal-overlay" id="modalSelect">
        <div class="modal-sheet">
            <div class="pill"></div>
            <div class="modal-title">Выберите товар <button class="icon-btn" onclick="closeModal('modalSelect')">✕</button></div>
            <div id="catalogList"></div>
        </div>
    </div>

    <!-- Ввод веса/количества (Добавление/Редактирование) -->
    <div class="modal-overlay" id="modalCalc">
        <div class="modal-sheet">
            <div class="pill"></div>
            <div class="modal-title"><span id="calcTitle">Товар</span> <button class="icon-btn" onclick="closeModal('modalCalc')">✕</button></div>
            
            <div class="input-box" style="margin-bottom:12px;">
                <label id="calcLabel">Количество / Вес</label>
                <input type="number" id="calcInput" placeholder="Введите значение..." oninput="updatePreviewSum()">
            </div>
            
            <div id="quickWeights" class="control-row" style="display:none; flex-wrap:wrap; margin-bottom:12px;">
                <div class="chip" onclick="setCalcValue(250)">250г</div>
                <div class="chip" onclick="setCalcValue(500)">500г</div>
                <div class="chip" onclick="setCalcValue(750)">750г</div>
                <div class="chip" onclick="setCalcValue(1000)">1кг</div>
                <div class="chip" onclick="setCalcValue(1500)">1.5кг</div>
            </div>

            <div style="font-size:24px; font-weight:800; color:var(--green); margin-bottom:16px; text-align:center;" id="calcPreview">0 ₽</div>
            
            <div style="display:flex; gap:10px;">
                <button class="btn-main" style="background:#ff3b30; display:none;" id="btnDelete" onclick="deleteItem()">Удалить</button>
                <button class="btn-main" onclick="confirmItem()">Сохранить</button>
            </div>
        </div>
    </div>

    <!-- Генерация отчёта (Сюда вынесены расходы и клубника) -->
    <div class="modal-overlay" id="modalReport">
        <div class="modal-sheet">
            <div class="pill"></div>
            <div class="modal-title">Итоговый отчёт <button class="icon-btn" onclick="closeModal('modalReport')">✕</button></div>
            
            <div style="display:flex; gap:10px; margin-bottom:12px;">
                <div class="input-box">
                    <label>Расходы смены</label>
                    <input type="text" id="reportExp" placeholder="не было" oninput="saveData(); buildReport();">
                </div>
                <div class="input-box">
                    <label>По клубникам</label>
                    <input type="text" id="reportStraw" placeholder="продаж не было" oninput="saveData(); buildReport();">
                </div>
            </div>

            <div class="report-box" id="reportText"></div>
            <button class="btn-main" style="width:100%; background:var(--green);" onclick="copyReport()">📋 Скопировать в буфер</button>
        </div>
    </div>

    <!-- Редактор каталога -->
    <div class="modal-overlay" id="modalCatalogEdit">
        <div class="modal-sheet">
            <div class="pill"></div>
            <div class="modal-title">Каталог <button class="icon-btn" onclick="addNewProduct()">+ Создать</button></div>
            <div id="editCatalogList"></div>
            <button class="btn-main" style="width:100%; margin-top:12px; background:var(--surface-alt); color:var(--text);" onclick="closeModal('modalCatalogEdit')">Закрыть</button>
        </div>
    </div>

    <script>
        // Исходные данные
        let catalog = [
            { id: 1, name: "Ст.клубника в шк", price: 900, type: "piece" },
            { id: 2, name: "Клубника (кг)", price: 600, type: "weight" },
            { id: 3, name: "Роза", price: 250, type: "piece" }
        ];
        let clients = [ { id: 1, note: '', items: [], pay: 'Нал', time: '', discount: 0 } ];
        let activeId = 1;
        
        // Для калькулятора
        let editMode = false;
        let editItemIndex = -1;
        let activeProd = null;

        // Инициализация
        function init() {
            const ls = localStorage.getItem('pos_v6');
            if (ls) {
                const d = JSON.parse(ls);
                catalog = d.catalog || catalog;
                clients = d.clients || clients;
                document.getElementById('shiftDate').value = d.date || getDates();
                document.getElementById('shiftCash').value = d.cash || '10.000';
                document.getElementById('reportExp').value = d.exp || '';
                document.getElementById('reportStraw').value = d.straw || '';
            } else {
                document.getElementById('shiftDate').value = getDates();
            }
            
            const savedTheme = localStorage.getItem('pos_theme') || 'dark';
            document.body.setAttribute('data-theme', savedTheme);
            document.getElementById('themeBtn').innerText = savedTheme === 'dark' ? '☀️' : '🌙';

            renderTabs();
            renderUI();
        }

        function getDates() {
            const d = new Date(), t = new Date(d); t.setDate(d.getDate() + 1);
            const f = x => String(x.getDate()).padStart(2,'0') + '.' + String(x.getMonth()+1).padStart(2,'0');
            return `${f(d)}-${f(t)}`;
        }

        function toggleTheme() {
            const current = document.body.getAttribute('data-theme');
            const next = current === 'dark' ? 'light' : 'dark';
            document.body.setAttribute('data-theme', next);
            document.getElementById('themeBtn').innerText = next === 'dark' ? '☀️' : '🌙';
            localStorage.setItem('pos_theme', next);
        }

        function saveData() {
            localStorage.setItem('pos_v6', JSON.stringify({
                catalog, clients,
                date: document.getElementById('shiftDate').value,
                cash: document.getElementById('shiftCash').value,
                exp: document.getElementById('reportExp').value,
                straw: document.getElementById('reportStraw').value
            }));
        }

        function getC() { return clients.find(c => c.id === activeId) || clients[0]; }

        // Рендер Клиентов (Табы)
        function renderTabs() {
            const t = document.getElementById('clientTabs');
            t.innerHTML = '';
            clients.forEach((c, i) => {
                const div = document.createElement('div');
                div.className = `tab ${c.id === activeId ? 'active' : ''}`;
                div.innerText = c.note ? `${i+1}. ${c.note}` : `Клиент ${i+1}`;
                div.onclick = () => { activeId = c.id; renderUI(); renderTabs(); };
                t.appendChild(div);
            });
            const add = document.createElement('div');
            add.className = 'tab'; add.innerText = '+ Новый'; add.style.color = 'var(--primary)';
            add.onclick = () => {
                const id = Date.now();
                clients.push({ id, note: '', items: [], pay: 'Нал', time: '', discount: 0 });
                activeId = id; renderTabs(); renderUI(); saveData();
            };
            t.appendChild(add);
        }

        // Рендер Рабочей зоны
        function renderUI() {
            const c = getC();
            document.getElementById('clientNote').value = c.note;
            document.getElementById('clientTime').value = c.time;

            // Кнопки Оплаты и Скидки
            document.querySelectorAll('.pay-btn').forEach(b => b.classList.toggle('active-pay', b.innerText === c.pay));
            document.querySelectorAll('.disc-btn').forEach(b => b.classList.toggle('active-discount', b.innerText === `${c.discount}%`));

            // Товары
            const box = document.getElementById('cartItems');
            box.innerHTML = '';
            let rawSum = 0;

            if (c.items.length === 0) {
                box.innerHTML = `<div style="text-align:center; padding:20px; color:var(--text-muted); font-size:13px;">Чек пуст. Добавьте товары.</div>`;
            } else {
                c.items.forEach((it, i) => {
                    rawSum += it.sum;
                    box.innerHTML += `
                        <div class="cart-item" onclick="editCartItem(${i})">
                            <div><div class="item-name">${it.name}</div><div class="item-detail">${it.val}</div></div>
                            <div class="item-price">${it.sum} ₽</div>
                        </div>`;
                });
            }

            // Подсчет итога со скидкой
            const finalSum = Math.round(rawSum * (1 - c.discount / 100));
            document.getElementById('totalDisplay').innerText = finalSum > 0 ? `${finalSum} ₽` : '0 ₽';
        }

        // Ввод данных
        function updateClientData() {
            const c = getC();
            c.note = document.getElementById('clientNote').value;
            c.time = document.getElementById('clientTime').value;
            saveData(); renderTabs(); // Обновляем таб, если имя изменилось
        }
        function setNow() {
            document.getElementById('clientTime').value = new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
            updateClientData();
        }
        function setPay(p) { getC().pay = p; saveData(); renderUI(); }
        function setDiscount(d) { getC().discount = d; saveData(); renderUI(); }

        // --- ДОБАВЛЕНИЕ И РЕДАКТИРОВАНИЕ ТОВАРОВ ---
        function openCatalogSelect() {
            const list = document.getElementById('catalogList');
            list.innerHTML = '';
            catalog.forEach(item => {
                list.innerHTML += `
                    <div class="cat-item" onclick="openCalc(false, ${item.id})">
                        <div><b>${item.name}</b> <span style="font-size:11px; color:var(--text-muted);">${item.type==='weight'?'/ кг':'/ шт'}</span></div>
                        <div style="color:var(--green); font-weight:800;">${item.price} ₽</div>
                    </div>`;
            });
            document.getElementById('modalSelect').style.display = 'flex';
        }

        function openCalc(isEdit, refId, itemIndex = -1) {
            closeModal('modalSelect');
            editMode = isEdit;
            editItemIndex = itemIndex;
            
            const c = getC();
            activeProd = catalog.find(x => x.id === refId);
            
            document.getElementById('calcTitle').innerText = activeProd.name;
            document.getElementById('calcLabel').innerText = activeProd.type === 'weight' ? 'Граммы' : 'Штуки';
            document.getElementById('quickWeights').style.display = activeProd.type === 'weight' ? 'flex' : 'none';
            document.getElementById('btnDelete').style.display = isEdit ? 'block' : 'none';

            let startVal = '';
            if (isEdit) {
                const old = c.items[itemIndex];
                startVal = old.raw; // сырое значение (шт или граммы)
            } else {
                startVal = activeProd.type === 'piece' ? 1 : '';
            }
            
            document.getElementById('calcInput').value = startVal;
            updatePreviewSum();
            document.getElementById('modalCalc').style.display = 'flex';
        }

        function editCartItem(index) {
            const item = getC().items[index];
            openCalc(true, item.refId, index);
        }

        function setCalcValue(v) { document.getElementById('calcInput').value = v; updatePreviewSum(); }

        function updatePreviewSum() {
            const val = parseFloat(document.getElementById('calcInput').value) || 0;
            const sum = activeProd.type === 'weight' ? Math.round((val/1000)*activeProd.price) : activeProd.price * val;
            document.getElementById('calcPreview').innerText = `${sum} ₽`;
            return { val, sum };
        }

        function confirmItem() {
            const { val, sum } = updatePreviewSum();
            if (val <= 0) return alert('Введите значение!');
            
            const newItem = {
                refId: activeProd.id,
                name: activeProd.name,
                raw: val,
                val: activeProd.type === 'weight' ? `${val} г` : `${val} шт`,
                sum: sum
            };

            const c = getC();
            if (editMode) c.items[editItemIndex] = newItem;
            else c.items.push(newItem);

            closeModal('modalCalc');
            saveData(); renderUI();
        }

        function deleteItem() {
            if(confirm('Удалить позицию?')){
                getC().items.splice(editItemIndex, 1);
                closeModal('modalCalc'); saveData(); renderUI();
            }
        }

        // --- ОТЧЁТ ---
        function buildReport() {
            let txt = `${document.getElementById('shiftDate').value}\nКасса: ${document.getElementById('shiftCash').value}\n\n`;
            let n = 0, p = 0; // нал, перевод

            clients.forEach((c, idx) => {
                if(c.items.length === 0) return;
                
                let rawSum = 0;
                let cTxt = c.note ? `Клиент: ${c.note}\n` : `Клиент: ${idx+1}\n`;
                
                c.items.forEach(it => { cTxt += `${it.name} - ${it.val}\n`; rawSum += it.sum; });
                
                let finalSum = Math.round(rawSum * (1 - c.discount / 100));
                if (c.discount > 0) cTxt += `(Скидка ${c.discount}%)\n`;
                
                cTxt += `(${c.pay} ${finalSum}`;
                if(c.time) cTxt += ` ${c.time}`;
                cTxt += `)\n\n`;
                
                txt += cTxt;
                if(c.pay === 'Нал') n += finalSum;
                if(c.pay === 'Перевод' || c.pay === 'Терминал') p += finalSum;
            });

            const e = document.getElementById('reportExp').value || 'не было';
            const s = document.getElementById('reportStraw').value || 'продаж не было';

            txt += `Расход: ${e}\n\nНал: ${n > 0 ? n.toLocaleString('ru-RU') : '0'}\nПеревод: ${p > 0 ? p.toLocaleString('ru-RU') : '0'}\n\nПо клубникам: ${s}`;
            document.getElementById('reportText').innerText = txt;
            return txt;
        }

        function openReport() { buildReport(); document.getElementById('modalReport').style.display = 'flex'; }
        function copyReport() {
            navigator.clipboard.writeText(buildReport()).then(()=>alert('Скопировано!')).catch(()=>alert('Ошибка копирования'));
        }

        // --- РЕДАКТИРОВАНИЕ КАТАЛОГА ---
        function openCatalogEdit() {
            const list = document.getElementById('editCatalogList');
            list.innerHTML = '';
            catalog.forEach((item, i) => {
                list.innerHTML += `
                    <div class="cat-item">
                        <div><b>${item.name}</b> <br><span style="font-size:12px; color:var(--green);">${item.price} ₽</span></div>
                        <button class="icon-btn" style="color:var(--primary); border:none;" onclick="delCat(${i})">Удалить</button>
                    </div>`;
            });
            document.getElementById('modalCatalogEdit').style.display = 'flex';
        }
        function addNewProduct() {
            const name = prompt('Название:'); if(!name) return;
            const price = parseFloat(prompt('Цена:')); if(!price) return;
            const isW = confirm('ОК - весовой (кг), Отмена - штучный');
            catalog.push({ id: Date.now(), name, price, type: isW?'weight':'piece'});
            saveData(); openCatalogEdit();
        }
        function delCat(i) {
            if(confirm('Удалить из каталога?')){ catalog.splice(i,1); saveData(); openCatalogEdit(); }
        }

        function closeModal(id) { document.getElementById(id).style.display = 'none'; }
        
        window.onload = init;
    </script>
</body>
</html>
