<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Strawberry Report</title>
    
    <!-- Настройки для работы как приложение на iPhone (PWA) -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Отчёты">
    <link rel="apple-touch-icon" href="https://img.icons8.com/emoji/192/strawberry-emoji.png">

    <style>
        :root {
            --bg: #000000;
            --card: #121212;
            --card-border: #262626;
            --accent: #0095f6; /* Instagram Blue */
            --accent-green: #10b981;
            --text-main: #f5f5f5;
            --text-sub: #a8a8a8;
            --danger: #ed4956;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            padding: 12px;
            padding-bottom: 100px;
            padding-top: max(12px, env(safe-area-inset-top));
        }

        /* Шапка */
        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 4px 14px 4px;
        }

        .app-header h1 {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .btn-reset {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-sub);
            border: none;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            transition: transform 0.1s;
        }

        .btn-reset:active { transform: scale(0.95); }

        /* Карточка Инстаграм */
        .ig-card {
            background: var(--card);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 14px;
            margin-bottom: 12px;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .row { display: flex; gap: 8px; }
        .row > div { flex: 1; }

        label {
            display: block;
            font-size: 11px;
            font-weight: 600;
            color: var(--text-sub);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        input, textarea {
            width: 100%;
            background: #000;
            border: 1px solid var(--card-border);
            color: #fff;
            padding: 10px 12px;
            border-radius: 10px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus, textarea:focus {
            border-color: var(--accent);
        }

        /* Лента быстрых товаров (Stories Style) */
        .stories-bar {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 6px;
            margin-bottom: 4px;
            scrollbar-width: none;
        }

        .stories-bar::-webkit-scrollbar { display: none; }

        .story-chip {
            background: #1a1a1a;
            border: 1px solid var(--card-border);
            color: var(--text-main);
            padding: 8px 14px;
            border-radius: 25px;
            font-size: 13px;
            font-weight: 500;
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.15s ease;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .story-chip:active {
            transform: scale(0.92);
            background: var(--accent);
            color: #fff;
        }

        .story-chip.add-btn {
            border: 1px dashed var(--accent);
            color: var(--accent);
            background: rgba(0, 149, 246, 0.1);
        }

        /* Карточка клиента */
        .client-card {
            background: var(--card);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 14px;
            margin-bottom: 12px;
        }

        .client-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .client-head strong {
            font-size: 15px;
            color: #fff;
        }

        /* Instagram Segmented Control */
        .ig-segmented {
            display: flex;
            background: #000;
            padding: 3px;
            border-radius: 10px;
            border: 1px solid var(--card-border);
            margin-bottom: 8px;
        }

        .ig-seg-btn {
            flex: 1;
            text-align: center;
            padding: 7px 0;
            font-size: 12px;
            font-weight: 500;
            color: var(--text-sub);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .ig-seg-btn.active {
            background: #262626;
            color: #fff;
            font-weight: 600;
        }

        .btn-add-client {
            background: var(--accent);
            color: #fff;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 14px;
            width: 100%;
            margin-bottom: 14px;
            transition: transform 0.1s;
        }

        .btn-add-client:active { transform: scale(0.98); }

        .btn-time {
            background: #262626;
            color: #fff;
            border: none;
            padding: 0 12px;
            border-radius: 10px;
            font-size: 13px;
        }

        .preview {
            background: #000;
            color: var(--accent-green);
            font-family: monospace;
            padding: 10px;
            border-radius: 10px;
            font-size: 12px;
            white-space: pre-wrap;
            max-height: 140px;
            overflow-y: auto;
            border: 1px solid var(--card-border);
        }

        /* Нижняя панель */
        .bottom-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-top: 1px solid var(--card-border);
            padding: 12px 16px max(12px, env(safe-area-inset-bottom)) 16px;
            z-index: 100;
        }

        .btn-copy {
            background: var(--accent-green);
            color: #fff;
            border: none;
            padding: 14px;
            border-radius: 14px;
            font-weight: 700;
            font-size: 15px;
            width: 100%;
            transition: transform 0.1s;
        }

        .btn-copy:active { transform: scale(0.98); }

        /* Всплывающее окно количества */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(5px);
            z-index: 200;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-content {
            background: var(--card);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 20px;
            width: 100%;
            max-width: 320px;
            text-align: center;
        }

        .qty-picker {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 16px;
            margin: 16px 0;
        }

        .qty-btn {
            background: #262626;
            color: #fff;
            border: none;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            font-size: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="app-header">
        <h1>🍓 Отчёты</h1>
        <button class="btn-reset" onclick="resetShift()">Сброс смены</button>
    </div>

    <!-- ДАТА И КАССА -->
    <div class="ig-card">
        <div class="row">
            <div>
                <label>Даты смены</label>
                <input type="text" id="shiftDate" oninput="saveData()">
            </div>
            <div>
                <label>Касса</label>
                <input type="text" id="cashRegister" value="10.000" oninput="saveData()">
            </div>
        </div>
    </div>

    <!-- ПАНЕЛЬ БЫСТРЫХ ТОВАРОВ (STORIES) -->
    <div style="margin-bottom: 10px;">
        <label style="padding-left: 4px;">Быстрый выбор товара</label>
        <div class="stories-bar" id="storiesBar"></div>
    </div>

    <!-- СПИСОК КЛИЕНТОВ -->
    <div id="clientsContainer"></div>
    <button class="btn-add-client" onclick="addClient()">+ Добавить клиента</button>

    <!-- РАСХОД И КЛУБНИКА -->
    <div class="ig-card">
        <div class="row" style="margin-bottom: 10px;">
            <div>
                <label>Расход</label>
                <input type="text" id="expenses" placeholder="не было" oninput="saveData()">
            </div>
            <div style="flex:0.35; display:flex; align-items:flex-end;">
                <button class="btn-reset" style="width:100%; padding:11px; border-radius:10px;" onclick="document.getElementById('expenses').value='не было'; saveData();">Не было</button>
            </div>
        </div>
        <label>По клубникам</label>
        <input type="text" id="strawberries" placeholder="продаж не было" oninput="saveData()">
    </div>

    <!-- ПРЕДПРОСМОТР -->
    <div class="ig-card">
        <label>Итоговый отчёт</label>
        <div class="preview" id="reportPreview"></div>
    </div>

    <!-- КНОПКА СНИЗУ -->
    <div class="bottom-bar">
        <button class="btn-copy" onclick="copyReport()">📋 Скопировать отчёт</button>
    </div>

    <!-- МОДАЛЬНОЕ ОКНО ДЛЯ ВЫБОРА КОЛИЧЕСТВА -->
    <div class="modal" id="qtyModal">
        <div class="modal-content">
            <h3 id="modalTitle" style="font-size: 16px; margin-bottom: 4px;"></h3>
            <div class="qty-picker">
                <button class="qty-btn" onclick="changeQty(-1)">−</button>
                <span id="modalQty" style="font-size: 24px; font-weight: 700;">1</span>
                <button class="qty-btn" onclick="changeQty(1)">+</button>
            </div>
            <button class="btn-add-client" style="margin-bottom:0;" onclick="confirmAddProduct()">Добавить в заказ</button>
        </div>
    </div>

    <script>
        let quickCatalog = ["Ст.клубника в шк", "Ст.ананас", "Ст.черешня", "Роза красная", "Доставка 350"];
        let clients = [];
        let selectedProduct = '';
        let currentQty = 1;

        function initDate() {
            const today = new Date();
            const tomorrow = new Date(today);
            tomorrow.setDate(today.getDate() + 1);
            const fmt = (d) => String(d.getDate()).padStart(2, '0') + '.' + String(d.getMonth() + 1).padStart(2, '0');
            return `${fmt(today)}-${fmt(tomorrow)}`;
        }

        function renderStories() {
            const container = document.getElementById('storiesBar');
            container.innerHTML = '';

            // Кнопка добавить новый товар в каталог
            const addBtn = document.createElement('div');
            addBtn.className = 'story-chip add-btn';
            addBtn.innerText = '+ Товар';
            addBtn.onclick = addNewCatalogItem;
            container.appendChild(addBtn);

            quickCatalog.forEach(item => {
                const chip = document.createElement('div');
                chip.className = 'story-chip';
                chip.innerText = item;
                chip.onclick = () => openQtyModal(item);
                container.appendChild(chip);
            });
        }

        function addNewCatalogItem() {
            const name = prompt('Введите название товара (например: Ежемалина):');
            if (name && name.trim()) {
                quickCatalog.push(name.trim());
                saveData();
                renderStories();
            }
        }

        function openQtyModal(itemName) {
            selectedProduct = itemName;
            currentQty = 1;
            document.getElementById('modalTitle').innerText = itemName;
            document.getElementById('modalQty').innerText = currentQty;
            document.getElementById('qtyModal').style.display = 'flex';
        }

        function changeQty(delta) {
            currentQty += delta;
            if (currentQty < 1) currentQty = 1;
            document.getElementById('modalQty').innerText = currentQty;
        }

        function confirmAddProduct() {
            document.getElementById('qtyModal').style.display = 'none';
            if (clients.length === 0) addClient(false);
            
            const lastIdx = clients.length - 1;
            const textToAdd = `${selectedProduct} - ${currentQty}`;
            
            if (clients[lastIdx].items) {
                clients[lastIdx].items += '\n' + textToAdd;
            } else {
                clients[lastIdx].items = textToAdd;
            }
            renderClients();
            saveData();
        }

        function loadData() {
            const saved = localStorage.getItem('ig_strawberry_data');
            if (saved) {
                const data = JSON.parse(saved);
                document.getElementById('shiftDate').value = data.shiftDate || initDate();
                document.getElementById('cashRegister').value = data.cashRegister || '10.000';
                document.getElementById('expenses').value = data.expenses || '';
                document.getElementById('strawberries').value = data.strawberries || 'продаж не было';
                clients = data.clients || [];
                if (data.quickCatalog) quickCatalog = data.quickCatalog;
            } else {
                document.getElementById('shiftDate').value = initDate();
                document.getElementById('strawberries').value = 'продаж не было';
            }

            if (clients.length === 0) addClient(false);
            else renderClients();

            renderStories();
            updateReport();
        }

        function saveData() {
            const data = {
                shiftDate: document.getElementById('shiftDate').value,
                cashRegister: document.getElementById('cashRegister').value,
                expenses: document.getElementById('expenses').value,
                strawberries: document.getElementById('strawberries').value,
                clients: clients,
                quickCatalog: quickCatalog
            };
            localStorage.setItem('ig_strawberry_data', JSON.stringify(data));
            updateReport();
        }

        function addClient(shouldSave = true) {
            clients.push({ name: '', items: '', payType: 'Нал', amount: '', time: '' });
            renderClients();
            if (shouldSave) saveData();
        }

        function removeClient(index) {
            clients.splice(index, 1);
            if (clients.length === 0) addClient(false);
            renderClients();
            saveData();
        }

        function setPayType(index, type) {
            clients[index].payType = type;
            renderClients();
            saveData();
        }

        function setTimeNow(index) {
            const now = new Date();
            clients[index].time = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            renderClients();
            saveData();
        }

        function renderClients() {
            const container = document.getElementById('clientsContainer');
            container.innerHTML = '';

            clients.forEach((c, i) => {
                const card = document.createElement('div');
                card.className = 'client-card';
                card.innerHTML = `
                    <div class="client-head">
                        <strong>Клиент ${i + 1}</strong>
                        ${clients.length > 1 ? `<span style="color:var(--danger); font-size:12px; font-weight:600; cursor:pointer;" onclick="removeClient(${i})">Удалить</span>` : ''}
                    </div>
                    <input type="text" placeholder="Примечание (напр., Муса Вип)" value="${c.name}" style="margin-bottom:8px;" oninput="clients[${i}].name = this.value; saveData();">
                    
                    <textarea placeholder="Состав заказа" rows="2" style="margin-bottom:8px;" oninput="clients[${i}].items = this.value; saveData();">${c.items}</textarea>

                    <div class="ig-segmented">
                        <div class="ig-seg-btn ${c.payType==='Нал'?'active':''}" onclick="setPayType(${i}, 'Нал')">Нал</div>
                        <div class="ig-seg-btn ${c.payType==='Перевод'?'active':''}" onclick="setPayType(${i}, 'Перевод')">Перевод</div>
                        <div class="ig-seg-btn ${c.payType==='Терминал'?'active':''}" onclick="setPayType(${i}, 'Терминал')">Терминал</div>
                        <div class="ig-seg-btn ${c.payType==='Долг'?'active':''}" onclick="setPayType(${i}, 'Долг')">Долг</div>
                    </div>

                    <div class="row">
                        <input type="number" placeholder="Сумма (₽)" value="${c.amount}" oninput="clients[${i}].amount = this.value; saveData();">
                        <input type="text" placeholder="Время (01:27)" value="${c.time}" oninput="clients[${i}].time = this.value; saveData();">
                        <button class="btn-time" onclick="setTimeNow(${i})">🕒</button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function generateReportText() {
            const shiftDate = document.getElementById('shiftDate').value;
            const cashRegister = document.getElementById('cashRegister').value;
            const expenses = document.getElementById('expenses').value.trim();
            const strawberries = document.getElementById('strawberries').value.trim();

            let report = `${shiftDate}\n`;
            if (cashRegister) report += `Касса: ${cashRegister}\n\n`;

            let totalCash = 0;
            let totalTransfer = 0;

            clients.forEach((c, idx) => {
                let title = `Клиент: ${idx + 1}`;
                if (c.name.trim()) title += ` ${c.name.trim()}`;
                
                report += `${title}\n`;
                if (c.items.trim()) report += `${c.items.trim()}\n`;

                let payLine = `(${c.payType}`;
                if (c.amount) {
                    const amt = parseFloat(c.amount) || 0;
                    payLine += ` ${c.amount}`;
                    if (c.payType === 'Нал') totalCash += amt;
                    if (c.payType === 'Перевод' || c.payType === 'Терминал') totalTransfer += amt;
                }
                if (c.time.trim()) payLine += ` ${c.time.trim()}`;
                payLine += `)\n\n`;
                
                report += payLine;
            });

            report += `Расход: ${expenses ? expenses : 'не было'}\n\n`;
            report += `Нал: ${totalCash > 0 ? totalCash.toLocaleString('ru-RU') : '0'}\n`;
            report += `Перевод: ${totalTransfer > 0 ? totalTransfer.toLocaleString('ru-RU') : '0'}\n\n`;
            report += `По клубникам: ${strawberries ? strawberries : 'продаж не было'}`;

            return report;
        }

        function updateReport() {
            document.getElementById('reportPreview').innerText = generateReportText();
        }

        function copyReport() {
            const text = generateReportText();
            navigator.clipboard.writeText(text).then(() => {
                alert('✅ Отчёт скопирован!');
            }).catch(() => {
                alert('Скопируйте текст из предпросмотра вручную.');
            });
        }

        function resetShift() {
            if (confirm('Очистить смену и начать заново?')) {
                localStorage.removeItem('ig_strawberry_data');
                clients = [];
                document.getElementById('expenses').value = '';
                document.getElementById('strawberries').value = 'продаж не было';
                loadData();
            }
        }

        loadData();
    </script>
</body>
</html>
