<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Strawberry POS 2.0</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <style>
        :root {
            --bg-grad-1: #0f0c29;
            --bg-grad-2: #302b63;
            --bg-grad-3: #24243e;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-main: #ffffff;
            --text-sub: rgba(255, 255, 255, 0.6);
            --accent: #ff2d55;
            --green: #32d74b;
            --pad-bg: rgba(20, 20, 25, 0.85);
            --btn-bg: rgba(255, 255, 255, 0.1);
            --btn-active: rgba(255, 255, 255, 0.2);
        }

        [data-theme="light"] {
            --bg-grad-1: #fdfbfb;
            --bg-grad-2: #ebedee;
            --bg-grad-3: #f5f7fa;
            --glass-bg: rgba(255, 255, 255, 0.7);
            --glass-border: rgba(0, 0, 0, 0.05);
            --text-main: #1c1c1e;
            --text-sub: rgba(0, 0, 0, 0.5);
            --accent: #ff2d55;
            --green: #34c759;
            --pad-bg: rgba(245, 245, 250, 0.9);
            --btn-bg: #ffffff;
            --btn-active: #e5e5ea;
        }

        * {
            box-sizing: border-box; margin: 0; padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
            -webkit-tap-highlight-color: transparent; user-select: none;
        }

        body {
            background: linear-gradient(135deg, var(--bg-grad-1), var(--bg-grad-2), var(--bg-grad-3));
            background-size: 200% 200%;
            animation: gradientMove 15s ease infinite;
            color: var(--text-main);
            height: 100dvh; 
            display: flex; flex-direction: column; overflow: hidden;
        }

        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* ТОП ПАНЕЛЬ */
        .top-nav {
            display: flex; justify-content: space-between; align-items: center;
            padding: max(16px, env(safe-area-inset-top)) 20px 10px 20px;
        }
        .top-group { display: flex; gap: 12px; }
        .icon-btn {
            background: var(--glass-bg); border: 1px solid var(--glass-border);
            color: var(--text-main); width: 42px; height: 42px; border-radius: 50%;
            display: flex; justify-content: center; align-items: center; font-size: 18px;
            backdrop-filter: blur(10px); cursor: pointer; transition: 0.15s;
        }
        .icon-btn:active { transform: scale(0.9); background: var(--btn-active); }

        /* ЧЕК (ВЕРХ) */
        .receipt-zone {
            flex: 1; padding: 0 20px 20px 20px; display: flex; flex-direction: column;
            overflow: hidden; justify-content: flex-end;
        }

        .client-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 16px;
        }
        .client-nav { display: flex; gap: 10px; align-items: center; }
        .client-name { font-size: 22px; font-weight: 800; letter-spacing: 0.5px; }
        
        .items-list {
            flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px;
            padding-bottom: 20px; scroll-behavior: smooth;
        }
        .items-list::-webkit-scrollbar { display: none; }
        
        .item-row {
            display: flex; justify-content: space-between; align-items: center;
            background: var(--glass-bg); border: 1px solid var(--glass-border);
            padding: 14px 16px; border-radius: 20px; backdrop-filter: blur(10px);
            animation: popIn 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
        }
        @keyframes popIn { from { opacity: 0; transform: scale(0.95) translateY(10px); } to { opacity: 1; transform: scale(1) translateY(0); } }
        
        .item-info h4 { font-size: 16px; font-weight: 700; margin-bottom: 4px; }
        .item-info p { font-size: 12px; color: var(--text-sub); font-weight: 600; }
        .item-price { font-size: 18px; font-weight: 800; }
        
        .total-block { text-align: right; margin-top: 10px; }
        .total-block .label { font-size: 14px; color: var(--text-sub); font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }
        .total-block .sum { font-size: 44px; font-weight: 800; color: var(--green); line-height: 1; margin-top: 4px; }
        .discount-badge {
            display: inline-block; background: var(--accent); color: #fff;
            padding: 4px 10px; border-radius: 12px; font-size: 12px; font-weight: 800; margin-bottom: 6px;
        }

        /* SMART PAD (НИЗ) */
        .smart-pad {
            background: var(--pad-bg); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
            border-radius: 32px 32px 0 0; padding: 24px 20px max(24px, env(safe-area-inset-bottom));
            box-shadow: 0 -10px 40px rgba(0,0,0,0.3); transition: 0.3s ease;
        }

        /* МАГИЯ ПАНЕЛЕЙ (ЖЕСТКАЯ ФИКСАЦИЯ СЕТКИ) */
        .pad-section { display: none; }
        .pad-section.active.grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
        .pad-section.active.block { display: block; }

        .pad-btn {
            background: var(--btn-bg); border: none; border-radius: 20px; height: 85px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            color: var(--text-main); cursor: pointer; transition: transform 0.1s;
        }
        .pad-btn:active { background: var(--btn-active); transform: scale(0.92); }
        .pad-btn .icon { font-size: 24px; margin-bottom: 6px; }
        .pad-btn .name { font-size: 12px; font-weight: 700; text-align: center; line-height: 1.1; padding: 0 4px; }
        
        /* Цвета функциональных кнопок */
        .pad-btn.action { background: rgba(255, 45, 85, 0.1); color: var(--accent); }
        .pad-btn.pay { background: rgba(50, 215, 75, 0.1); color: var(--green); }
        .pad-btn.action:active { background: rgba(255, 45, 85, 0.2); }
        .pad-btn.pay:active { background: rgba(50, 215, 75, 0.2); }

        /* Цифровая клавиатура */
        .numpad-display {
            background: var(--glass-bg); border-radius: 20px; padding: 20px; text-align: center;
            margin-bottom: 16px; font-size: 28px; font-weight: 800; color: var(--green); border: 1px solid var(--glass-border);
        }
        .num-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
        .num-btn {
            background: var(--btn-bg); border: none; border-radius: 20px; height: 65px;
            font-size: 24px; font-weight: 600; color: var(--text-main);
        }
        .num-btn:active { background: var(--btn-active); transform: scale(0.95); }
        .num-btn.done { background: var(--green); color: #fff; font-weight: 800; }
        .num-btn.cancel { background: var(--accent); color: #fff; font-size: 18px; font-weight: 700; }

        /* МОДАЛЬНЫЕ ОКНА */
        .overlay {
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6);
            backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); z-index: 100;
            justify-content: center; align-items: center; padding: 20px;
        }
        .modal-card {
            background: var(--pad-bg); width: 100%; max-width: 420px; border-radius: 32px;
            padding: 24px; border: 1px solid var(--glass-border); animation: popIn 0.3s;
            max-height: 85vh; display: flex; flex-direction: column;
        }
        .modal-title { font-size: 22px; font-weight: 800; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
        
        .modal-body { overflow-y: auto; flex: 1; padding-bottom: 10px; }
        .modal-body::-webkit-scrollbar { display: none; }

        .input-group { margin-bottom: 16px; }
        .input-group label { display: block; font-size: 12px; font-weight: 700; color: var(--text-sub); margin-bottom: 8px; text-transform: uppercase; }
        .input-group input {
            width: 100%; background: var(--btn-bg); border: 1px solid var(--glass-border); color: var(--text-main);
            padding: 16px; border-radius: 16px; font-size: 16px; font-weight: 600; outline: none;
        }
        
        .big-btn {
            width: 100%; background: var(--btn-bg); color: var(--text-main); border: none; padding: 18px;
            border-radius: 20px; font-size: 16px; font-weight: 800; margin-top: 10px; cursor: pointer; transition: 0.1s;
        }
        .big-btn:active { opacity: 0.7; transform: scale(0.97); }
        .big-btn.green { background: var(--green); color: #fff; }
        .big-btn.red { background: rgba(255,45,85,0.1); color: var(--accent); margin-top: 24px; }

        .report-view { background: rgba(0,0,0,0.3); padding: 16px; border-radius: 16px; font-family: monospace; font-size: 13px; color: #32d74b; white-space: pre-wrap; margin-bottom: 16px; }
        
        /* История */
        .history-item {
            background: var(--glass-bg); border: 1px solid var(--glass-border); padding: 16px;
            border-radius: 16px; margin-bottom: 10px; cursor: pointer;
        }
        .history-item h3 { font-size: 16px; margin-bottom: 4px; }
        .history-item p { font-size: 13px; color: var(--text-sub); }
        .history-details { display: none; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--glass-border); color: var(--green); font-family: monospace; font-size: 12px; white-space: pre-wrap; }
    </style>
</head>
<body data-theme="dark">

    <div class="top-nav">
        <div class="icon-btn" onclick="toggleTheme()" id="themeBtn">☀️</div>
        <div class="top-group">
            <div class="icon-btn" onclick="openModal('modalHistory')">🕰️</div>
            <div class="icon-btn" onclick="openModal('modalSettings')">⚙️</div>
            <div class="icon-btn" onclick="openReport()">📄</div>
        </div>
    </div>

    <div class="receipt-zone">
        <div class="client-header">
            <div class="client-nav">
                <div class="icon-btn" onclick="prevClient()">←</div>
                <div class="client-name" id="clientName">Клиент 1</div>
                <div class="icon-btn" onclick="nextClient()">→</div>
            </div>
            <div class="icon-btn" onclick="addClient()" style="background: var(--accent); color:white; border:none;">+</div>
        </div>

        <div class="items-list" id="receiptItems"></div>

        <div class="total-block">
            <div id="discountBadge" class="discount-badge" style="display:none;"></div>
            <div class="label" id="payMethodLabel">К ОПЛАТЕ (НАЛ)</div>
            <div class="sum" id="totalSum">0 ₽</div>
        </div>
    </div>

    <!-- SMART PAD -->
    <div class="smart-pad">
        
        <!-- Главное меню товаров (СЕТКА) -->
        <div class="pad-section active grid" id="padMain"></div>

        <!-- Ввод веса (БЛОК) -->
        <div class="pad-section block" id="padWeight">
            <div class="numpad-display" id="weightDisplay">0 г = 0 ₽</div>
            <div class="num-grid">
                <button class="num-btn" onclick="typeWeight('1')">1</button>
                <button class="num-btn" onclick="typeWeight('2')">2</button>
                <button class="num-btn" onclick="typeWeight('3')">3</button>
                <button class="num-btn" onclick="typeWeight('4')">4</button>
                <button class="num-btn" onclick="typeWeight('5')">5</button>
                <button class="num-btn" onclick="typeWeight('6')">6</button>
                <button class="num-btn" onclick="typeWeight('7')">7</button>
                <button class="num-btn" onclick="typeWeight('8')">8</button>
                <button class="num-btn" onclick="typeWeight('9')">9</button>
                <button class="num-btn cancel" onclick="cancelWeight()">Отмена</button>
                <button class="num-btn" onclick="typeWeight('0')">0</button>
                <button class="num-btn done" onclick="confirmWeight()">✓</button>
            </div>
        </div>

        <!-- Скидка (БЛОК) -->
        <div class="pad-section block" id="padDiscount">
            <div class="numpad-display" style="color:var(--accent);">Скидка</div>
            <div class="num-grid" style="grid-template-columns: repeat(2, 1fr);">
                <button class="num-btn" onclick="applyDiscount(0)">0%</button>
                <button class="num-btn" onclick="applyDiscount(5)">5%</button>
                <button class="num-btn" onclick="applyDiscount(10)">10%</button>
                <button class="num-btn" onclick="applyDiscount(15)">15%</button>
                <button class="num-btn" onclick="applyDiscount(20)">20%</button>
                <button class="num-btn cancel" onclick="closePads()">Отмена</button>
            </div>
        </div>

        <!-- Оплата (БЛОК) -->
        <div class="pad-section block" id="padPay">
            <div class="numpad-display" style="color:var(--text-main);">Оплата</div>
            <div class="num-grid" style="grid-template-columns: repeat(2, 1fr);">
                <button class="num-btn" style="color:var(--green);" onclick="applyPay('Нал')">💵 Нал</button>
                <button class="num-btn" style="color:#0a84ff;" onclick="applyPay('Перевод')">📱 Перевод</button>
                <button class="num-btn" style="color:#ff9f0a;" onclick="applyPay('Терминал')">💳 Терминал</button>
                <button class="num-btn" style="color:var(--accent);" onclick="applyPay('Долг')">📝 В долг</button>
                <button class="num-btn cancel" style="grid-column: span 2;" onclick="closePads()">Отмена</button>
            </div>
        </div>

    </div>

    <!-- ОКНО: НАСТРОЙКИ (И СБРОС) -->
    <div class="overlay" id="modalSettings" style="display:none;">
        <div class="modal-card">
            <div class="modal-title">Смена <div class="icon-btn" onclick="closeModal('modalSettings')">✕</div></div>
            <div class="modal-body">
                <div class="input-group">
                    <label>Период смены</label>
                    <input type="text" id="inpDate" oninput="saveCore()">
                </div>
                <div class="input-group">
                    <label>Старт кассы (₽)</label>
                    <input type="text" id="inpCash" oninput="saveCore()">
                </div>
                <div class="input-group">
                    <label>Расходы смены</label>
                    <input type="text" id="inpExp" placeholder="не было" oninput="saveCore()">
                </div>
                <div class="input-group">
                    <label>Инфо по клубникам</label>
                    <input type="text" id="inpStraw" placeholder="продаж не было" oninput="saveCore()">
                </div>
                <div class="input-group">
                    <label>Имя/Авто текущего клиента</label>
                    <input type="text" id="inpClientNote" placeholder="..." oninput="updateClientMeta()">
                </div>
                
                <button class="big-btn red" onclick="clearCurrentShift()">🚨 Сбросить смену (очистить данные)</button>
            </div>
        </div>
    </div>

    <!-- ОКНО: ОТЧЕТ И ЗАКРЫТИЕ СМЕНЫ -->
    <div class="overlay" id="modalReport" style="display:none;">
        <div class="modal-card">
            <div class="modal-title">Отчёт <div class="icon-btn" onclick="closeModal('modalReport')">✕</div></div>
            <div class="modal-body">
                <div class="report-view" id="reportOutput"></div>
                <button class="big-btn green" onclick="copyReport()">📋 Скопировать текст</button>
                <button class="big-btn" style="margin-top:10px; background:rgba(50,215,75,0.2); color:var(--green);" onclick="endShiftAndSave()">📦 Завершить смену и в архив</button>
            </div>
        </div>
    </div>

    <!-- ОКНО: ИСТОРИЯ СМЕН -->
    <div class="overlay" id="modalHistory" style="display:none;">
        <div class="modal-card">
            <div class="modal-title">Архив смен <div class="icon-btn" onclick="closeModal('modalHistory')">✕</div></div>
            <div class="modal-body" id="historyList">
                <!-- Сюда падают старые смены -->
            </div>
        </div>
    </div>

    <script>
        // База данных
        const catalog = [
            { id: 1, name: "Клубника ШК", icon: "🍓", price: 900, type: "piece" },
            { id: 2, name: "Ананас ШК", icon: "🍍", price: 1200, type: "piece" },
            { id: 3, name: "Роза", icon: "🌹", price: 250, type: "piece" },
            { id: 4, name: "Клубника (кг)", icon: "⚖️", price: 600, type: "weight" },
            { id: 5, name: "Голубика (кг)", icon: "🫐", price: 1500, type: "weight" },
            { id: 6, name: "Доставка", icon: "🚗", price: 350, type: "piece" }
        ];

        // Состояние приложения
        let app = {
            theme: 'dark',
            shift: {
                date: '', cash: '10.000', exp: '', straw: '',
                clients: [{ id: 1, note: '', items: [], pay: 'Нал', discount: 0, time: '' }]
            },
            history: [] // { date: '...', total: 0, report: '...' }
        };
        let activeIndex = 0;
        let currentWeightStr = "";
        let activeWeightProduct = null;

        // Инициализация
        function init() {
            const saved = localStorage.getItem('pos_v2');
            if (saved) {
                app = JSON.parse(saved);
                // Защита, если клиенты пустые
                if(!app.shift.clients || app.shift.clients.length === 0) resetShiftData();
            } else {
                app.shift.date = getAutoDate();
            }
            
            document.body.setAttribute('data-theme', app.theme);
            document.getElementById('themeBtn').innerText = app.theme === 'dark' ? '☀️' : '🌙';
            
            syncInputsToApp();
            renderPad();
            renderReceipt();
        }

        function getAutoDate() {
            const d = new Date(), t = new Date(d); t.setDate(d.getDate() + 1);
            const f = x => String(x.getDate()).padStart(2,'0') + '.' + String(x.getMonth()+1).padStart(2,'0');
            return `${f(d)}-${f(t)}`;
        }

        function toggleTheme() {
            app.theme = app.theme === 'dark' ? 'light' : 'dark';
            document.body.setAttribute('data-theme', app.theme);
            document.getElementById('themeBtn').innerText = app.theme === 'dark' ? '☀️' : '🌙';
            saveCore();
        }

        function saveCore() {
            // Забираем данные из инпутов
            app.shift.date = document.getElementById('inpDate').value || app.shift.date;
            app.shift.cash = document.getElementById('inpCash').value || app.shift.cash;
            app.shift.exp = document.getElementById('inpExp').value;
            app.shift.straw = document.getElementById('inpStraw').value;
            localStorage.setItem('pos_v2', JSON.stringify(app));
        }

        function syncInputsToApp() {
            document.getElementById('inpDate').value = app.shift.date;
            document.getElementById('inpCash').value = app.shift.cash;
            document.getElementById('inpExp').value = app.shift.exp;
            document.getElementById('inpStraw').value = app.shift.straw;
        }

        // --- КЛИЕНТЫ ---
        function getC() { return app.shift.clients[activeIndex]; }
        
        function nextClient() { if(activeIndex < app.shift.clients.length - 1) { activeIndex++; renderReceipt(); } }
        function prevClient() { if(activeIndex > 0) { activeIndex--; renderReceipt(); } }
        function addClient() {
            app.shift.clients.push({ id: Date.now(), note: '', items: [], pay: 'Нал', discount: 0, time: '' });
            activeIndex = app.shift.clients.length - 1;
            renderReceipt(); saveCore();
        }
        function updateClientMeta() {
            getC().note = document.getElementById('inpClientNote').value;
            saveCore(); renderReceipt();
        }

        // --- ЧЕК ---
        function renderReceipt() {
            const c = getC();
            document.getElementById('clientName').innerText = c.note ? `Клиент ${activeIndex + 1} (${c.note})` : `Клиент ${activeIndex + 1}`;
            document.getElementById('inpClientNote').value = c.note || '';

            document.getElementById('payMethodLabel').innerText = `К ОПЛАТЕ (${c.pay})`;
            const badge = document.getElementById('discountBadge');
            if(c.discount > 0) { badge.style.display = 'inline-block'; badge.innerText = `СКИДКА ${c.discount}%`; }
            else { badge.style.display = 'none'; }

            const list = document.getElementById('receiptItems');
            list.innerHTML = '';
            let rawSum = 0;

            if (c.items.length === 0) {
                list.innerHTML = `<div style="text-align:center; padding:40px 20px; color:var(--text-sub); font-size:14px; font-weight:600;">Чек пуст. Нажмите на товар ниже.</div>`;
            } else {
                c.items.forEach((it, idx) => {
                    rawSum += it.sum;
                    list.innerHTML += `
                        <div class="item-row" onclick="removeItem(${idx})">
                            <div class="item-info"><h4>${it.icon} ${it.name}</h4><p>${it.val} <span style="font-size:10px; opacity:0.6;">(удали ✕)</span></p></div>
                            <div class="item-price">${it.sum} ₽</div>
                        </div>`;
                });
                setTimeout(() => list.scrollTop = list.scrollHeight, 50);
            }

            const finalSum = Math.round(rawSum * (1 - c.discount / 100));
            document.getElementById('totalSum').innerText = finalSum > 0 ? `${finalSum.toLocaleString('ru-RU')} ₽` : '0 ₽';
        }

        function removeItem(idx) { getC().items.splice(idx, 1); saveCore(); renderReceipt(); }

        // --- КЛАВИАТУРА И ЭКРАНЫ ---
        function renderPad() {
            const pad = document.getElementById('padMain');
            pad.innerHTML = '';
            
            catalog.forEach(item => {
                pad.innerHTML += `
                    <button class="pad-btn" onclick="handleProductClick(${item.id})">
                        <div class="icon">${item.icon}</div>
                        <div class="name">${item.name}<br><span style="font-size:10px; opacity:0.6">${item.price}₽</span></div>
                    </button>`;
            });

            pad.innerHTML += `
                <button class="pad-btn action" onclick="showPad('padDiscount')"><div class="icon">🏷️</div><div class="name">Скидка</div></button>
                <button class="pad-btn action" onclick="setNowTime()"><div class="icon">🕒</div><div class="name">Время</div></button>
                <button class="pad-btn pay" onclick="showPad('padPay')"><div class="icon">💳</div><div class="name">Оплата</div></button>
            `;
        }

        function setNowTime() {
            getC().time = new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
            saveCore(); renderReceipt();
        }

        // БЕЗОПАСНОЕ ПЕРЕКЛЮЧЕНИЕ ПАНЕЛЕЙ (Фикс бага сетки)
        function showPad(id) {
            // Убираем класс active у всех
            document.querySelectorAll('.pad-section').forEach(el => el.classList.remove('active'));
            // Добавляем классу active нужному id
            document.getElementById(id).classList.add('active');
        }
        function closePads() { showPad('padMain'); }

        function handleProductClick(id) {
            const item = catalog.find(x => x.id === id);
            if (item.type === 'piece') {
                getC().items.push({ icon: item.icon, name: item.name, val: '1 шт', sum: item.price });
                saveCore(); renderReceipt();
            } else {
                activeWeightProduct = item; currentWeightStr = ""; updateWeightDisplay();
                showPad('padWeight');
            }
        }

        function typeWeight(num) {
            if (currentWeightStr.length < 5) currentWeightStr += num;
            updateWeightDisplay();
        }
        function cancelWeight() { currentWeightStr = ""; closePads(); }
        
        function updateWeightDisplay() {
            const grams = parseInt(currentWeightStr) || 0;
            const sum = Math.round((grams / 1000) * activeWeightProduct.price);
            document.getElementById('weightDisplay').innerText = `${grams} г = ${sum} ₽`;
        }
        function confirmWeight() {
            const grams = parseInt(currentWeightStr) || 0;
            if (grams > 0) {
                const sum = Math.round((grams / 1000) * activeWeightProduct.price);
                getC().items.push({ icon: activeWeightProduct.icon, name: activeWeightProduct.name, val: `${grams} г`, sum: sum });
                saveCore(); renderReceipt();
            }
            closePads();
        }

        function applyDiscount(val) { getC().discount = val; saveCore(); renderReceipt(); closePads(); }
        function applyPay(val) { getC().pay = val; saveCore(); renderReceipt(); closePads(); }

        // --- ОКНА, ОТЧЕТ И СБРОС ---
        function openModal(id) { 
            if(id === 'modalHistory') renderHistory();
            document.getElementById(id).style.display = 'flex'; 
        }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }

        function generateReportText() {
            let txt = `${app.shift.date}\nКасса: ${app.shift.cash}\n\n`;
            let n = 0, p = 0, totalShift = 0;

            app.shift.clients.forEach((c, idx) => {
                if(c.items.length === 0) return;
                
                let rawSum = 0;
                let cTxt = c.note ? `Клиент: ${c.note}\n` : `Клиент: ${idx+1}\n`;
                c.items.forEach(it => { cTxt += `${it.name} - ${it.val}\n`; rawSum += it.sum; });
                
                let finalSum = Math.round(rawSum * (1 - c.discount / 100));
                totalShift += finalSum;

                if (c.discount > 0) cTxt += `(Скидка ${c.discount}%)\n`;
                cTxt += `(${c.pay} ${finalSum}`;
                if(c.time) cTxt += ` ${c.time}`;
                cTxt += `)\n\n`;
                
                txt += cTxt;
                if(c.pay === 'Нал') n += finalSum;
                if(c.pay === 'Перевод' || c.pay === 'Терминал') p += finalSum;
            });

            const e = app.shift.exp || 'не было';
            const s = app.shift.straw || 'продаж не было';
            txt += `Расход: ${e}\n\nНал: ${n > 0 ? n.toLocaleString('ru-RU') : '0'}\nПеревод: ${p > 0 ? p.toLocaleString('ru-RU') : '0'}\n\nПо клубникам: ${s}`;
            return { text: txt, total: totalShift };
        }

        function openReport() {
            document.getElementById('reportOutput').innerText = generateReportText().text;
            openModal('modalReport');
        }

        function copyReport() {
            navigator.clipboard.writeText(generateReportText().text).then(()=>alert('✅ Отчёт скопирован!')).catch(()=>alert('Ошибка'));
        }

        // --- УПРАВЛЕНИЕ ДАННЫМИ (ОЧИСТКА И АРХИВ) ---
        function resetShiftData() {
            app.shift.date = getAutoDate();
            app.shift.cash = '10.000'; app.shift.exp = ''; app.shift.straw = '';
            app.shift.clients = [{ id: Date.now(), note: '', items: [], pay: 'Нал', discount: 0, time: '' }];
            activeIndex = 0;
            syncInputsToApp(); saveCore(); renderReceipt();
        }

        function clearCurrentShift() {
            if(confirm('🚨 Вы уверены, что хотите полностью очистить текущую смену? Данные не сохранятся в архив.')) {
                resetShiftData();
                closeModal('modalSettings');
            }
        }

        function endShiftAndSave() {
            if(confirm('📦 Завершить смену? Отчёт будет сохранен в архив, а текущий экран очистится.')) {
                const rep = generateReportText();
                if(rep.total > 0 || app.shift.exp !== '') {
                    app.history.unshift({
                        id: Date.now(),
                        date: app.shift.date,
                        total: rep.total,
                        report: rep.text
                    });
                }
                resetShiftData();
                closeModal('modalReport');
            }
        }

        // --- ИСТОРИЯ СМЕН ---
        function renderHistory() {
            const list = document.getElementById('historyList');
            list.innerHTML = '';
            if(app.history.length === 0) {
                list.innerHTML = '<div style="text-align:center; color:var(--text-sub); margin-top:20px;">Архив пуст. Завершите смену, чтобы сохранить отчёт сюда.</div>';
                return;
            }

            app.history.forEach((h, i) => {
                list.innerHTML += `
                    <div class="history-item" onclick="toggleHist(${i})">
                        <div style="display:flex; justify-content:space-between; align-items:center;">
                            <h3>Смена: ${h.date}</h3>
                            <div style="font-weight:800; color:var(--green);">${h.total.toLocaleString('ru-RU')} ₽</div>
                        </div>
                        <p>Нажми, чтобы посмотреть детали</p>
                        <div class="history-details" id="hist_det_${i}">${h.report}</div>
                    </div>`;
            });
        }

        function toggleHist(i) {
            const el = document.getElementById(`hist_det_${i}`);
            el.style.display = el.style.display === 'block' ? 'none' : 'block';
        }

        window.onload = init;
    </script>
</body>
</html>
