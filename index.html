<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Aura POS</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            --glass-bg: rgba(255, 255, 255, 0.75);
            --glass-card: rgba(255, 255, 255, 0.85);
            --text-main: #111827;
            --text-muted: #6b7280;
            --primary: #6366f1;
            --primary-gradient: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --border: rgba(255, 255, 255, 0.6);
            --shadow: 0 10px 30px 0 rgba(31, 38, 135, 0.07);
        }

        [data-theme="dark"] {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            --glass-bg: rgba(15, 23, 42, 0.75);
            --glass-card: rgba(30, 41, 59, 0.75);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #818cf8;
            --primary-gradient: linear-gradient(135deg, #818cf8 0%, #6366f1 100%);
            --accent-green: #34d399;
            --accent-red: #f87171;
            --border: rgba(255, 255, 255, 0.08);
            --shadow: 0 10px 30px 0 rgba(0, 0, 0, 0.3);
        }

        * {
            box-sizing: border-box; margin: 0; padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent; user-select: none;
        }

        body {
            background: var(--bg-gradient); background-attachment: fixed;
            color: var(--text-main); height: 100dvh; display: flex; flex-direction: column;
            overflow: hidden; transition: background 0.4s ease;
        }

        /* ХЕДЕР */
        header {
            display: flex; justify-content: space-between; align-items: center;
            padding: max(14px, env(safe-area-inset-top)) 20px 10px 20px;
            z-index: 10;
        }
        .brand { font-size: 20px; font-weight: 800; letter-spacing: -0.5px; background: var(--primary-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .header-tools { display: flex; gap: 10px; }
        .btn-icon {
            width: 42px; height: 42px; border-radius: 14px; background: var(--glass-card);
            border: 1px solid var(--border); display: flex; align-items: center; justify-content: center;
            font-size: 18px; cursor: pointer; box-shadow: var(--shadow); backdrop-filter: blur(10px);
            transition: transform 0.2s; color: var(--text-main);
        }
        .btn-icon:active { transform: scale(0.9); }

        /* ОСНОВНОЙ КОНТЕЙНЕР */
        .workspace {
            flex: 1; display: flex; flex-direction: column; padding: 0 16px 12px 16px;
            overflow: hidden; gap: 12px; max-width: 600px; width: 100%; margin: 0 auto;
        }

        /* КАРУСЕЛЬ КЛИЕНТОВ (ТАБЫ) */
        .orders-bar {
            display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none;
        }
        .orders-bar::-webkit-scrollbar { display: none; }
        
        .order-tab {
            background: var(--glass-card); border: 1px solid var(--border);
            padding: 8px 16px; border-radius: 14px; font-size: 13px; font-weight: 700;
            white-space: nowrap; cursor: pointer; box-shadow: var(--shadow); backdrop-filter: blur(10px);
            transition: all 0.2s; color: var(--text-muted); display: flex; align-items: center; gap: 6px;
        }
        .order-tab.active { background: var(--primary-gradient); color: #fff; border-color: transparent; }
        .order-tab-add { background: var(--primary); color: #fff; border: none; }

        /* ОСНОВНОЙ ЧЕК КАРТОЧКА */
        .receipt-card {
            flex: 1; background: var(--glass-card); border: 1px solid var(--border);
            border-radius: 24px; display: flex; flex-direction: column; padding: 16px;
            box-shadow: var(--shadow); backdrop-filter: blur(20px); overflow: hidden;
        }

        .receipt-header-row {
            display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;
            padding-bottom: 8px; border-bottom: 1px solid var(--border);
        }
        .client-input {
            background: transparent; border: none; font-size: 16px; font-weight: 700; color: var(--text-main);
            outline: none; width: 60%;
        }
        .pay-badge {
            background: rgba(99, 102, 241, 0.1); color: var(--primary); padding: 6px 12px;
            border-radius: 10px; font-size: 12px; font-weight: 700; cursor: pointer;
        }

        .cart-list {
            flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding-right: 2px;
        }
        .cart-list::-webkit-scrollbar { width: 4px; }
        .cart-list::-webkit-scrollbar-thumb { background: var(--text-muted); border-radius: 4px; opacity: 0.3; }

        .cart-item {
            display: flex; justify-content: space-between; align-items: center;
            background: var(--bg-gradient); padding: 10px 12px; border-radius: 14px;
            border: 1px solid var(--border);
        }
        .cart-item-info h5 { font-size: 14px; font-weight: 700; margin-bottom: 2px; }
        .cart-item-info span { font-size: 12px; color: var(--text-muted); font-weight: 600; }
        
        .cart-item-controls { display: flex; align-items: center; gap: 8px; }
        .mini-btn {
            width: 28px; height: 28px; border-radius: 8px; border: none; background: var(--glass-card);
            color: var(--text-main); font-weight: 700; display: flex; align-items: center; justify-content: center;
            cursor: pointer; box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .mini-btn.del { color: var(--accent-red); }

        .receipt-footer {
            margin-top: auto; padding-top: 12px; border-top: 1px solid var(--border);
            display: flex; justify-content: space-between; align-items: flex-end;
        }
        .total-label { font-size: 11px; text-transform: uppercase; color: var(--text-muted); font-weight: 700; letter-spacing: 0.5px; }
        .total-sum { font-size: 28px; font-weight: 900; letter-spacing: -1px; }

        /* КАТАЛОГ СЕТКА */
        .catalog-container {
            height: 220px; background: var(--glass-card); border: 1px solid var(--border);
            border-radius: 24px; padding: 12px; display: grid; grid-template-columns: repeat(3, 1fr);
            gap: 8px; overflow-y: auto; box-shadow: var(--shadow); backdrop-filter: blur(20px);
        }
        .catalog-container::-webkit-scrollbar { display: none; }

        .product-tile {
            background: var(--bg-gradient); border: 1px solid var(--border); border-radius: 16px;
            padding: 10px; display: flex; flex-direction: column; align-items: center; justify-content: center;
            cursor: pointer; transition: transform 0.15s, background 0.15s; text-align: center; position: relative;
        }
        .product-tile:active { transform: scale(0.94); }
        .product-tile .icon { font-size: 24px; margin-bottom: 4px; }
        .product-tile .name { font-size: 12px; font-weight: 700; line-height: 1.2; color: var(--text-main); }
        .product-tile .price { font-size: 10px; font-weight: 600; color: var(--text-muted); margin-top: 2px; }

        /* МОДАЛЬНЫЕ ОКНА И ОВЕРЛЕИ */
        .overlay {
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5);
            backdrop-filter: blur(12px); z-index: 100; justify-content: center; align-items: center; padding: 16px;
        }
        .modal {
            background: var(--glass-card); width: 100%; max-width: 380px; border-radius: 28px;
            padding: 24px; border: 1px solid var(--border); box-shadow: 0 20px 50px rgba(0,0,0,0.3);
            animation: popIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @keyframes popIn { from { opacity: 0; transform: scale(0.9) translateY(20px); } to { opacity: 1; transform: scale(1) translateY(0); } }
        
        .modal-title { font-size: 18px; font-weight: 800; margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center; }
        .input-box {
            width: 100%; background: var(--bg-gradient); border: 1px solid var(--border);
            padding: 14px; border-radius: 16px; font-size: 16px; font-weight: 600; color: var(--text-main);
            outline: none; margin-bottom: 12px;
        }
        .modal-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
        .btn-action {
            padding: 14px; border-radius: 16px; border: none; font-size: 15px; font-weight: 700; cursor: pointer;
        }
        .btn-action.primary { background: var(--primary-gradient); color: #fff; grid-column: span 2; }
        .btn-action.secondary { background: var(--bg-gradient); color: var(--text-main); border: 1px solid var(--border); }

        .preset-weights { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 12px; }
        .preset-btn { background: var(--bg-gradient); border: 1px solid var(--border); padding: 10px; border-radius: 12px; font-weight: 700; cursor: pointer; color: var(--text-main); font-size: 13px; text-align: center; }
        .preset-btn:active { background: var(--primary); color: #fff; }

        .report-box {
            background: var(--bg-gradient); padding: 14px; border-radius: 16px; font-family: monospace;
            font-size: 12px; line-height: 1.5; max-height: 50vh; overflow-y: auto; border: 1px solid var(--border);
            margin-bottom: 16px; white-space: pre-wrap;
        }
    </style>
</head>
<body data-theme="light">

    <header>
        <div class="brand">AURA POS</div>
        <div class="header-tools">
            <div class="btn-icon" onclick="toggleTheme()" id="themeBtn">🌙</div>
            <div class="btn-icon" onclick="openReport()">📊</div>
            <div class="btn-icon" onclick="openSettings()">⚙️</div>
        </div>
    </header>

    <div class="workspace">
        <!-- ТАБЫ ЗАКАЗОВ -->
        <div class="orders-bar" id="ordersBar">
            <button class="order-tab order-tab-add" onclick="addNewOrder()">+ Заказ</button>
        </div>

        <!-- КАРТОЧКА АКТИВНОГО ЗАКАЗА -->
        <div class="receipt-card">
            <div class="receipt-header-row">
                <input type="text" class="client-input" id="clientNoteInput" placeholder="Имя или авто..." oninput="updateClientNote()">
                <div class="pay-badge" id="payBadge" onclick="openPayModal()">💵 Нал</div>
            </div>

            <div class="cart-list" id="cartList"></div>

            <div class="receipt-footer">
                <div>
                    <div class="total-label">Скидка: <span id="discountLabel" style="color:var(--accent-red)">0%</span></div>
                    <button class="mini-btn" style="margin-top:4px; width:auto; padding:0 8px; font-size:11px;" onclick="openDiscountModal()">🏷️ Изменить</button>
                </div>
                <div style="text-align: right;">
                    <div class="total-label">ИТОГО К ОПЛАТЕ</div>
                    <div class="total-sum" id="totalSum">0 ₽</div>
                </div>
            </div>
        </div>

        <!-- КАТАЛОГ ТОВАРОВ -->
        <div class="catalog-container" id="catalogGrid"></div>
    </div>

    <!-- МОДАЛКА ВЕСА (ДЛЯ ВЕСОВЫХ ТОВАРОВ) -->
    <div class="overlay" id="modalWeight">
        <div class="modal">
            <div class="modal-title"><span id="weightModalTitle">Укажите вес</span> <div class="btn-icon" style="width:32px; height:32px;" onclick="closeModal('modalWeight')">✕</div></div>
            <div class="preset-weights">
                <div class="preset-btn" onclick="selectWeightPreset(250)">250 г</div>
                <div class="preset-btn" onclick="selectWeightPreset(500)">500 г</div>
                <div class="preset-btn" onclick="selectWeightPreset(1000)">1 кг</div>
            </div>
            <input type="number" class="input-box" id="weightInput" placeholder="Граммы или сумма (₽)...">
            <button class="btn-action primary" onclick="confirmWeightItem()">Добавить в заказ</button>
        </div>
    </div>

    <!-- МОДАЛКА ОПЛАТЫ -->
    <div class="overlay" id="modalPay">
        <div class="modal">
            <div class="modal-title">Способ оплаты <div class="btn-icon" style="width:32px; height:32px;" onclick="closeModal('modalPay')">✕</div></div>
            <div style="display:flex; flex-direction:column; gap:8px;">
                <button class="btn-action secondary" style="color:var(--accent-green)" onclick="setPay('Нал')">💵 Наличные</button>
                <button class="btn-action secondary" style="color:var(--primary)" onclick="setPay('Перевод')">📱 Перевод</button>
                <button class="btn-action secondary" style="color:#f59e0b" onclick="setPay('Терминал')">💳 Терминал</button>
                <button class="btn-action secondary" style="color:var(--accent-red)" onclick="setPay('Долг')">📝 В долг</button>
            </div>
        </div>
    </div>

    <!-- МОДАЛКА СКИДКИ -->
    <div class="overlay" id="modalDiscount">
        <div class="modal">
            <div class="modal-title">Скидка на заказ <div class="btn-icon" style="width:32px; height:32px;" onclick="closeModal('modalDiscount')">✕</div></div>
            <div class="preset-weights" style="grid-template-columns: repeat(3, 1fr);">
                <div class="preset-btn" onclick="setDiscount(0)">0%</div>
                <div class="preset-btn" onclick="setDiscount(5)">5%</div>
                <div class="preset-btn" onclick="setDiscount(10)">10%</div>
                <div class="preset-btn" onclick="setDiscount(15)">15%</div>
                <div class="preset-btn" onclick="setDiscount(20)">20%</div>
                <div class="preset-btn" onclick="setDiscount(25)">25%</div>
            </div>
        </div>
    </div>

    <!-- МОДАЛКА ОТЧЕТА -->
    <div class="overlay" id="modalReport">
        <div class="modal" style="max-width: 420px;">
            <div class="modal-title">Итоговый отчет <div class="btn-icon" style="width:32px; height:32px;" onclick="closeModal('modalReport')">✕</div></div>
            <div class="report-box" id="reportContent"></div>
            <div class="modal-btns">
                <button class="btn-action primary" onclick="copyReport()">📋 Скопировать отчет</button>
            </div>
        </div>
    </div>

    <!-- МОДАЛКА НАСТРОЕК -->
    <div class="overlay" id="modalSettings">
        <div class="modal">
            <div class="modal-title">Настройки смены <div class="btn-icon" style="width:32px; height:32px;" onclick="closeModal('modalSettings')">✕</div></div>
            <div style="margin-bottom: 10px;">
                <label style="font-size:11px; font-weight:700; color:var(--text-muted);">ДАТА СМЕНЫ</label>
                <input type="text" class="input-box" id="shiftDate" style="margin-top:4px;" oninput="saveData()">
            </div>
            <div style="margin-bottom: 16px;">
                <label style="font-size:11px; font-weight:700; color:var(--text-muted);">КАССА НА СТАРТЕ</label>
                <input type="text" class="input-box" id="shiftCash" style="margin-top:4px;" oninput="saveData()">
            </div>
            <button class="btn-action secondary" style="width:100%; color:var(--accent-red); border-color:rgba(239,68,68,0.3);" onclick="resetAllData()">🚨 Сбросить смену</button>
        </div>
    </div>

    <script>
        let catalog = [
            { id: 1, name: "Клубника ШК", icon: "🍓", price: 900, type: "piece" },
            { id: 2, name: "Ананас ШК", icon: "🍍", price: 1200, type: "piece" },
            { id: 3, name: "Роза", icon: "🌹", price: 250, type: "piece" },
            { id: 4, name: "Клубника (кг)", icon: "⚖️", price: 600, type: "weight" },
            { id: 5, name: "Голубика (кг)", icon: "🫐", price: 1500, type: "weight" },
            { id: 6, name: "Доставка", icon: "🚗", price: 0, type: "delivery" }
        ];

        let state = {
            theme: 'light',
            shiftDate: '',
            shiftCash: '10.000',
            activeOrder: 0,
            orders: [
                { id: 1, note: '', items: [], pay: 'Нал', discount: 0 }
            ]
        };

        let activeProductForModal = null;

        function init() {
            const saved = localStorage.getItem('aura_pos_state');
            if (saved) {
                try { state = JSON.parse(saved); } catch(e) {}
            } else {
                state.shiftDate = getAutoDate();
            }
            applyTheme();
            document.getElementById('shiftDate').value = state.shiftDate;
            document.getElementById('shiftCash').value = state.shiftCash;
            renderOrdersBar();
            renderCatalog();
            renderActiveOrder();
        }

        function getAutoDate() {
            const d = new Date(), t = new Date(d); t.setDate(d.getDate() + 1);
            const f = x => String(x.getDate()).padStart(2,'0') + '.' + String(x.getMonth()+1).padStart(2,'0');
            return `${f(d)}-${f(t)}`;
        }

        function saveData() {
            state.shiftDate = document.getElementById('shiftDate').value;
            state.shiftCash = document.getElementById('shiftCash').value;
            localStorage.setItem('aura_pos_state', JSON.stringify(state));
        }

        function applyTheme() {
            document.body.setAttribute('data-theme', state.theme);
            document.getElementById('themeBtn').innerText = state.theme === 'dark' ? '☀️' : '🌙';
        }

        function toggleTheme() {
            state.theme = state.theme === 'dark' ? 'light' : 'dark';
            applyTheme(); saveData();
        }

        // УПРАВЛЕНИЕ ЗАКАЗАМИ
        function renderOrdersBar() {
            const bar = document.getElementById('ordersBar');
            bar.innerHTML = '';
            state.orders.forEach((ord, idx) => {
                let label = ord.note ? `#${idx+1} (${ord.note})` : `Заказ #${idx+1}`;
                bar.innerHTML += `
                    <div class="order-tab ${idx === state.activeOrder ? 'active' : ''}" onclick="switchOrder(${idx})">
                        ${label} ${state.orders.length > 1 ? `<span onclick="event.stopPropagation(); removeOrder(${idx})" style="opacity:0.6; margin-left:4px;">✕</span>` : ''}
                    </div>
                `;
            });
            bar.innerHTML += `<button class="order-tab order-tab-add" onclick="addNewOrder()">+ Заказ</button>`;
        }

        function addNewOrder() {
            state.orders.push({ id: Date.now(), note: '', items: [], pay: 'Нал', discount: 0 });
            state.activeOrder = state.orders.length - 1;
            saveData(); renderOrdersBar(); renderActiveOrder();
        }

        function switchOrder(idx) {
            state.activeOrder = idx;
            renderOrdersBar(); renderActiveOrder();
        }

        function removeOrder(idx) {
            if(state.orders.length <= 1) return;
            state.orders.splice(idx, 1);
            if(state.activeOrder >= state.orders.length) state.activeOrder = state.orders.length - 1;
            saveData(); renderOrdersBar(); renderActiveOrder();
        }

        function getCurOrder() { return state.orders[state.activeOrder]; }

        function updateClientNote() {
            getCurOrder().note = document.getElementById('clientNoteInput').value;
            saveData(); renderOrdersBar();
        }

        // КАТАЛОГ И ДОБАВЛЕНИЕ
        function renderCatalog() {
            const grid = document.getElementById('catalogGrid');
            grid.innerHTML = '';
            catalog.forEach(item => {
                let priceSub = item.type === 'delivery' ? 'Ввод ₽' : (item.type === 'weight' ? `${item.price}₽/кг` : `${item.price}₽`);
                grid.innerHTML += `
                    <div class="product-tile" onclick="handleCatalogClick(${item.id})">
                        <div class="icon">${item.icon}</div>
                        <div class="name">${item.name}</div>
                        <div class="price">${priceSub}</div>
                    </div>
                `;
            });
        }

        function handleCatalogClick(id) {
            const item = catalog.find(x => x.id === id);
            if(!item) return;
            const ord = getCurOrder();

            if (item.type === 'piece') {
                let existing = ord.items.find(i => i.catalogId === item.id && i.type === 'piece');
                if (existing) {
                    existing.qty += 1;
                    existing.sum = existing.qty * existing.price;
                } else {
                    ord.items.push({ uid: Date.now() + Math.random(), catalogId: item.id, icon: item.icon, name: item.name, qty: 1, unit: 'шт', price: item.price, sum: item.price, type: 'piece' });
                }
                saveData(); renderActiveOrder();
            } else {
                activeProductForModal = item;
                document.getElementById('weightModalTitle').innerText = item.type === 'weight' ? `Вес: ${item.name}` : `Сумма доставки`;
                document.getElementById('weightInput').value = '';
                openModal('modalWeight');
                setTimeout(() => document.getElementById('weightInput').focus(), 100);
            }
        }

        function selectWeightPreset(grams) {
            document.getElementById('weightInput').value = grams;
        }

        function confirmWeightItem() {
            const val = parseInt(document.getElementById('weightInput').value) || 0;
            if(val <= 0 || !activeProductForModal) return;
            const ord = getCurOrder();

            if (activeProductForModal.type === 'weight') {
                let sum = Math.round((val / 1000) * activeProductForModal.price);
                ord.items.push({ uid: Date.now() + Math.random(), catalogId: activeProductForModal.id, icon: activeProductForModal.icon, name: activeProductForModal.name, qty: val, unit: 'г', price: activeProductForModal.price, sum: sum, type: 'weight' });
            } else if (activeProductForModal.type === 'delivery') {
                ord.items.push({ uid: Date.now() + Math.random(), catalogId: activeProductForModal.id, icon: activeProductForModal.icon, name: activeProductForModal.name, qty: 1, unit: '', price: val, sum: val, type: 'delivery' });
            }

            saveData(); renderActiveOrder(); closeModal('modalWeight');
        }

        function changeQty(uid, delta) {
            const ord = getCurOrder();
            let idx = ord.items.findIndex(i => i.uid === uid);
            if(idx === -1) return;
            let item = ord.items[idx];

            if(item.type === 'piece') {
                item.qty += delta;
                if(item.qty <= 0) ord.items.splice(idx, 1);
                else item.sum = item.qty * item.price;
            } else {
                ord.items.splice(idx, 1);
            }
            saveData(); renderActiveOrder();
        }

        function renderActiveOrder() {
            const ord = getCurOrder();
            document.getElementById('clientNoteInput').value = ord.note || '';
            document.getElementById('payBadge').innerText = `💵 ${ord.pay}`;
            document.getElementById('discountLabel').innerText = `${ord.discount}%`;

            const list = document.getElementById('cartList');
            list.innerHTML = '';
            let rawSum = 0;

            if(!ord.items || ord.items.length === 0) {
                list.innerHTML = `<div style="text-align:center; padding:50px 0; color:var(--text-muted); font-size:13px;">Выберите товар снизу 👇</div>`;
            } else {
                ord.items.forEach(it => {
                    rawSum += it.sum;
                    let controls = it.type === 'piece' ? `
                        <button class="mini-btn ${it.qty === 1 ? 'del' : ''}" onclick="changeQty(${it.uid}, -1)">${it.qty === 1 ? '✕' : '-'}</button>
                        <span style="font-size:13px; font-weight:800; min-width:28px; text-align:center;">${it.qty}</span>
                        <button class="mini-btn" onclick="changeQty(${it.uid}, 1)">+</button>
                    ` : `
                        <span style="font-size:12px; font-weight:700; margin-right:6px;">${it.qty}${it.unit}</span>
                        <button class="mini-btn del" onclick="changeQty(${it.uid}, -1)">✕</button>
                    `;

                    list.innerHTML += `
                        <div class="cart-item">
                            <div class="cart-item-info">
                                <h5>${it.icon} ${it.name}</h5>
                                <span>${it.sum.toLocaleString('ru-RU')} ₽</span>
                            </div>
                            <div class="cart-item-controls">${controls}</div>
                        </div>
                    `;
                });
            }

            let finalSum = Math.round(rawSum * (1 - ord.discount / 100));
            document.getElementById('totalSum').innerText = `${finalSum.toLocaleString('ru-RU')} ₽`;
        }

        // МОДАЛКИ И УПРАВЛЕНИЕ
        function openPayModal() { openModal('modalPay'); }
        function setPay(method) { getCurOrder().pay = method; saveData(); renderActiveOrder(); closeModal('modalPay'); }

        function openDiscountModal() { openModal('modalDiscount'); }
        function setDiscount(val) { getCurOrder().discount = val; saveData(); renderActiveOrder(); closeModal('modalDiscount'); }

        function openModal(id) { document.getElementById(id).style.display = 'flex'; }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }

        function openSettings() { openModal('modalSettings'); }

        function resetAllData() {
            if(confirm('🚨 Сбросить смену и все заказы?')) {
                state.orders = [{ id: Date.now(), note: '', items: [], pay: 'Нал', discount: 0 }];
                state.activeOrder = 0;
                saveData(); renderOrdersBar(); renderActiveOrder(); closeModal('modalSettings');
            }
        }

        // ОТЧЕТЫ
        function generateReport() {
            let txt = `🍓 ОТЧЕТ ПО СМЕНЕ (AURA POS)\n📅 Дата: ${state.shiftDate}\n💵 Касса на старте: ${state.shiftCash}\n`;
            txt += `────────────────────\n\n`;
            
            let totalCash = 0, totalCard = 0;

            state.orders.forEach((ord, idx) => {
                if(!ord.items || ord.items.length === 0) return;
                let title = ord.note ? `Заказ #${idx+1} (${ord.note})` : `Заказ #${idx+1}`;
                txt += `👤 ${title}\n`;
                
                let rawSum = 0;
                ord.items.forEach(it => {
                    txt += `  • ${it.name} — ${it.qty} ${it.unit} = ${it.sum.toLocaleString('ru-RU')} ₽\n`;
                    rawSum += it.sum;
                });
                let final = Math.round(rawSum * (1 - ord.discount / 100));
                if(ord.discount > 0) txt += `  🏷️ Скидка: ${ord.discount}%\n`;
                txt += `  💳 ${ord.pay}: ${final.toLocaleString('ru-RU')} ₽\n\n`;

                if(ord.pay === 'Нал') totalCash += final;
                else totalCard += final;
            });

            txt += `────────────────────\n`;
            txt += `📊 ИТОГО:\n`;
            txt += `💵 Наличные: ${totalCash.toLocaleString('ru-RU')} ₽\n`;
            txt += `📱 Безнал / Перевод: ${totalCard.toLocaleString('ru-RU')} ₽\n`;
            txt += `💰 Выручка смены: ${(totalCash + totalCard).toLocaleString('ru-RU')} ₽`;
            return txt;
        }

        function openReport() {
            document.getElementById('reportContent').innerText = generateReport();
            openModal('modalReport');
        }

        function copyReport() {
            navigator.clipboard.writeText(generateReport()).then(()=> alert('✅ Отчет скопирован!'));
        }

        window.onload = init;
    </script>
</body>
</html>
