<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Strawberry POS & Report</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Касса">
    <link rel="apple-touch-icon" href="https://img.icons8.com/emoji/192/strawberry-emoji.png">

    <style>
        :root {
            --bg: #09090b;
            --card: #18181b;
            --card-sub: #27272a;
            --border: #3f3f46;
            --accent-green: #22c55e;
            --accent-blue: #3b82f6;
            --text-main: #f4f4f5;
            --text-sub: #a1a1aa;
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            padding: 12px;
            padding-bottom: 110px;
            padding-top: max(12px, env(safe-area-inset-top));
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }

        .header h1 {
            font-size: 22px;
            font-weight: 800;
            background: linear-gradient(90deg, #22c55e, #3b82f6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .btn-sm {
            background: var(--card-sub);
            color: var(--text-sub);
            border: 1px solid var(--border);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 14px;
            margin-bottom: 12px;
        }

        .row { display: flex; gap: 8px; }
        .row > div { flex: 1; }

        label {
            display: block;
            font-size: 11px;
            font-weight: 700;
            color: var(--text-sub);
            margin-bottom: 6px;
            text-transform: uppercase;
        }

        input, textarea, select {
            width: 100%;
            background: #000;
            border: 1px solid var(--border);
            color: #fff;
            padding: 10px 12px;
            border-radius: 10px;
            font-size: 14px;
            outline: none;
        }

        input:focus, textarea:focus { border-color: var(--accent-blue); }

        /* КАТАЛОГ ТОВАРОВ */
        .catalog-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .products-scroll {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 8px;
            scrollbar-width: none;
        }
        .products-scroll::-webkit-scrollbar { display: none; }

        .product-card {
            background: var(--card-sub);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 10px;
            min-width: 120px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 6px;
            cursor: pointer;
            transition: transform 0.1s;
        }

        .product-card:active { transform: scale(0.95); }
        .product-name { font-size: 13px; font-weight: 600; color: #fff; }
        .product-price { font-size: 12px; color: var(--accent-green); font-weight: 700; }

        /* СПИСОК КЛИЕНТОВ */
        .client-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 14px;
            margin-bottom: 12px;
        }

        .client-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .segmented {
            display: flex;
            background: #000;
            padding: 3px;
            border-radius: 10px;
            border: 1px solid var(--border);
            margin-bottom: 8px;
        }

        .seg-btn {
            flex: 1;
            text-align: center;
            padding: 7px 0;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-sub);
            border-radius: 8px;
            cursor: pointer;
        }

        .seg-btn.active {
            background: var(--card-sub);
            color: #fff;
        }

        .btn-add-client {
            background: var(--accent-blue);
            color: #fff;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-weight: 700;
            width: 100%;
            margin-bottom: 12px;
        }

        .preview {
            background: #000;
            color: var(--accent-green);
            font-family: monospace;
            padding: 10px;
            border-radius: 10px;
            font-size: 12px;
            white-space: pre-wrap;
            max-height: 140px;
            overflow-y: auto;
            border: 1px solid var(--border);
        }

        .bottom-bar {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            background: rgba(9, 9, 11, 0.9);
            backdrop-filter: blur(15px);
            border-top: 1px solid var(--border);
            padding: 12px 16px max(12px, env(safe-area-inset-bottom)) 16px;
            z-index: 100;
        }

        .btn-copy {
            background: var(--accent-green);
            color: #fff;
            border: none;
            padding: 14px;
            border-radius: 14px;
            font-weight: 700;
            font-size: 15px;
            width: 100%;
        }

        /* МОДАЛЬНЫЕ ОКНА */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(6px);
            z-index: 200;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-body {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 20px;
            width: 100%;
            max-width: 340px;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>🍓 Strawberry POS</h1>
        <button class="btn-sm" onclick="resetShift()">Сброс смены</button>
    </div>

    <!-- ДАТА И КАССА -->
    <div class="card">
        <div class="row">
            <div>
                <label>Даты смены</label>
                <input type="text" id="shiftDate" oninput="saveData()">
            </div>
            <div>
                <label>Касса</label>
                <input type="text" id="cashRegister" value="10.000" oninput="saveData()">
            </div>
        </div>
    </div>

    <!-- КАТАЛОГ ТОВАРОВ C ЦЕНАМИ -->
    <div style="margin-bottom: 12px;">
        <div class="catalog-header">
            <label style="padding-left:4px;">Выбрать товар в заказ</label>
            <button class="btn-sm" style="color:var(--accent-blue); padding:3px 10px;" onclick="openAddProductModal()">+ Настроить товары</button>
        </div>
        <div class="products-scroll" id="productsCatalog"></div>
    </div>

    <!-- КЛИЕНТЫ -->
    <div id="clientsContainer"></div>
    <button class="btn-add-client" onclick="addClient()">+ Добавить клиента</button>

    <!-- РАСХОД И КЛУБНИКА -->
    <div class="card">
        <div class="row" style="margin-bottom: 10px;">
            <div>
                <label>Расход</label>
                <input type="text" id="expenses" placeholder="не было" oninput="saveData()">
            </div>
            <div style="flex:0.35; display:flex; align-items:flex-end;">
                <button class="btn-sm" style="width:100%; padding:11px; border-radius:10px;" onclick="document.getElementById('expenses').value='не было'; saveData();">Не было</button>
            </div>
        </div>
        <label>По клубникам (Заметки)</label>
        <input type="text" id="strawberries" placeholder="продаж не было" oninput="saveData()">
    </div>

    <!-- ПРЕДПРОСМОТР -->
    <div class="card">
        <label>Итоговый отчёт</label>
        <div class="preview" id="reportPreview"></div>
    </div>

    <!-- ФИКСИРОВАННАЯ КНОПКА СНИЗУ -->
    <div class="bottom-bar">
        <button class="btn-copy" onclick="copyReport()">📋 Скопировать отчёт</button>
    </div>

    <!-- МОДАЛЬНОЕ ОКНО ДОБАВЛЕНИЯ ТОВАРА КЛИЕНТУ -->
    <div class="modal" id="addItemModal">
        <div class="modal-body">
            <h3 id="modalProductName" style="margin-bottom: 10px;"></h3>
            
            <div id="pieceInputs">
                <label>Количество (шт)</label>
                <input type="number" id="pieceCount" value="1" min="1">
            </div>

            <div id="weightInputs" style="display:none;">
                <label>Вес (в граммах)</label>
                <input type="number" id="weightGram" placeholder="например, 290" oninput="calcWeightPrice()">
                <div style="margin-top:8px; font-size:13px; color:var(--accent-green); font-weight:700;" id="calcResultText">Итого: 0 ₽</div>
            </div>

            <button class="btn-add-client" style="margin-top:16px; margin-bottom:0;" onclick="confirmAddItemToClient()">Добавить в чек</button>
            <button class="btn-sm" style="width:100%; margin-top:8px;" onclick="closeModal('addItemModal')">Отмена</button>
        </div>
    </div>

    <!-- МОДАЛЬНОЕ ОКНО СОЗДАНИЯ/ РЕДАКТИРОВАНИЯ ТОВАРА В БАЗЕ -->
    <div class="modal" id="newProductModal">
        <div class="modal-body">
            <h3 style="margin-bottom: 12px;">Добавить товар в каталог</h3>
            <label>Название товара</label>
            <input type="text" id="newProdName" placeholder="например, Клубника весовая" style="margin-bottom:10px;">
            
            <label>Тип товара</label>
            <select id="newProdType" style="margin-bottom:10px;">
                <option value="piece">Штучный (шт)</option>
                <option value="weight">Весовой (цена за кг)</option>
            </select>

            <label>Цена (₽)</label>
            <input type="number" id="newProdPrice" placeholder="например, 900" style="margin-bottom:14px;">

            <button class="btn-add-client" style="margin-bottom:0;" onclick="saveNewProductToCatalog()">Сохранить товар</button>
            <button class="btn-sm" style="width:100%; margin-top:8px;" onclick="closeModal('newProductModal')">Закрыть</button>
        </div>
    </div>

    <script>
        // Стандартный каталог позиций с ценами
        let catalog = [
            { name: "Ст.клубника в шк", price: 900, type: "piece" },
            { name: "Ст.ананас", price: 1200, type: "piece" },
            { name: "Ст.черешня", price: 1200, type: "piece" },
            { name: "Роза красная", price: 250, type: "piece" },
            { name: "Куст.розы", price: 300, type: "piece" },
            { name: "Клубника весовая", price: 500, type: "weight" }, // цена за 1 кг (1000г)
            { name: "Доставка", price: 350, type: "piece" }
        ];

        let clients = [];
        let activeProduct = null;

        function initDate() {
            const today = new Date();
            const tomorrow = new Date(today);
            tomorrow.setDate(today.getDate() + 1);
            const fmt = (d) => String(d.getDate()).padStart(2, '0') + '.' + String(d.getMonth() + 1).padStart(2, '0');
            return `${fmt(today)}-${fmt(tomorrow)}`;
        }

        function renderCatalog() {
            const container = document.getElementById('productsCatalog');
            container.innerHTML = '';

            catalog.forEach(item => {
                const card = document.createElement('div');
                card.className = 'product-card';
                card.onclick = () => openAddItemModal(item);
                
                const unit = item.type === 'weight' ? '₽/кг' : '₽';
                card.innerHTML = `
                    <div class="product-name">${item.name}</div>
                    <div class="product-price">${item.price} ${unit}</div>
                `;
                container.appendChild(card);
            });
        }

        function openAddItemModal(item) {
            activeProduct = item;
            document.getElementById('modalProductName').innerText = item.name;
            
            if (item.type === 'piece') {
                document.getElementById('pieceInputs').style.display = 'block';
                document.getElementById('weightInputs').style.display = 'none';
                document.getElementById('pieceCount').value = 1;
            } else {
                document.getElementById('pieceInputs').style.display = 'none';
                document.getElementById('weightInputs').style.display = 'block';
                document.getElementById('weightGram').value = '';
                document.getElementById('calcResultText').innerText = `Цена: ${item.price} ₽/кг`;
            }
            
            document.getElementById('addItemModal').style.display = 'flex';
        }

        function calcWeightPrice() {
            if (!activeProduct || activeProduct.type !== 'weight') return;
            const grams = parseFloat(document.getElementById('weightGram').value) || 0;
            const totalPrice = Math.round((grams / 1000) * activeProduct.price);
            document.getElementById('calcResultText').innerText = `Итого: ${totalPrice} ₽ (${grams}гр)`;
        }

        function confirmAddItemToClient() {
            if (clients.length === 0) addClient(false);
            const lastIdx = clients.length - 1;
            let itemText = '';
            let itemSum = 0;

            if (activeProduct.type === 'piece') {
                const count = parseInt(document.getElementById('pieceCount').value) || 1;
                itemText = `${activeProduct.name} - ${count}`;
                itemSum = activeProduct.price * count;
            } else {
                const grams = parseFloat(document.getElementById('weightGram').value) || 0;
                itemSum = Math.round((grams / 1000) * activeProduct.price);
                itemText = `${activeProduct.name} - ${grams}гр`;
            }

            // Добавляем текст позиции
            if (clients[lastIdx].items) {
                clients[lastIdx].items += '\n' + itemText;
            } else {
                clients[lastIdx].items = itemText;
            }

            // Автоматически суммируем стоимость заказа у клиента
            const currentAmount = parseFloat(clients[lastIdx].amount) || 0;
            clients[lastIdx].amount = currentAmount + itemSum;

            closeModal('addItemModal');
            renderClients();
            saveData();
        }

        function openAddProductModal() {
            document.getElementById('newProductModal').style.display = 'flex';
        }

        function saveNewProductToCatalog() {
            const name = document.getElementById('newProdName').value.trim();
            const type = document.getElementById('newProdType').value;
            const price = parseFloat(document.getElementById('newProdPrice').value) || 0;

            if (name && price > 0) {
                catalog.push({ name, price, type });
                renderCatalog();
                saveData();
                closeModal('newProductModal');
                document.getElementById('newProdName').value = '';
                document.getElementById('newProdPrice').value = '';
            }
        }

        function closeModal(id) {
            document.getElementById(id).style.display = 'none';
        }

        function loadData() {
            const saved = localStorage.getItem('pos_strawberry_data');
            if (saved) {
                const data = JSON.parse(saved);
                document.getElementById('shiftDate').value = data.shiftDate || initDate();
                document.getElementById('cashRegister').value = data.cashRegister || '10.000';
                document.getElementById('expenses').value = data.expenses || '';
                document.getElementById('strawberries').value = data.strawberries || 'продаж не было';
                clients = data.clients || [];
                if (data.catalog) catalog = data.catalog;
            } else {
                document.getElementById('shiftDate').value = initDate();
                document.getElementById('strawberries').value = 'продаж не было';
            }

            if (clients.length === 0) addClient(false);
            else renderClients();

            renderCatalog();
            updateReport();
        }

        function saveData() {
            const data = {
                shiftDate: document.getElementById('shiftDate').value,
                cashRegister: document.getElementById('cashRegister').value,
                expenses: document.getElementById('expenses').value,
                strawberries: document.getElementById('strawberries').value,
                clients: clients,
                catalog: catalog
            };
            localStorage.setItem('pos_strawberry_data', JSON.stringify(data));
            updateReport();
        }

        function addClient(shouldSave = true) {
            clients.push({ name: '', items: '', payType: 'Нал', amount: '', time: '' });
            renderClients();
            if (shouldSave) saveData();
        }

        function removeClient(index) {
            clients.splice(index, 1);
            if (clients.length === 0) addClient(false);
            renderClients();
            saveData();
        }

        function setPayType(index, type) {
            clients[index].payType = type;
            renderClients();
            saveData();
        }

        function setTimeNow(index) {
            const now = new Date();
            clients[index].time = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            renderClients();
            saveData();
        }

        function renderClients() {
            const container = document.getElementById('clientsContainer');
            container.innerHTML = '';

            clients.forEach((c, i) => {
                const card = document.createElement('div');
                card.className = 'client-card';
                card.innerHTML = `
                    <div class="client-header">
                        <strong>Клиент ${i + 1}</strong>
                        ${clients.length > 1 ? `<span style="color:var(--danger); font-size:12px; font-weight:600; cursor:pointer;" onclick="removeClient(${i})">Удалить</span>` : ''}
                    </div>
                    <input type="text" placeholder="Примечание (напр., Муса Вип)" value="${c.name}" style="margin-bottom:8px;" oninput="clients[${i}].name = this.value; saveData();">
                    
                    <textarea placeholder="Состав заказа" rows="2" style="margin-bottom:8px;" oninput="clients[${i}].items = this.value; saveData();">${c.items}</textarea>

                    <div class="segmented">
                        <div class="seg-btn ${c.payType==='Нал'?'active':''}" onclick="setPayType(${i}, 'Нал')">Нал</div>
                        <div class="seg-btn ${c.payType==='Перевод'?'active':''}" onclick="setPayType(${i}, 'Перевод')">Перевод</div>
                        <div class="seg-btn ${c.payType==='Терминал'?'active':''}" onclick="setPayType(${i}, 'Терминал')">Терминал</div>
                        <div class="seg-btn ${c.payType==='Долг'?'active':''}" onclick="setPayType(${i}, 'Долг')">Долг</div>
                    </div>

                    <div class="row">
                        <input type="number" placeholder="Сумма (₽)" value="${c.amount}" oninput="clients[${i}].amount = this.value; saveData();">
                        <input type="text" placeholder="Время (01:27)" value="${c.time}" oninput="clients[${i}].time = this.value; saveData();">
                        <button class="btn-sm" style="background:#27272a; color:#fff;" onclick="setTimeNow(${i})">🕒</button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function generateReportText() {
            const shiftDate = document.getElementById('shiftDate').value;
            const cashRegister = document.getElementById('cashRegister').value;
            const expenses = document.getElementById('expenses').value.trim();
            const strawberries = document.getElementById('strawberries').value.trim();

            let report = `${shiftDate}\n`;
            if (cashRegister) report += `Касса: ${cashRegister}\n\n`;

            let totalCash = 0;
            let totalTransfer = 0;

            clients.forEach((c, idx) => {
                let title = `Клиент: ${idx + 1}`;
                if (c.name.trim()) title += ` ${c.name.trim()}`;
                
                report += `${title}\n`;
                if (c.items.trim()) report += `${c.items.trim()}\n`;

                let payLine = `(${c.payType}`;
                if (c.amount) {
                    const amt = parseFloat(c.amount) || 0;
                    payLine += ` ${c.amount}`;
                    if (c.payType === 'Нал') totalCash += amt;
                    if (c.payType === 'Перевод' || c.payType === 'Терминал') totalTransfer += amt;
                }
                if (c.time.trim()) payLine += ` ${c.time.trim()}`;
                payLine += `)\n\n`;
                
                report += payLine;
            });

            report += `Расход: ${expenses ? expenses : 'не было'}\n\n`;
            report += `Нал: ${totalCash > 0 ? totalCash.toLocaleString('ru-RU') : '0'}\n`;
            report += `Перевод: ${totalTransfer > 0 ? totalTransfer.toLocaleString('ru-RU') : '0'}\n\n`;
            report += `По клубникам: ${strawberries ? strawberries : 'продаж не было'}`;

            return report;
        }

        function updateReport() {
            document.getElementById('reportPreview').innerText = generateReportText();
        }

        function copyReport() {
            const text = generateReportText();
            navigator.clipboard.writeText(text).then(() => {
                alert('✅ Отчёт скопирован!');
            }).catch(() => {
                alert('Скопируйте текст из предпросмотра вручную.');
            });
        }

        function resetShift() {
            if (confirm('Очистить данные смены и начать новую?')) {
                localStorage.removeItem('pos_strawberry_data');
                clients = [];
                document.getElementById('expenses').value = '';
                document.getElementById('strawberries').value = 'продаж не было';
                loadData();
            }
        }

        loadData();
    </script>
</body>
</html>
