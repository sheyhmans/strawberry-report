<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Отчет Смены 🍓</title>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --card-inner: #0f172a;
            --accent: #10b981;
            --accent-blue: #3b82f6;
            --text: #f8fafc;
            --subtext: #94a3b8;
            --border: #334155;
            --danger: #ef4444;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
        body { background: var(--bg); color: var(--text); padding: 10px; padding-bottom: 90px; }

        /* Шапка */
        .top-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .top-header h1 { font-size: 18px; color: var(--accent); }
        .btn-reset { background: #334155; color: #94a3b8; border: none; padding: 6px 12px; border-radius: 6px; font-size: 12px; }

        /* Блоки ввода */
        .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 10px; margin-bottom: 10px; }
        .row { display: flex; gap: 8px; }
        .row > div { flex: 1; }
        label { display: block; font-size: 11px; color: var(--subtext); margin-bottom: 3px; }
        input, textarea { width: 100%; background: var(--card-inner); border: 1px solid var(--border); color: #fff; padding: 8px; border-radius: 6px; font-size: 14px; }
        
        /* Быстрый каталог товаров */
        .quick-catalog { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 8px; }
        .chip { background: #334155; color: #e2e8f0; border: none; padding: 5px 9px; border-radius: 6px; font-size: 12px; cursor: pointer; }
        .chip:active { background: var(--accent-blue); }

        /* Карточка клиента */
        .client-card { background: #182232; border: 1px solid #2d3d54; border-radius: 8px; padding: 10px; margin-bottom: 10px; }
        .client-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
        .client-header strong { font-size: 14px; color: var(--accent-blue); }
        
        /* Кнопки типа оплаты */
        .pay-type-group { display: flex; gap: 4px; margin-bottom: 6px; }
        .pay-btn { flex: 1; background: #0f172a; border: 1px solid var(--border); color: var(--subtext); padding: 6px; border-radius: 6px; font-size: 12px; text-align: center; cursor: pointer; }
        .pay-btn.active { background: var(--accent-blue); color: #fff; border-color: var(--accent-blue); font-weight: bold; }

        .btn-time { background: #334155; color: #fff; border: none; padding: 8px 10px; border-radius: 6px; font-size: 12px; white-space: nowrap; }

        .btn-add-client { background: var(--accent-blue); color: #fff; border: none; padding: 10px; border-radius: 8px; font-weight: bold; width: 100%; margin-bottom: 10px; }
        .btn-delete { background: var(--danger); color: #fff; border: none; padding: 4px 8px; border-radius: 4px; font-size: 11px; }

        .preview { background: #000; color: #00ff66; font-family: monospace; padding: 8px; border-radius: 6px; font-size: 12px; white-space: pre-wrap; max-height: 150px; overflow-y: auto; }

        /* Нижняя фиксированная панель */
        .bottom-bar { position: fixed; bottom: 0; left: 0; right: 0; background: var(--card); border-top: 1px solid var(--border); padding: 10px; z-index: 100; }
        .btn-copy { background: var(--accent); color: #fff; border: none; padding: 12px; border-radius: 8px; font-weight: bold; font-size: 16px; width: 100%; display: flex; justify-content: center; align-items: center; gap: 8px; }
    </style>
</head>
<body>

    <div class="top-header">
        <h1>🍓 Strawberry Report</h1>
        <button class="btn-reset" onclick="resetShift()">🔄 Сброс смены</button>
    </div>

    <div class="card">
        <div class="row">
            <div>
                <label>Даты смены</label>
                <input type="text" id="shiftDate" oninput="saveData()">
            </div>
            <div>
                <label>Касса (на начало)</label>
                <input type="text" id="cashRegister" value="10.000" oninput="saveData()">
            </div>
        </div>
    </div>

    <div class="card">
        <label>Быстро добавить товар текущему клиенту:</label>
        <div class="quick-catalog">
            <button class="chip" onclick="quickAddItem('Ст.клубника в шк - 1')">+ Клубника 1</button>
            <button class="chip" onclick="quickAddItem('Ст.клубника в шк - 2')">+ Клубника 2</button>
            <button class="chip" onclick="quickAddItem('Ст.ананас - 1')">+ Ананас</button>
            <button class="chip" onclick="quickAddItem('Ст.черешня - 1')">+ Черешня</button>
            <button class="chip" onclick="quickAddItem('Роза красная - 1')">+ Роза красн</button>
            <button class="chip" onclick="quickAddItem('Куст.розы - 5')">+ Куст. розы</button>
            <button class="chip" onclick="quickAddItem('Доставка 350')">+ Доставка 350</button>
        </div>
    </div>

    <div id="clientsContainer"></div>
    <button class="btn-add-client" onclick="addClient()">+ Следующий клиент</button>

    <div class="card">
        <div class="row" style="margin-bottom: 8px;">
            <div>
                <label>Расход</label>
                <input type="text" id="expenses" placeholder="не было" oninput="saveData()">
            </div>
            <div style="flex:0.4; display:flex; align-items:flex-end;">
                <button class="chip" style="width:100%; padding:9px;" onclick="document.getElementById('expenses').value='не было'; saveData();">Не было</button>
            </div>
        </div>
        <label>По клубникам</label>
        <input type="text" id="strawberries" placeholder="продаж не было" oninput="saveData()">
    </div>

    <div class="card">
        <label>Предпросмотр сообщения:</label>
        <div class="preview" id="reportPreview"></div>
    </div>

    <div class="bottom-bar">
        <button class="btn-copy" onclick="copyReport()">
            📋 Скопировать отчет
        </button>
    </div>

    <script>
        let clients = [];

        function initDate() {
            const today = new Date();
            const tomorrow = new Date(today);
            tomorrow.setDate(today.getDate() + 1);
            const fmt = (d) => String(d.getDate()).padStart(2, '0') + '.' + String(d.getMonth() + 1).padStart(2, '0');
            return `${fmt(today)}-${fmt(tomorrow)}`;
        }

        function loadData() {
            const saved = localStorage.getItem('strawberry_shift_data');
            if (saved) {
                const data = JSON.parse(saved);
                document.getElementById('shiftDate').value = data.shiftDate || initDate();
                document.getElementById('cashRegister').value = data.cashRegister || '10.000';
                document.getElementById('expenses').value = data.expenses || '';
                document.getElementById('strawberries').value = data.strawberries || 'продаж не было';
                clients = data.clients || [];
            } else {
                document.getElementById('shiftDate').value = initDate();
                document.getElementById('strawberries').value = 'продаж не было';
            }

            if (clients.length === 0) {
                addClient(false);
            } else {
                renderClients();
            }
            updateReport();
        }

        function saveData() {
            const data = {
                shiftDate: document.getElementById('shiftDate').value,
                cashRegister: document.getElementById('cashRegister').value,
                expenses: document.getElementById('expenses').value,
                strawberries: document.getElementById('strawberries').value,
                clients: clients
            };
            localStorage.setItem('strawberry_shift_data', JSON.stringify(data));
            updateReport();
        }

        function addClient(shouldSave = true) {
            clients.push({
                name: '',
                items: '',
                payType: 'Нал',
                amount: '',
                time: ''
            });
            renderClients();
            if (shouldSave) saveData();
        }

        function removeClient(index) {
            clients.splice(index, 1);
            if (clients.length === 0) addClient(false);
            renderClients();
            saveData();
        }

        function setPayType(index, type) {
            clients[index].payType = type;
            renderClients();
            saveData();
        }

        function setTimeNow(index) {
            const now = new Date();
            const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            clients[index].time = timeStr;
            renderClients();
            saveData();
        }

        function quickAddItem(itemText) {
            if (clients.length === 0) addClient(false);
            const lastIdx = clients.length - 1;
            if (clients[lastIdx].items) {
                clients[lastIdx].items += '\n' + itemText;
            } else {
                clients[lastIdx].items = itemText;
            }
            renderClients();
            saveData();
        }

        function renderClients() {
            const container = document.getElementById('clientsContainer');
            container.innerHTML = '';

            clients.forEach((c, i) => {
                const card = document.createElement('div');
                card.className = 'client-card';
                card.innerHTML = `
                    <div class="client-header">
                        <strong>Клиент ${i + 1}</strong>
                        ${clients.length > 1 ? `<button class="btn-delete" onclick="removeClient(${i})">Удалить</button>` : ''}
                    </div>
                    <input type="text" placeholder="Примечание (напр., Муса Вип или пусто)" value="${c.name}" style="margin-bottom:6px;" oninput="clients[${i}].name = this.value; saveData();">
                    
                    <textarea placeholder="Товары" rows="2" style="margin-bottom:6px;" oninput="clients[${i}].items = this.value; saveData();">${c.items}</textarea>

                    <div class="pay-type-group">
                        <div class="pay-btn ${c.payType==='Нал'?'active':''}" onclick="setPayType(${i}, 'Нал')">Нал</div>
                        <div class="pay-btn ${c.payType==='Перевод'?'active':''}" onclick="setPayType(${i}, 'Перевод')">Перевод</div>
                        <div class="pay-btn ${c.payType==='Терминал'?'active':''}" onclick="setPayType(${i}, 'Терминал')">Терминал</div>
                        <div class="pay-btn ${c.payType==='Долг'?'active':''}" onclick="setPayType(${i}, 'Долг')">Долг</div>
                    </div>

                    <div class="row">
                        <input type="number" placeholder="Сумма (₽)" value="${c.amount}" oninput="clients[${i}].amount = this.value; saveData();">
                        <input type="text" placeholder="Время (01:27)" value="${c.time}" oninput="clients[${i}].time = this.value; saveData();">
                        <button class="btn-time" onclick="setTimeNow(${i})">🕒 Сейчас</button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function generateReportText() {
            const shiftDate = document.getElementById('shiftDate').value;
            const cashRegister = document.getElementById('cashRegister').value;
            const expenses = document.getElementById('expenses').value.trim();
            const strawberries = document.getElementById('strawberries').value.trim();

            let report = `${shiftDate}\n`;
            if (cashRegister) report += `Касса: ${cashRegister}\n\n`;

            let totalCash = 0;
            let totalTransfer = 0;

            clients.forEach((c, idx) => {
                let title = `Клиент: ${idx + 1}`;
                if (c.name.trim()) title += ` ${c.name.trim()}`;
                
                report += `${title}\n`;
                if (c.items.trim()) report += `${c.items.trim()}\n`;

                let payLine = `(${c.payType}`;
                if (c.amount) {
                    const amt = parseFloat(c.amount) || 0;
                    payLine += ` ${c.amount}`;
                    if (c.payType === 'Нал') totalCash += amt;
                    if (c.payType === 'Перевод' || c.payType === 'Терминал') totalTransfer += amt;
                }
                if (c.time.trim()) payLine += ` ${c.time.trim()}`;
                payLine += `)\n\n`;
                
                report += payLine;
            });

            report += `Расход: ${expenses ? expenses : 'не было'}\n\n`;
            report += `Нал: ${totalCash > 0 ? totalCash.toLocaleString('ru-RU') : '0'}\n`;
            report += `Перевод: ${totalTransfer > 0 ? totalTransfer.toLocaleString('ru-RU') : '0'}\n\n`;
            report += `По клубникам: ${strawberries ? strawberries : 'продаж не было'}`;

            return report;
        }

        function updateReport() {
            document.getElementById('reportPreview').innerText = generateReportText();
        }

        function copyReport() {
            const text = generateReportText();
            navigator.clipboard.writeText(text).then(() => {
                alert('✅ Отчет скопирован! Вставляйте в чат.');
            }).catch(() => {
                alert('Скопируйте текст из предпросмотра вручную.');
            });
        }

        function resetShift() {
            if (confirm('Очистить данные и начать новую смену?')) {
                localStorage.removeItem('strawberry_shift_data');
                clients = [];
                document.getElementById('expenses').value = '';
                document.getElementById('strawberries').value = 'продаж не было';
                loadData();
            }
        }

        // Запуск при открытии
        loadData();
    </script>
</body>
</html>
