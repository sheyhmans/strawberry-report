<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Strawberry POS</title>

<style>

*{
box-sizing:border-box;
font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Arial,sans-serif;
}


body{
margin:0;
background:#09090b;
color:white;
}


.app{
max-width:430px;
margin:auto;
padding:25px 18px 40px;
}



.header{

display:flex;
align-items:center;
gap:15px;
margin-bottom:25px;

}



.logo{

width:58px;
height:58px;
border-radius:20px;

background:#ff2d55;

display:flex;
align-items:center;
justify-content:center;

font-size:32px;

}



h1{
margin:0;
font-size:25px;
}



.header p{

margin:5px 0 0;
color:#999;

}




.main-card{

background:
linear-gradient(135deg,#ff2d55,#7a1830);

border-radius:28px;

padding:25px;

margin-bottom:18px;

}



.main-card span{

color:#ffd7df;

}



.main-card h2{

font-size:30px;

margin:10px 0;

}



.main-card p{

margin:0;

color:#ffd7df;

}




.start{

width:100%;

height:55px;

border:0;

border-radius:18px;

background:white;

color:#111;

font-size:17px;

font-weight:600;

margin-bottom:25px;

}



.start.active{

background:#30d158;

color:white;

}




.stats{

display:grid;

grid-template-columns:repeat(3,1fr);

gap:10px;

margin-bottom:25px;

}




.stat{

background:#18181b;

border-radius:18px;

padding:15px 8px;

text-align:center;

}



.stat small{

color:#888;

}



.stat b{

display:block;

margin-top:8px;

font-size:20px;

}





.menu{

display:grid;

grid-template-columns:1fr 1fr;

gap:15px;

}




.card{

background:#18181b;

border-radius:22px;

padding:20px;

height:135px;

text-decoration:none;

color:white;

border:1px solid #252525;

}




.card div{

font-size:32px;

}



.card h3{

margin:12px 0 0;

}



.card p{

margin:5px 0;

color:#888;

font-size:13px;

}



footer{

text-align:center;

color:#555;

margin-top:35px;

}



</style>

</head>


<body>


<div class="app">



<div class="header">


<div class="logo">
🍓
</div>


<div>

<h1>Strawberry POS</h1>

<p>Учет ночной смены</p>

</div>


</div>




<div class="main-card">


<span>
Текущая смена
</span>


<h2 id="shiftText">
Не начата
</h2>


<p id="shiftDescription">
Начните смену для учета продаж
</p>


</div>




<button class="start" id="startBtn" onclick="startShift()">

▶ Начать смену

</button>





<div class="stats">


<div class="stat">

<small>Продажи</small>

<b>0 ₽</b>

</div>


<div class="stat">

<small>Клиенты</small>

<b>0</b>

</div>


<div class="stat">

<small>Товары</small>

<b id="productCount">
0
</b>

</div>


</div>





<div class="menu">



<a href="shift.html" class="card">

<div>
🛒
</div>

<h3>
Продажи
</h3>

<p>
Новая покупка
</p>

</a>





<a href="catalog.html" class="card">

<div>
📦
</div>

<h3>
Каталог
</h3>

<p>
Товары
</p>

</a>





<a href="history.html" class="card">

<div>
📋
</div>

<h3>
История
</h3>

<p>
Отчеты
</p>

</a>





<a href="#" class="card">

<div>
⚙️
</div>

<h3>
Настройки
</h3>

<p>
Скоро
</p>

</a>




</div>



<footer>
Strawberry POS
</footer>



</div>



<script>


function startShift(){

localStorage.setItem(
"shiftActive",
"true"
);


localStorage.setItem(
"shiftStart",
new Date().toLocaleString("ru-RU")
);


updateShift();


}



function updateShift(){


let active =
localStorage.getItem("shiftActive");


let text =
document.getElementById("shiftText");


let desc =
document.getElementById("shiftDescription");


let btn =
document.getElementById("startBtn");



if(active==="true"){


text.innerHTML="Смена активна";

desc.innerHTML=
"Можно добавлять продажи";


btn.innerHTML=
"✓ Смена активна";


btn.classList.add("active");


}else{


text.innerHTML="Не начата";

desc.innerHTML=
"Начните смену для учета продаж";


btn.innerHTML=
"▶ Начать смену";


btn.classList.remove("active");


}



}



let products =
JSON.parse(localStorage.getItem("products")) || [];


document.getElementById("productCount").innerHTML =
products.length;



updateShift();



</script>



</body>

</html>
