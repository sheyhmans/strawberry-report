<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Strawberry Studio POS</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Касса Studio">
    <link rel="apple-touch-icon" href="https://img.icons8.com/emoji/192/strawberry-emoji.png">

    <style>
        :root {
            --bg-body: #050507;
            --surface-card: #121216;
            --surface-elevated: #1a1a22;
            --surface-border: #262632;
            --primary: #3b82f6;
            --primary-glow: rgba(59, 130, 246, 0.25);
            --accent-green: #10b981;
            --accent-green-glow: rgba(16, 185, 129, 0.2);
            --accent-danger: #ef4444;
            --text-main: #f3f4f6;
            --text-muted: #8b8f9a;
            --radius-lg: 20px;
            --radius-md: 14px;
            --radius-sm: 10px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            padding: 16px;
            padding-bottom: 140px;
            padding-top: max(16px, env(safe-area-inset-top));
            min-height: 100vh;
        }

        /* Верхняя панель управления */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .header-title {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #ffffff 0%, #8b8f9a 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-actions {
            display: flex;
            gap: 8px;
        }

        .icon-btn {
            background: var(--surface-card);
            border: 1px solid var(--surface-border);
            color: var(--text-main);
            padding: 8px 14px;
            border-radius: var(--radius-sm);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .icon-btn:active { transform: scale(0.95); opacity: 0.8; }

        /* Блок смены */
        .shift-bar {
            background: var(--surface-card);
            border: 1px solid var(--surface-border);
            border-radius: var(--radius-md);
            padding: 12px 16px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }

        .field-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .field-group label {
            font-size: 10px;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        .field-group input {
            background: var(--bg-body);
            border: 1px solid var(--surface-border);
            color: var(--text-main);
            padding: 8px 12px;
            border-radius: var(--radius-sm);
            font-size: 14px;
            font-weight: 600;
            outline: none;
        }
        .field-group input:focus { border-color: var(--primary); }

        /* Раздел: Каталог товаров */
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .section-header h2 {
            font-size: 15px;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .catalog-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 24px;
        }

        .catalog-card {
            background: linear-gradient(145deg, var(--surface-card) 0%, var(--surface-elevated) 100%);
            border: 1px solid var(--surface-border);
            border-radius: var(--radius-md);
            padding: 14px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 85px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 0.15s ease;
        }
        .catalog-card:active {
            transform: scale(0.97);
            border-color: var(--primary);
            box-shadow: 0 0 15px var(--primary-glow);
        }

        .catalog-card-title {
            font-size: 14px;
            font-weight: 600;
            line-height: 1.3;
        }

        .catalog-card-footer {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-top: 10px;
        }

        .catalog-card-price {
            font-size: 15px;
            font-weight: 800;
            color: var(--accent-green);
        }

        .catalog-card-unit {
            font-size: 10px;
            color: var(--text-muted);
            font-weight: 600;
        }

        /* Раздел: Текущий активный чек */
        .cart-section {
            background: var(--surface-card);
            border: 1px solid var(--surface-border);
            border-radius: var(--radius-lg);
            padding: 16px;
            margin-bottom: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        }

        .cart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 12px;
            border-bottom: 1px dashed var(--surface-border);
            margin-bottom: 14px;
        }

        .cart-tabs {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding-bottom: 4px;
            margin-bottom: 14px;
        }

        .cart-tab {
            background: var(--bg-body);
            border: 1px solid var(--surface-border);
            color: var(--text-muted);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            white-space: nowrap;
            cursor: pointer;
        }
        .cart-tab.active {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
            box-shadow: 0 2px 10px var(--primary-glow);
        }

        .cart-items {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 14px;
            min-height: 50px;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--surface-elevated);
            padding: 10px 12px;
            border-radius: var(--radius-sm);
            font-size: 13px;
        }

        .cart-item-name { font-weight: 600; }
        .cart-item-val { color: var(--text-muted); font-size: 12px; }
        .cart-item-price { font-weight: 700; color: var(--accent-green); }

        /* Тип оплаты */
        .pay-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
            margin-bottom: 12px;
        }

        .pay-btn {
            background: var(--bg-body);
            border: 1px solid var(--surface-border);
            color: var(--text-muted);
            padding: 10px 0;
            border-radius: var(--radius-sm);
            font-size: 11px;
            font-weight: 700;
            text-align: center;
            cursor: pointer;
        }
        .pay-btn.active {
            background: rgba(16, 185, 129, 0.15);
            color: var(--accent-green);
            border-color: var(--accent-green);
        }

        /* Доп. инфо по чеку */
        .cart-meta {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        /* Заметки и расходы */
        .notes-card {
            background: var(--surface-card);
            border: 1px solid var(--surface-border);
            border-radius: var(--radius-md);
            padding: 14px;
            margin-bottom: 24px;
        }

        /* Итоговая выплывающая панель */
        .action-bar {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            background: rgba(18, 18, 22, 0.85);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-top: 1px solid var(--surface-border);
            padding: 14px 16px max(14px, env(safe-area-inset-bottom)) 16px;
            display: flex;
            gap: 10px;
            z-index: 100;
        }

        .btn-submit {
            flex: 1;
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: #fff;
            border: none;
            padding: 16px;
            border-radius: var(--radius-md);
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 20px var(--accent-green-glow);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }
        .btn-submit:active { transform: scale(0.98); }

        /* Модальные шторки (Bottom Sheets) */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.75);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            z-index: 200;
            align-items: flex-end;
        }

        .modal-sheet {
            background: #16161c;
            border-top: 1px solid var(--surface-border);
            border-radius: 28px 28px 0 0;
            padding: 20px 20px max(20px, env(safe-area-inset-bottom)) 20px;
            width: 100%;
            max-height: 85vh;
            overflow-y: auto;
            animation: slideUp 0.25s cubic-bezier(0, 0, 0.2, 1);
        }

        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }

        .sheet-pill {
            width: 36px; height: 4px;
            background: var(--surface-border);
            border-radius: 2px;
            margin: 0 auto 16px auto;
        }

        .preset-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin: 14px 0;
        }

        .preset-btn {
            background: var(--surface-elevated);
            border: 1px solid var(--surface-border);
            color: var(--text-main);
            padding: 12px;
            border-radius: var(--radius-sm);
            text-align: center;
            font-weight: 700;
            font-size: 13px;
        }
        .preset-btn:active { background: var(--primary); }

        .report-view {
            background: var(--bg-body);
            border: 1px solid var(--surface-border);
            padding: 14px;
            border-radius: var(--radius-sm);
            font-family: monospace;
            font-size: 12px;
            color: var(--accent-green);
            white-space: pre-wrap;
            margin-bottom: 14px;
        }
    </style>
</head>
<body>

    <!-- Шапка -->
    <div class="header">
        <div class="header-title">🍓 Strawberry POS</div>
        <div class="header-actions">
            <button class="icon-btn" onclick="openCatalogManager()">⚙️ Товар</button>
            <button class="icon-btn" onclick="openReportModal()">📊 Отчёт</button>
        </div>
    </div>

    <!-- Блок смены -->
    <div class="shift-bar">
        <div class="field-group">
            <label>Дата смены</label>
            <input type="text" id="shiftDate" onchange="saveAllData()">
        </div>
        <div class="field-group">
            <label>Касса (₽)</label>
            <input type="text" id="shiftCash" value="10.000" onchange="saveAllData()">
        </div>
    </div>

    <!-- Каталог быстрого выбора -->
    <div class="section-header">
        <h2>Каталог позиций</h2>
        <span style="font-size:11px; color:var(--text-muted);">Нажми для добавления</span>
    </div>
    <div class="catalog-grid" id="catalogGrid"></div>

    <!-- Смарт-Чек активного клиента -->
    <div class="cart-section">
        <div class="cart-header">
            <span style="font-weight:700; font-size:15px;" id="cartTitle">Чек Клиента #1</span>
            <button class="icon-btn" style="color:var(--accent-danger); padding:4px 8px; font-size:11px;" onclick="clearCurrentCart()">Очистить</button>
        </div>

        <!-- Переключатель клиентов -->
        <div class="cart-tabs" id="clientTabs"></div>

        <!-- Позиции текущего чека -->
        <div class="cart-items" id="cartItemsList"></div>

        <!-- Выбор оплаты -->
        <div style="font-size:10px; font-weight:700; color:var(--text-muted); text-transform:uppercase; margin-bottom:6px;">Тип оплаты</div>
        <div class="pay-grid">
            <div class="pay-btn active" onclick="setPayMethod('Нал')">Нал</div>
            <div class="pay-btn" onclick="setPayMethod('Перевод')">Перевод</div>
            <div class="pay-btn" onclick="setPayMethod('Терминал')">Терминал</div>
            <div class="pay-btn" onclick="setPayMethod('Долг')">Долг</div>
        </div>

        <!-- Мета чека -->
        <div class="cart-meta">
            <div class="field-group">
                <label>Примечание</label>
                <input type="text" id="clientNote" placeholder="напр. Муса Вип" oninput="updateClientMeta()">
            </div>
            <div class="field-group">
                <label>Время</label>
                <div style="display:flex; gap:4px;">
                    <input type="text" id="clientTime" placeholder="14:30" oninput="updateClientMeta()">
                    <button class="icon-btn" style="padding:0 8px;" onclick="setCurrentTime()">🕒</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Заметки по смене -->
    <div class="notes-card">
        <div class="field-group" style="margin-bottom:10px;">
            <label>Расходы смены</label>
            <input type="text" id="expensesInput" placeholder="не было" onchange="saveAllData()">
        </div>
        <div class="field-group">
            <label>Заметки по клубникам</label>
            <input type="text" id="strawberriesInput" placeholder="продаж не было" onchange="saveAllData()">
        </div>
    </div>

    <!-- Нижняя панель действий -->
    <div class="action-bar">
        <button class="btn-submit" onclick="copyFinalReport()">
            <span>📋 Скопировать итоговый отчёт</span>
        </button>
    </div>

    <!-- МОДАЛКА 1: Калькулятор позиций (Вес/Штуки) -->
    <div class="modal-overlay" id="calcModal">
        <div class="modal-sheet">
            <div class="sheet-pill"></div>
            <h3 id="calcTitle" style="font-size:18px; font-weight:700; margin-bottom:4px;"></h3>
            <div id="calcSubtitle" style="font-size:12px; color:var(--text-muted); margin-bottom:14px;"></div>

            <div id="weightCalcBlock" style="display:none;">
                <label style="font-size:11px; font-weight:700; color:var(--text-muted);">БЫСТРЫЙ ВЕС</label>
                <div class="preset-grid">
                    <div class="preset-btn" onclick="setGrams(250)">250 г</div>
                    <div class="preset-btn" onclick="setGrams(350)">350 г</div>
                    <div class="preset-btn" onclick="setGrams(500)">500 г</div>
                    <div class="preset-btn" onclick="setGrams(750)">750 г</div>
                    <div class="preset-btn" onclick="setGrams(1000)">1.0 кг</div>
                    <div class="preset-btn" onclick="setGrams(1500)">1.5 кг</div>
                </div>
                <div class="field-group">
                    <label>ВЕС ТОЧНО (В ГРАММАХ)</label>
                    <input type="number" id="gramsInput" placeholder="Например: 420" oninput="calculateWeightSum()">
                </div>
            </div>

            <div id="pieceCalcBlock" style="display:none;">
                <div class="field-group">
                    <label>КОЛИЧЕСТВО (ШТ)</label>
                    <input type="number" id="piecesInput" value="1" min="1">
                </div>
            </div>

            <div style="margin:16px 0; font-size:18px; font-weight:800; color:var(--accent-green);" id="calcResultPreview">Сумма: 0 ₽</div>

            <button class="btn-submit" style="width:100%;" onclick="confirmAddToCart()">Добавить в чек</button>
            <button class="icon-btn" style="width:100%; margin-top:8px; padding:12px;" onclick="closeModal('calcModal')">Отмена</button>
        </div>
    </div>

    <!-- МОДАЛКА 2: Итоговый отчёт -->
    <div class="modal-overlay" id="reportModal">
        <div class="modal-sheet">
            <div class="sheet-pill"></div>
            <h3 style="font-size:18px; font-weight:700; margin-bottom:12px;">Предпросмотр отчёта</h3>
            <div class="report-view" id="reportText"></div>
            <button class="btn-submit" style="width:100%;" onclick="copyFinalReport()">Скопировать отчёт</button>
            <button class="icon-btn" style="width:100%; margin-top:8px; padding:12px;" onclick="closeModal('reportModal')">Закрыть</button>
        </div>
    </div>

    <!-- МОДАЛКА 3: Управление каталогом -->
    <div class="modal-overlay" id="catalogModal">
        <div class="modal-sheet">
            <div class="sheet-pill"></div>
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;">
                <h3 style="font-size:18px; font-weight:700;">Редактирование каталога</h3>
                <button class="icon-btn" style="color:var(--primary);" onclick="createNewProduct()">+ Новый</button>
            </div>
            <div id="catalogManagerList" style="display:flex; flex-direction:column; gap:8px; margin-bottom:14px;"></div>
            <button class="icon-btn" style="width:100%; padding:12px;" onclick="closeModal('catalogModal')">Готово</button>
        </div>
    </div>

    <script>
        // Инициализация каталога
        let catalog = [
            { id: 1, name: "Ст.клубника в шк", price: 900, type: "piece" },
            { id: 2, name: "Ст.ананас", price: 1200, type: "piece" },
            { id: 3, name: "Клубника (кг)", price: 600, type: "weight" },
            { id: 4, name: "Роза красная", price: 250, type: "piece" },
            { id: 5, name: "Доставка", price: 350, type: "piece" }
        ];

        // Структура клиентов
        let clients = [
            { id: 1, note: '', items: [], payType: 'Нал', time: '' }
        ];
        let activeClientId = 1;
        let selectedProduct = null;

        function getAutoShiftDate() {
            const d1 = new Date();
            const d2 = new Date(d1);
            d2.setDate(d1.getDate() + 1);
            const f = (d) => String(d.getDate()).padStart(2, '0') + '.' + String(d.getMonth() + 1).padStart(2, '0');
            return `${f(d1)}-${f(d2)}`;
        }

        function initApp() {
            const saved = localStorage.getItem('strawberry_pos_v4');
            if (saved) {
                const data = JSON.parse(saved);
                catalog = data.catalog || catalog;
                clients = data.clients || clients;
                document.getElementById('shiftDate').value = data.shiftDate || getAutoShiftDate();
                document.getElementById('shiftCash').value = data.shiftCash || '10.000';
                document.getElementById('expensesInput').value = data.expenses || '';
                document.getElementById('strawberriesInput').value = data.strawberries || 'продаж не было';
            } else {
                document.getElementById('shiftDate').value = getAutoShiftDate();
                document.getElementById('strawberriesInput').value = 'продаж не было';
            }
            renderCatalog();
            renderClientTabs();
            renderCurrentCart();
        }

        function saveAllData() {
            const payload = {
                catalog,
                clients,
                shiftDate: document.getElementById('shiftDate').value,
                shiftCash: document.getElementById('shiftCash').value,
                expenses: document.getElementById('expensesInput').value,
                strawberries: document.getElementById('strawberriesInput').value
            };
            localStorage.setItem('strawberry_pos_v4', JSON.stringify(payload));
        }

        function renderCatalog() {
            const grid = document.getElementById('catalogGrid');
            grid.innerHTML = '';
            catalog.forEach(item => {
                const card = document.createElement('div');
                card.className = 'catalog-card';
                const unitText = item.type === 'weight' ? '₽ / кг' : '₽ / шт';
                card.innerHTML = `
                    <div class="catalog-card-title">${item.name}</div>
                    <div class="catalog-card-footer">
                        <span class="catalog-card-price">${item.price} ₽</span>
                        <span class="catalog-card-unit">${unitText}</span>
                    </div>
                `;
                card.onclick = () => openCalcModal(item);
                grid.appendChild(card);
            });
        }

        function renderClientTabs() {
            const tabsContainer = document.getElementById('clientTabs');
            tabsContainer.innerHTML = '';
            
            clients.forEach((c, index) => {
                const tab = document.createElement('div');
                tab.className = `cart-tab ${c.id === activeClientId ? 'active' : ''}`;
                tab.innerText = `Клиент ${index + 1}` + (c.note ? ` (${c.note})` : '');
                tab.onclick = () => {
                    activeClientId = c.id;
                    renderClientTabs();
                    renderCurrentCart();
                };
                tabsContainer.appendChild(tab);
            });

            // Кнопка добавления нового клиента
            const addBtn = document.createElement('div');
            addBtn.className = 'cart-tab';
            addBtn.style.background = 'var(--surface-elevated)';
            addBtn.innerText = '+ Добавить';
            addBtn.onclick = () => {
                const newId = Date.now();
                clients.push({ id: newId, note: '', items: [], payType: 'Нал', time: '' });
                activeClientId = newId;
                renderClientTabs();
                renderCurrentCart();
                saveAllData();
            };
            tabsContainer.appendChild(addBtn);
        }

        function getCurrentClient() {
            return clients.find(c => c.id === activeClientId) || clients[0];
        }

        function renderCurrentCart() {
            const client = getCurrentClient();
            const clientIndex = clients.findIndex(c => c.id === activeClientId);
            
            document.getElementById('cartTitle').innerText = `Чек Клиента #${clientIndex + 1}`;
            document.getElementById('clientNote').value = client.note || '';
            document.getElementById('clientTime').value = client.time || '';

            // Подсветка типа оплаты
            const payBtns = document.querySelectorAll('.pay-btn');
            payBtns.forEach(btn => {
                btn.classList.toggle('active', btn.innerText === client.payType);
            });

            // Список добавленных товаров
            const itemsList = document.getElementById('cartItemsList');
            itemsList.innerHTML = '';

            if (client.items.length === 0) {
                itemsList.innerHTML = `<div style="text-align:center; color:var(--text-muted); font-size:12px; padding:12px;">Чек пуст. Нажмите на товар выше 👆</div>`;
                return;
            }

            client.items.forEach((item, idx) => {
                const row = document.createElement('div');
                row.className = 'cart-item';
                row.innerHTML = `
                    <div>
                        <div class="cart-item-name">${item.title}</div>
                        <div class="cart-item-val">${item.detail}</div>
                    </div>
                    <div style="display:flex; align-items:center; gap:10px;">
                        <span class="cart-item-price">${item.totalPrice} ₽</span>
                        <span style="color:var(--accent-danger); cursor:pointer; font-weight:bold;" onclick="removeCartItem(${idx})">✕</span>
                    </div>
                `;
                itemsList.appendChild(row);
            });
        }

        function removeCartItem(idx) {
            const client = getCurrentClient();
            client.items.splice(idx, 1);
            renderCurrentCart();
            saveAllData();
        }

        function clearCurrentCart() {
            if (confirm('Очистить текущий чек?')) {
                const client = getCurrentClient();
                client.items = [];
                client.note = '';
                client.time = '';
                renderClientTabs();
                renderCurrentCart();
                saveAllData();
            }
        }

        function setPayMethod(type) {
            const client = getCurrentClient();
            client.payType = type;
            renderCurrentCart();
            saveAllData();
        }

        function updateClientMeta() {
            const client = getCurrentClient();
            client.note = document.getElementById('clientNote').value;
            client.time = document.getElementById('clientTime').value;
            saveAllData();
        }

        function setCurrentTime() {
            const now = new Date();
            const formatted = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            document.getElementById('clientTime').value = formatted;
            updateClientMeta();
        }

        /* --- КАЛЬКУЛЯТОР МОДАЛКА --- */
        function openCalcModal(item) {
            selectedProduct = item;
            document.getElementById('calcTitle').innerText = item.name;
            document.getElementById('calcSubtitle').innerText = item.type === 'weight' ? `Цена: ${item.price} ₽/кг` : `Цена: ${item.price} ₽/шт`;

            if (item.type === 'weight') {
                document.getElementById('weightCalcBlock').style.display = 'block';
                document.getElementById('pieceCalcBlock').style.display = 'none';
                document.getElementById('gramsInput').value = '';
                calculateWeightSum();
            } else {
                document.getElementById('weightCalcBlock').style.display = 'none';
                document.getElementById('pieceCalcBlock').style.display = 'block';
                document.getElementById('piecesInput').value = 1;
                document.getElementById('calcResultPreview').innerText = `Сумма: ${item.price} ₽`;
            }

            document.getElementById('calcModal').style.display = 'flex';
        }

        function setGrams(g) {
            document.getElementById('gramsInput').value = g;
            calculateWeightSum();
        }

        function calculateWeightSum() {
            if (!selectedProduct || selectedProduct.type !== 'weight') return;
            const grams = parseFloat(document.getElementById('gramsInput').value) || 0;
            const sum = Math.round((grams / 1000) * selectedProduct.price);
            document.getElementById('calcResultPreview').innerText = `Сумма: ${sum} ₽ (${grams}г)`;
        }

        function confirmAddToCart() {
            const client = getCurrentClient();
            let title = selectedProduct.name;
            let detail = '';
            let totalPrice = 0;

            if (selectedProduct.type === 'weight') {
                const grams = parseFloat(document.getElementById('gramsInput').value) || 0;
                if (grams <= 0) return alert('Укажите вес!');
                totalPrice = Math.round((grams / 1000) * selectedProduct.price);
                detail = `${grams} грамм`;
            } else {
                const count = parseInt(document.getElementById('piecesInput').value) || 1;
                totalPrice = selectedProduct.price * count;
                detail = `${count} шт`;
            }

            client.items.push({ title, detail, totalPrice });
            closeModal('calcModal');
            renderCurrentCart();
            saveAllData();
        }

        /* --- РЕПОРТИНГ И ЭКСПОРТ --- */
        function buildReportString() {
            const shiftDate = document.getElementById('shiftDate').value;
            const shiftCash = document.getElementById('shiftCash').value;
            const expenses = document.getElementById('expensesInput').value.trim();
            const strawberries = document.getElementById('strawberriesInput').value.trim();

            let text = `${shiftDate}\n`;
            if (shiftCash) text += `Касса: ${shiftCash}\n\n`;

            let totalCash = 0;
            let totalTransfer = 0;

            clients.forEach((c, idx) => {
                if (c.items.length === 0 && !c.note) return; // Пропускаем пустые чеки

                let head = `Клиент: ${idx + 1}`;
                if (c.note.trim()) head += ` ${c.note.trim()}`;
                text += `${head}\n`;

                let clientSum = 0;
                c.items.forEach(it => {
                    text += `${it.title} - ${it.detail}\n`;
                    clientSum += it.totalPrice;
                });

                if (c.payType === 'Нал') totalCash += clientSum;
                if (c.payType === 'Перевод' || c.payType === 'Терминал') totalTransfer += clientSum;

                let payLine = `(${c.payType}`;
                if (clientSum > 0) payLine += ` ${clientSum}`;
                if (c.time.trim()) payLine += ` ${c.time.trim()}`;
                payLine += `)\n\n`;

                text += payLine;
            });

            text += `Расход: ${expenses ? expenses : 'не было'}\n\n`;
            text += `Нал: ${totalCash > 0 ? totalCash.toLocaleString('ru-RU') : '0'}\n`;
            text += `Перевод: ${totalTransfer > 0 ? totalTransfer.toLocaleString('ru-RU') : '0'}\n\n`;
            text += `По клубникам: ${strawberries ? strawberries : 'продаж не было'}`;

            return text;
        }

        function openReportModal() {
            document.getElementById('reportText').innerText = buildReportString();
            document.getElementById('reportModal').style.display = 'flex';
        }

        function copyFinalReport() {
            const str = buildReportString();
            navigator.clipboard.writeText(str).then(() => {
                alert('✅ Отчёт скопирован в буфер!');
            }).catch(() => {
                alert('Скопируйте текст отчёта вручную');
            });
        }

        /* --- УПРАВЛЕНИЕ КАТАЛОГОМ --- */
        function openCatalogManager() {
            const list = document.getElementById('catalogManagerList');
            list.innerHTML = '';
            catalog.forEach((item, index) => {
                const row = document.createElement('div');
                row.style.cssText = 'display:flex; justify-content:space-between; align-items:center; background:var(--surface-elevated); padding:10px; border-radius:10px;';
                row.innerHTML = `
                    <div>
                        <div style="font-weight:600; font-size:13px;">${item.name}</div>
                        <div style="font-size:11px; color:var(--accent-green);">${item.price} ₽ (${item.type === 'weight' ? 'кг' : 'шт'})</div>
                    </div>
                    <button class="icon-btn" style="color:var(--accent-danger);" onclick="deleteProduct(${index})">Удалить</button>
                `;
                list.appendChild(row);
            });
            document.getElementById('catalogModal').style.display = 'flex';
        }

        function createNewProduct() {
            const name = prompt('Название товара:');
            if (!name) return;
            const price = parseFloat(prompt('Цена (в рублях):'));
            if (!price) return;
            const isWeight = confirm('Товар весовой? (ОК - да, Отмена - штучный)');

            catalog.push({
                id: Date.now(),
                name,
                price,
                type: isWeight ? 'weight' : 'piece'
            });

            renderCatalog();
            openCatalogManager();
            saveAllData();
        }

        function deleteProduct(index) {
            if (confirm('Удалить товар из каталога?')) {
                catalog.splice(index, 1);
                renderCatalog();
                openCatalogManager();
                saveAllData();
            }
        }

        function closeModal(id) {
            document.getElementById(id).style.display = 'none';
        }

        window.onload = initApp;
    </script>
</body>
</html>
