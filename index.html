<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Strawberry POS</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Касса">
    <link rel="apple-touch-icon" href="https://img.icons8.com/emoji/192/strawberry-emoji.png">

    <style>
        :root {
            --bg: #000000;
            --card: #121212;
            --card-sub: #1c1c1e;
            --border: #2c2c2e;
            --accent: #0a84ff;
            --accent-green: #30d158;
            --danger: #ff453a;
            --text-main: #ffffff;
            --text-sub: #8e8e93;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            padding: 12px;
            padding-bottom: 110px;
            padding-top: max(12px, env(safe-area-inset-top));
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 4px 2px 12px 2px;
        }

        .header h1 {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .btn-sm {
            background: var(--card-sub);
            color: var(--text-sub);
            border: 1px solid var(--border);
            padding: 6px 12px;
            border-radius: 18px;
            font-size: 12px;
            font-weight: 600;
        }
        .btn-sm:active { transform: scale(0.96); }

        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 12px;
            margin-bottom: 10px;
        }

        .row { display: flex; gap: 8px; }
        .row > div { flex: 1; }

        label {
            display: block;
            font-size: 11px;
            font-weight: 600;
            color: var(--text-sub);
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 0.2px;
        }

        input, textarea, select {
            width: 100%;
            background: #000;
            border: 1px solid var(--border);
            color: #fff;
            padding: 9px 11px;
            border-radius: 10px;
            font-size: 14px;
            outline: none;
        }
        input:focus, textarea:focus { border-color: var(--accent); }

        /* ЛЕНТА КАТАЛОГА (КОМПАКТНАЯ) */
        .catalog-bar {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 6px;
            scrollbar-width: none;
        }
        .catalog-bar::-webkit-scrollbar { display: none; }

        .prod-chip {
            background: var(--card-sub);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 8px 10px;
            min-width: 115px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            cursor: pointer;
            transition: transform 0.1s, border-color 0.1s;
        }
        .prod-chip:active { transform: scale(0.95); border-color: var(--accent); }

        .prod-title { font-size: 12px; font-weight: 600; color: #fff; padding-right: 14px; line-height: 1.2; }
        .prod-price { font-size: 11px; color: var(--accent-green); font-weight: 700; margin-top: 4px; }

        .edit-icon {
            position: absolute;
            top: 6px;
            right: 6px;
            font-size: 11px;
            opacity: 0.5;
            padding: 2px;
        }
        .edit-icon:active { opacity: 1; }

        .add-chip-btn {
            background: rgba(10, 132, 255, 0.1);
            border: 1px dashed var(--accent);
            color: var(--accent);
            border-radius: 12px;
            padding: 8px 14px;
            font-size: 12px;
            font-weight: 600;
            white-space: nowrap;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        /* КЛИЕНТЫ */
        .client-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 12px;
            margin-bottom: 10px;
        }

        .client-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .segmented {
            display: flex;
            background: #000;
            padding: 2px;
            border-radius: 10px;
            border: 1px solid var(--border);
            margin-bottom: 8px;
        }

        .seg-btn {
            flex: 1;
            text-align: center;
            padding: 6px 0;
            font-size: 11px;
            font-weight: 600;
            color: var(--text-sub);
            border-radius: 8px;
        }

        .seg-btn.active { background: var(--card-sub); color: #fff; }

        .btn-add-client {
            background: var(--accent);
            color: #fff;
            border: none;
            padding: 12px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 14px;
            width: 100%;
            margin-bottom: 10px;
        }
        .btn-add-client:active { transform: scale(0.98); }

        .preview {
            background: #000;
            color: var(--accent-green);
            font-family: monospace;
            padding: 10px;
            border-radius: 10px;
            font-size: 11px;
            white-space: pre-wrap;
            max-height: 130px;
            overflow-y: auto;
            border: 1px solid var(--border);
        }

        .bottom-bar {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid var(--border);
            padding: 10px 14px max(10px, env(safe-area-inset-bottom)) 14px;
            z-index: 100;
        }

        .btn-copy {
            background: var(--accent-green);
            color: #fff;
            border: none;
            padding: 14px;
            border-radius: 14px;
            font-weight: 700;
            font-size: 15px;
            width: 100%;
        }

        /* iOS BOTTOM SHEET (ШТОРКА СНИЗУ) */
        .sheet-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(4px);
            z-index: 200;
            align-items: flex-end;
        }

        .sheet-body {
            background: #1c1c1e;
            border-top: 1px solid var(--border);
            border-radius: 20px 20px 0 0;
            padding: 16px 16px max(16px, env(safe-area-inset-bottom)) 16px;
            width: 100%;
            animation: slideUp 0.25s cubic-bezier(0.1, 0.9, 0.2, 1);
        }

        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }

        .sheet-drag {
            width: 36px;
            height: 4px;
            background: var(--border);
            border-radius: 2px;
            margin: 0 auto 12px auto;
        }

        .quick-weight-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
            margin: 10px 0;
        }

        .qw-btn {
            background: #000;
            border: 1px solid var(--border);
            color: #fff;
            padding: 8px 0;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            text-align: center;
        }
        .qw-btn:active { background: var(--accent); }
    </style>
</head>
<body>

    <div class="header">
        <h1>🍓 Strawberry POS</h1>
        <button class="btn-sm" onclick="resetShift()">Сброс смены</button>
    </div>

    <!-- ДАТА И КАССА -->
    <div class="card">
        <div class="row">
            <div>
                <label>Даты смены</label>
                <input type="text" id="shiftDate" oninput="saveData()">
            </div>
            <div>
                <label>Касса</label>
                <input type="text" id="cashRegister" value="10.000" oninput="saveData()">
            </div>
        </div>
    </div>

    <!-- КАТАЛОГ (БЫСТРЫЙ ВЫБОР) -->
    <div style="margin-bottom: 10px;">
        <label style="padding-left:2px;">Товары быстрого доступа</label>
        <div class="catalog-bar" id="catalogBar"></div>
    </div>

    <!-- КЛИЕНТЫ -->
    <div id="clientsContainer"></div>
    <button class="btn-add-client" onclick="addClient()">+ Добавить клиента</button>

    <!-- РАСХОД И КЛУБНИКА -->
    <div class="card">
        <div class="row" style="margin-bottom: 8px;">
            <div>
                <label>Расход</label>
                <input type="text" id="expenses" placeholder="не было" oninput="saveData()">
            </div>
            <div style="flex:0.35; display:flex; align-items:flex-end;">
                <button class="btn-sm" style="width:100%; padding:9px; border-radius:10px;" onclick="document.getElementById('expenses').value='не было'; saveData();">Не было</button>
            </div>
        </div>
        <label>По клубникам</label>
        <input type="text" id="strawberries" placeholder="продаж не было" oninput="saveData()">
    </div>

    <!-- ПРЕДПРОСМОТР -->
    <div class="card">
        <label>Отчёт</label>
        <div class="preview" id="reportPreview"></div>
    </div>

    <!-- НИЖНЯЯ ПАНЕЛЬ -->
    <div class="bottom-bar">
        <button class="btn-copy" onclick="copyReport()">📋 Скопировать отчёт</button>
    </div>

    <!-- ШТОРКА 1: ДОБАВЛЕНИЕ ТОВАРА В ЧЕК -->
    <div class="sheet-overlay" id="addItemSheet">
        <div class="sheet-body">
            <div class="sheet-drag"></div>
            <h3 id="sheetProdTitle" style="font-size:16px; margin-bottom:10px;"></h3>
            
            <div id="pieceMode">
                <label>Количество (шт)</label>
                <input type="number" id="pieceInput" value="1" min="1" style="margin-bottom:12px;">
            </div>

            <div id="weightMode" style="display:none;">
                <label>Быстрый вес</label>
                <div class="quick-weight-grid">
                    <div class="qw-btn" onclick="setGrams(250)">250г</div>
                    <div class="qw-btn" onclick="setGrams(500)">500г</div>
                    <div class="qw-btn" onclick="setGrams(750)">750г</div>
                    <div class="qw-btn" onclick="setGrams(1000)">1 кг</div>
                </div>
                <label>Или введите точный вес (в граммах)</label>
                <input type="number" id="weightInput" placeholder="например: 350" oninput="updateWeightCalc()">
                <div style="margin-top:8px; font-size:14px; color:var(--accent-green); font-weight:700;" id="weightCalcText">Сумма: 0 ₽</div>
            </div>

            <button class="btn-add-client" style="margin-top:12px;" onclick="confirmAddItem()">Добавить в чек</button>
            <button class="btn-sm" style="width:100%;" onclick="closeSheet('addItemSheet')">Отмена</button>
        </div>
    </div>

    <!-- ШТОРКА 2: РЕДАКТИРОВАНИЕ ТОВАРА В БАЗЕ -->
    <div class="sheet-overlay" id="editProductSheet">
        <div class="sheet-body">
            <div class="sheet-drag"></div>
            <h3 id="editSheetTitle" style="font-size:16px; margin-bottom:10px;">Настройка товара</h3>
            
            <label>Название</label>
            <input type="text" id="editProdName" style="margin-bottom:10px;">
            
            <label>Тип товара</label>
            <select id="editProdType" style="margin-bottom:10px;">
                <option value="piece">Штучный (шт)</option>
                <option value="weight">Весовой (за 1 кг)</option>
            </select>

            <label>Цена (₽)</label>
            <input type="number" id="editProdPrice" style="margin-bottom:14px;">

            <button class="btn-add-client" style="margin-bottom:8px;" onclick="saveProductChanges()">Сохранить изменения</button>
            <button class="btn-sm" style="width:100%; color:var(--danger); border-color:rgba(255,69,58,0.3); margin-bottom:8px;" id="btnDeleteProd" onclick="deleteProduct()">Удалить товар из базы</button>
            <button class="btn-sm" style="width:100%;" onclick="closeSheet('editProductSheet')">Отмена</button>
        </div>
    </div>

    <script>
        let catalog = [
            { id: 1, name: "Клубника в шк", price: 900, type: "piece" },
            { id: 2, name: "Ананас в шк", price: 1200, type: "piece" },
            { id: 3, name: "Клубника (кг)", price: 600, type: "weight" },
            { id: 4, name: "Роза красная", price: 250, type: "piece" },
            { id: 5, name: "Доставка", price: 350, type: "piece" }
        ];

        let clients = [];
        let activeProd = null;
        let editingProdId = null;

        function initDate() {
            const today = new Date();
            const tomorrow = new Date(today);
            tomorrow.setDate(today.getDate() + 1);
            const fmt = (d) => String(d.getDate()).padStart(2, '0') + '.' + String(d.getMonth() + 1).padStart(2, '0');
            return `${fmt(today)}-${fmt(tomorrow)}`;
        }

        function renderCatalog() {
            const container = document.getElementById('catalogBar');
            container.innerHTML = '';

            // Кнопка добавить новый
            const addBtn = document.createElement('div');
            addBtn.className = 'add-chip-btn';
            addBtn.innerText = '+ Товар';
            addBtn.onclick = () => openEditSheet(null);
            container.appendChild(addBtn);

            catalog.forEach(item => {
                const chip = document.createElement('div');
                chip.className = 'prod-chip';
                const unit = item.type === 'weight' ? '₽/кг' : '₽';
                
                chip.innerHTML = `
                    <span class="edit-icon" onclick="event.stopPropagation(); openEditSheet(${item.id});">✏️</span>
                    <div class="prod-title">${item.name}</div>
                    <div class="prod-price">${item.price} ${unit}</div>
                `;
                chip.onclick = () => openAddSheet(item);
                container.appendChild(chip);
            });
        }

        function openAddSheet(item) {
            activeProd = item;
            document.getElementById('sheetProdTitle').innerText = item.name;
            
            if (item.type === 'piece') {
                document.getElementById('pieceMode').style.display = 'block';
                document.getElementById('weightMode').style.display = 'none';
                document.getElementById('pieceInput').value = 1;
            } else {
                document.getElementById('pieceMode').style.display = 'none';
                document.getElementById('weightMode').style.display = 'block';
                document.getElementById('weightInput').value = '';
                updateWeightCalc();
            }
            document.getElementById('addItemSheet').style.display = 'flex';
        }

        function setGrams(g) {
            document.getElementById('weightInput').value = g;
            updateWeightCalc();
        }

        function updateWeightCalc() {
            if (!activeProd || activeProd.type !== 'weight') return;
            const grams = parseFloat(document.getElementById('weightInput').value) || 0;
            const price = Math.round((grams / 1000) * activeProd.price);
            document.getElementById('weightCalcText').innerText = `Сумма: ${price} ₽ (${grams}г)`;
        }

        function confirmAddItem() {
            if (clients.length === 0) addClient(false);
            const lastIdx = clients.length - 1;
            let text = '';
            let sum = 0;

            if (activeProd.type === 'piece') {
                const count = parseInt(document.getElementById('pieceInput').value) || 1;
                text = `${activeProd.name} - ${count}`;
                sum = activeProd.price * count;
            } else {
                const grams = parseFloat(document.getElementById('weightInput').value) || 0;
                sum = Math.round((grams / 1000) * activeProd.price);
                text = `${activeProd.name} - ${grams}г`;
            }

            if (clients[lastIdx].items) clients[lastIdx].items += '\n' + text;
            else clients[lastIdx].items = text;

            const currentAmt = parseFloat(clients[lastIdx].amount) || 0;
            clients[lastIdx].amount = currentAmt + sum;

            closeSheet('addItemSheet');
            renderClients();
            saveData();
        }

        function openEditSheet(id) {
            editingProdId = id;
            if (id === null) {
                document.getElementById('editSheetTitle').innerText = 'Новый товар';
                document.getElementById('editProdName').value = '';
                document.getElementById('editProdType').value = 'piece';
                document.getElementById('editProdPrice').value = '';
                document.getElementById('btnDeleteProd').style.display = 'none';
            } else {
                const item = catalog.find(x => x.id === id);
                document.getElementById('editSheetTitle').innerText = 'Редактировать товар';
                document.getElementById('editProdName').value = item.name;
                document.getElementById('editProdType').value = item.type;
                document.getElementById('editProdPrice').value = item.price;
                document.getElementById('btnDeleteProd').style.display = 'block';
            }
            document.getElementById('editProductSheet').style.display = 'flex';
        }

        function saveProductChanges() {
            const name = document.getElementById('editProdName').value.trim();
            const type = document.getElementById('editProdType').value;
            const price = parseFloat(document.getElementById('editProdPrice').value) || 0;

            if (!name || price <= 0) return alert('Заполните название и цену!');

            if (editingProdId === null) {
                catalog.push({ id: Date.now(), name, type, price });
            } else {
                const item = catalog.find(x => x.id === editingProdId);
                if (item) { item.name = name; item.type = type; item.price = price; }
            }

            closeSheet('editProductSheet');
            renderCatalog();
            saveData();
        }

        function deleteProduct() {
            if (editingProdId && confirm('Удалить товар из панели быстрого доступа?')) {
                catalog = catalog.filter(x => x.id !== editingProdId);
                closeSheet('editProductSheet');
                renderCatalog();
                saveData();
            }
        }

        function closeSheet(id) { document.getElementById(id).style.display = 'none'; }

        function loadData() {
            const saved = localStorage.getItem('pos_strawberry_v2');
            if (saved) {
                const data = JSON.parse(saved);
                document.getElementById('shiftDate').value = data.shiftDate || initDate();
                document.getElementById('cashRegister').value = data.cashRegister || '10.000';
                document.getElementById('expenses').value = data.expenses || '';
                document.getElementById('strawberries').value = data.strawberries || 'продаж не было';
                clients = data.clients || [];
                if (data.catalog) catalog = data.catalog;
            } else {
                document.getElementById('shiftDate').value = initDate();
                document.getElementById('strawberries').value = 'продаж не было';
            }

            if (clients.length === 0) addClient(false);
            else renderClients();

            renderCatalog();
            updateReport();
        }

        function saveData() {
            const data = {
                shiftDate: document.getElementById('shiftDate').value,
                cashRegister: document.getElementById('cashRegister').value,
                expenses: document.getElementById('expenses').value,
                strawberries: document.getElementById('strawberries').value,
                clients, catalog
            };
            localStorage.setItem('pos_strawberry_v2', JSON.stringify(data));
            updateReport();
        }

        function addClient(shouldSave = true) {
            clients.push({ name: '', items: '', payType: 'Нал', amount: '', time: '' });
            renderClients();
            if (shouldSave) saveData();
        }

        function removeClient(index) {
            clients.splice(index, 1);
            if (clients.length === 0) addClient(false);
            renderClients();
            saveData();
        }

        function setPayType(index, type) {
            clients[index].payType = type;
            renderClients();
            saveData();
        }

        function setTimeNow(index) {
            const now = new Date();
            clients[index].time = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            renderClients();
            saveData();
        }

        function renderClients() {
            const container = document.getElementById('clientsContainer');
            container.innerHTML = '';

            clients.forEach((c, i) => {
                const card = document.createElement('div');
                card.className = 'client-card';
                card.innerHTML = `
                    <div class="client-header">
                        <strong>Клиент ${i + 1}</strong>
                        ${clients.length > 1 ? `<span style="color:var(--danger); font-size:12px; font-weight:600; cursor:pointer;" onclick="removeClient(${i})">Удалить</span>` : ''}
                    </div>
                    <input type="text" placeholder="Примечание (напр., Муса Вип)" value="${c.name}" style="margin-bottom:6px;" oninput="clients[${i}].name = this.value; saveData();">
                    
                    <textarea placeholder="Состав заказа" rows="2" style="margin-bottom:6px;" oninput="clients[${i}].items = this.value; saveData();">${c.items}</textarea>

                    <div class="segmented">
                        <div class="seg-btn ${c.payType==='Нал'?'active':''}" onclick="setPayType(${i}, 'Нал')">Нал</div>
                        <div class="seg-btn ${c.payType==='Перевод'?'active':''}" onclick="setPayType(${i}, 'Перевод')">Перевод</div>
                        <div class="seg-btn ${c.payType==='Терминал'?'active':''}" onclick="setPayType(${i}, 'Терминал')">Терминал</div>
                        <div class="seg-btn ${c.payType==='Долг'?'active':''}" onclick="setPayType(${i}, 'Долг')">Долг</div>
                    </div>

                    <div class="row">
                        <input type="number" placeholder="Сумма (₽)" value="${c.amount}" oninput="clients[${i}].amount = this.value; saveData();">
                        <input type="text" placeholder="Время (01:27)" value="${c.time}" oninput="clients[${i}].time = this.value; saveData();">
                        <button class="btn-sm" style="background:#2c2c2e; color:#fff;" onclick="setTimeNow(${i})">🕒</button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function generateReportText() {
            const shiftDate = document.getElementById('shiftDate').value;
            const cashRegister = document.getElementById('cashRegister').value;
            const expenses = document.getElementById('expenses').value.trim();
            const strawberries = document.getElementById('strawberries').value.trim();

            let report = `${shiftDate}\n`;
            if (cashRegister) report += `Касса: ${cashRegister}\n\n`;

            let totalCash = 0;
            let totalTransfer = 0;

            clients.forEach((c, idx) => {
                let title = `Клиент: ${idx + 1}`;
                if (c.name.trim()) title += ` ${c.name.trim()}`;
                
                report += `${title}\n`;
                if (c.items.trim()) report += `${c.items.trim()}\n`;

                let payLine = `(${c.payType}`;
                if (c.amount) {
                    const amt = parseFloat(c.amount) || 0;
                    payLine += ` ${c.amount}`;
                    if (c.payType === 'Нал') totalCash += amt;
                    if (c.payType === 'Перевод' || c.payType === 'Терминал') totalTransfer += amt;
                }
                if (c.time.trim()) payLine += ` ${c.time.trim()}`;
                payLine += `)\n\n`;
                
                report += payLine;
            });

            report += `Расход: ${expenses ? expenses : 'не было'}\n\n`;
            report += `Нал: ${totalCash > 0 ? totalCash.toLocaleString('ru-RU') : '0'}\n`;
            report += `Перевод: ${totalTransfer > 0 ? totalTransfer.toLocaleString('ru-RU') : '0'}\n\n`;
            report += `По клубникам: ${strawberries ? strawberries : 'продаж не было'}`;

            return report;
        }

        function updateReport() {
            document.getElementById('reportPreview').innerText = generateReportText();
        }

        function copyReport() {
            const text = generateReportText();
            navigator.clipboard.writeText(text).then(() => {
                alert('✅ Отчёт скопирован!');
            }).catch(() => {
                alert('Скопируйте текст из предпросмотра вручную.');
            });
        }

        function resetShift() {
            if (confirm('Очистить данные смены?')) {
                localStorage.removeItem('pos_strawberry_v2');
                clients = [];
                document.getElementById('expenses').value = '';
                document.getElementById('strawberries').value = 'продаж не было';
                loadData();
            }
        }

        loadData();
    </script>
</body>
</html>
