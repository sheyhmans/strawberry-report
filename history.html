<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>История | Strawberry POS</title>


<style>

*{
box-sizing:border-box;
font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Arial,sans-serif;
}


body{
margin:0;
background:#09090b;
color:white;
}


.app{
max-width:430px;
margin:auto;
padding:25px 18px;
}



.header{
display:flex;
align-items:center;
gap:15px;
margin-bottom:25px;
}



.back{
width:45px;
height:45px;
border-radius:15px;
background:#18181b;
display:flex;
align-items:center;
justify-content:center;
font-size:25px;
}



h1{
margin:0;
font-size:25px;
}


p{
color:#999;
margin:5px 0;
}



.report{

background:#18181b;

border-radius:22px;

padding:20px;

margin-bottom:15px;

border:1px solid #252525;

}



.empty{

text-align:center;

color:#777;

margin-top:40px;

}



</style>


</head>


<body>


<div class="app">


<div class="header">

<div class="back" onclick="history.back()">
‹
</div>


<div>

<h1>История</h1>

<p>Завершенные смены</p>

</div>


</div>



<div id="history">

<div class="empty">
Смен пока нет
</div>

</div>



</div>



<script>


let historyData =

JSON.parse(

localStorage.getItem("shiftHistory")

) || [];



let box =

document.getElementById("history");



if(historyData.length > 0){


box.innerHTML="";



historyData.reverse().forEach(item=>{



let clientsText="";



item.clients.forEach(c=>{


let sum=0;


c.items.forEach(i=>{

sum += i.sum;

});



clientsText += `


<div style="margin-top:15px;padding:12px;background:#111;border-radius:15px;">


<b>
${c.name}
</b>


<br>


${c.items.map(i=>

`${i.name} — ${i.amount} — ${i.sum} ₽`

).join("<br>")}


<br><br>


Итого клиента:
${sum} ₽


<br>


Оплата:

💵 ${c.payment?.cash || 0} ₽

<br>

💳 ${c.payment?.transfer || 0} ₽

<br>

🧾 ${c.payment?.terminal || 0} ₽


</div>


`;



});




box.innerHTML += `


<div class="report">


<h3>
${item.date}
</h3>


<p>
Продажи: ${item.sales} ₽
</p>


<p>
💵 Наличные: ${item.cash} ₽
</p>


<p>
💳 Перевод: ${item.transfer} ₽
</p>


<p>
🧾 Терминал: ${item.terminal} ₽
</p>



<p>
Расходы: ${item.expenseTotal} ₽
</p>



<p>
<b>
Остаток налички: ${item.finalCash} ₽
</b>
</p>



<h3>
Клиенты:
</h3>


${clientsText}


</div>


`;



});



}else{


box.innerHTML=

`
<div class="empty">
Смен пока нет
</div>
`;



}


</script>


</body>

</html>
